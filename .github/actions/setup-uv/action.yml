name: Set up uv
description: >-
  uv at the version the repo pins, with a download cache that keeps the
  wheels it fetched, so a job installs them from the GitHub cache rather
  than from PyPI, and a cache of the mirage._rs build for the same rust/.
inputs:
  save-cache:
    description: >-
      Save the cache when the job ends. The shared entry is written once per
      key, by whichever saving job finishes first, so only a job that syncs
      exactly the full set (`uv sync --all-extras`) saves
      it; a job that installs a subset restores it and saves nothing.
    default: "true"
  cache-suffix:
    description: >-
      Name an entry of the job's own. A job that installs wheels the full
      set does not (a second Python, requirements outside the
      lock) saves them under its own key rather than racing for the shared
      one, which would then lack them or lack the full set.
    default: ""
  cache-dependency-glob:
    description: >-
      The files whose hash keys the entry. The lock alone decides what a
      sync installs, so an integ fixture's pyproject does not move the key;
      a job that installs from requirements files adds them.
    default: python/uv.lock
  cargo-profile:
    description: >-
      The Cargo profile maturin builds mirage._rs with when uv builds the
      project. `ci` (rust/Cargo.toml) skips release's fat LTO, which cost
      every job that syncs the venv about three minutes; a job that checks
      the install users get passes `release`.
    default: ci
runs:
  using: composite
  steps:
    # uv builds mirage-rs and the TypeScript build embeds its wasm, both
    # with cargo, so every job that sets up either language gets Rust too.
    # maturin builds in a directory of its own (below), so a Python job
    # takes only the cargo registry from the entry the TypeScript jobs
    # share and save.
    - uses: ./.github/actions/setup-rust
      with:
        shared-key: mirage-rs
        save: "false"

    # Compiling mirage._rs was nearly all of each `uv sync`, two to three
    # minutes in some forty-five jobs a run, and cargo rebuilt it every time:
    # it judges a crate by its files' mtimes, which a checkout sets to now.
    # So maturin builds into a directory of its own, cached under the exact
    # tree git holds for rust/, the compiler, the profile and the platform.
    # The key has no fallback: a job that restored another tree's build and
    # never compiled would save it under this tree's key.
    - name: Choose the Cargo profile and build directory for mirage._rs
      id: build
      shell: bash
      env:
        PROFILE: ${{ inputs.cargo-profile }}
      run: |
        dir="${RUNNER_TEMP//\\//}/mirage-rs"
        echo "MATURIN_PEP517_ARGS=--profile $PROFILE --target-dir $dir" >> "$GITHUB_ENV"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "key=mirage-rs-${{ runner.os }}-${{ runner.arch }}-$PROFILE-$(rustc -V | cut -d' ' -f2)-$(git rev-parse HEAD:rust)" >> "$GITHUB_OUTPUT"

    - name: Cache the build of mirage._rs
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.build.outputs.dir }}
        key: ${{ steps.build.outputs.key }}

    # The restored build was compiled from exactly these sources, so it is
    # dated after the checkout and cargo finds every crate fresh. Now, not a
    # future date: a crate cargo rebuilds later in the job must come out
    # newer than the crates it links, or cargo rebuilds it again on every
    # build, as it did for pyo3 and mirage._rs under a 2099 date. One stamp
    # for every file, since a dependency dated even a moment after its
    # dependent is stale too.
    - name: Date the restored build after the checkout
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        stamp=$(date +%Y%m%d%H%M.%S)
        find "${{ steps.build.outputs.dir }}" -exec touch -t "$stamp" {} +

    - uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.9"
        enable-cache: true
        cache-suffix: ${{ inputs.cache-suffix }}
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
        # setup-uv runs `uv cache prune --ci` before saving by default. That
        # drops every downloaded wheel and keeps only those built from source
        # (27 MB), so each job fetched all ~530 packages from PyPI again:
        # seconds on most runners, two minutes on one in ten, a quarter of
        # an hour on the worst, while the GitHub cache restored at 120 MB/s.
        prune-cache: false
        save-cache: ${{ inputs.save-cache }}
