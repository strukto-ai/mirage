name: Set up Rust
description: >-
  The toolchain rust/rust-toolchain.toml pins, wasm target included, and a
  cache of the cargo registry and rust/target, so `uv sync` can build
  mirage-rs and the TypeScript build can embed its wasm.
# setup-uv and setup-node-pnpm both run this, so a job using both gets it
# twice; the second run finds MIRAGE_RUST_READY and does nothing.
inputs:
  shared-key:
    description: >-
      Name an entry the jobs passing it share. Without one, each job keeps
      an entry of its own.
    default: ""
  save:
    description: >-
      Save the entry when the job ends on main. A job that never builds in
      rust/target passes false, so the entry it shares holds what the jobs
      that do build there need.
    default: "true"
runs:
  using: composite
  steps:
    # The toolchain file covers only what runs under rust/. maturin runs
    # cargo from python/, where rustup fell back to the runner image's own
    # default, and that differs between images GitHub rolls out side by
    # side: a mirage._rs build cached on one image compiled from scratch on
    # the other. Making the pin the default gives every cargo in the job the
    # compiler the cache keys name.
    - name: Install the pinned toolchain
      if: env.MIRAGE_RUST_READY != 'true'
      shell: bash
      working-directory: rust
      run: |
        rustup toolchain install
        rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

    - name: Cache cargo and rust/target
      if: env.MIRAGE_RUST_READY != 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: rust
        shared-key: ${{ inputs.shared-key }}
        # An entry is 70 to 270 MB, so PRs saving their own would push the
        # uv and pnpm caches out of the repository's 10 GB. A PR restores
        # main's entries instead, which every branch can read.
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save == 'true' }}

    - name: Mark Rust as set up
      shell: bash
      run: echo "MIRAGE_RUST_READY=true" >> "$GITHUB_ENV"
