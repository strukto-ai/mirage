name: Set up Node and pnpm
description: >-
  pnpm plus Node, with the pnpm store and node-gyp's header cache both keyed
  on the Node version the job actually runs.
inputs:
  node-version:
    description: >-
      Node major version to install. It is part of both cache keys, so two
      jobs on different majors never share a store.
    required: true
  pnpm-version:
    description: pnpm version to install.
    default: "10.32.1"
  wasm-cache:
    description: >-
      Take the wasm modules core embeds and the SDK modules the Cloudflare
      build shrinks from an earlier run built from the same sources. The
      release passes false, so the tarballs it packs carry the modules it
      compiled itself.
    default: "true"
runs:
  using: composite
  steps:
    # uv builds mirage-rs and the TypeScript build embeds its wasm, both
    # with cargo, so every job that sets up either language gets Rust too.
    # Building the wasm is the only use these jobs make of rust/target, so
    # they share one entry, not one each: 32 entries had held 2.8 GB.
    - uses: ./.github/actions/setup-rust
      with:
        shared-key: mirage-rs

    - name: Install pnpm
      uses: pnpm/action-setup@v6.0.10
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Read the installed Node version
      id: node
      shell: bash
      run: echo "node-version=$(node --version)" >> "$GITHUB_OUTPUT"

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Not `cache: pnpm` on setup-node: that keys the store on the lockfile
    # alone, so every job in the repo shared one store whatever Node it ran.
    # pnpm caches a package's build side-effects in the store, and those are
    # per-ABI, so the Node 24 jobs restored a store holding the Node 22 build
    # of @zkochan/fuse-native (the one onlyBuiltDependencies entry) and
    # recompiled it, which sends node-gyp to nodejs.org for the headers.
    # The restore was an exact key hit, so nothing ever re-saved and the Node
    # 24 build was never kept: every Node 24 job re-fetched, every run.
    - name: Cache the pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.dir }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ hashFiles('typescript/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-

    # The headers node-gyp downloads, so a cold store still compiles without
    # reaching the network. node-gyp does not retry that fetch: `attempt 1
    # failed with ECONNRESET` is the end of the install, and on 2026-09-05 one
    # reset socket in the integ bootstrap job failed the 13 jobs waiting on
    # its build artifact. Keyed on the resolved version rather than the major,
    # so a runner's Node minor bump misses and re-saves instead of pinning the
    # cache to headers nobody wants any more.
    - name: Cache the node-gyp headers
      uses: actions/cache@v6
      with:
        path: ~/.cache/node-gyp
        key: node-gyp-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}

    # Compiling the three wasm modules was four and a half of the five minutes
    # a full `pnpm install` took, in each of some twenty jobs a run. Only rust/
    # and the core build scripts decide their bytes, so the key is both as git holds
    # them, which a fresh checkout is. embed-rs reads a module found in the
    # directory and writes one it compiled there; a job that never builds them
    # leaves it absent, and the cache saves nothing for that job.
    - name: Name the wasm modules' cache
      if: inputs.wasm-cache == 'true'
      id: wasm
      shell: bash
      run: |
        rust=$(git rev-parse HEAD:rust)
        scripts=$(git rev-parse HEAD:typescript/packages/core/scripts)
        echo "key=embed-rs-${{ runner.os }}-$rust-$scripts" >> "$GITHUB_OUTPUT"
        echo "MIRAGE_WASM_CACHE=$RUNNER_TEMP/embed-rs" >> "$GITHUB_ENV"
        echo "MIRAGE_WASM_OPT_CACHE=$RUNNER_TEMP/wasm-opt" >> "$GITHUB_ENV"

    - name: Cache the wasm modules
      if: inputs.wasm-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/embed-rs
        key: ${{ steps.wasm.outputs.key }}

    # wasm-opt shrinking the Monty and 1Password SDK modules was ten and a
    # half of the twelve minutes the build took in pre-commit. Kept beside
    # core's modules, it was saved only when the first job to save a rust/
    # tree had built Cloudflare, so nearly every run shrank them again. Their
    # bytes come from the lockfile and the scripts that strip and shrink them,
    # never from rust/, so they keep an entry of their own under those three.
    - name: Cache the shrunk SDK modules
      if: inputs.wasm-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/wasm-opt
        key: wasm-opt-${{ runner.os }}-${{ hashFiles('typescript/pnpm-lock.yaml', 'typescript/packages/cloudflare/scripts/optimize-wasm.mjs', 'typescript/packages/core/scripts/strip-custom-sections.mjs') }}
