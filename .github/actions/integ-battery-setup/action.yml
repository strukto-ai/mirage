name: Integ battery setup
description: >-
  Toolchain + shared fake-server fleet for the declarative integ battery.
  Both the python-host and typescript-host battery jobs use this so the
  setup stays defined once.
inputs:
  build-packages:
    description: >-
      Build the mirage TypeScript packages (core/node/browser). Required by
      the typescript-host battery; the python host only needs node for the
      tsx fake servers (which import no mirage package), so it passes false.
    default: "true"
  typescript-build-artifact:
    description: >-
      Download prebuilt TypeScript dist outputs from this artifact instead of
      rebuilding them in the current job.
    default: ""
  start-services:
    description: Start the shared backend services used by the batteries.
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install uv
      uses: ./.github/actions/setup-uv
    - name: Install Python dependencies
      working-directory: python
      shell: bash
      run: uv sync --all-extras
    - name: Set up Node and pnpm
      uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '24'
    - name: Install dependencies
      working-directory: typescript
      shell: bash
      run: pnpm install --frozen-lockfile=false

    # Built here rather than downloaded from a bootstrap job, which held
    # every typescript-host job back by a minute and a half before it could
    # start. The build runs in the background while the rest of this setup
    # does (Prisma clients, services, fakes; none imports a mirage package),
    # and the last step collects it.
    - name: Start the mirage TypeScript build (background)
      if: ${{ inputs.build-packages == 'true' && inputs.typescript-build-artifact == '' }}
      shell: bash
      run: |
        integ/scripts/background.sh start typescript-build \
          'cd typescript && pnpm --filter @struktoai/mirage-core --filter @struktoai/mirage-node --filter @struktoai/mirage-browser build'

    # Every kit fake imports a generated Prisma client out of integ/generated/,
    # which is gitignored, so all of them have to exist before any fake starts.
    # One step rather than one per fake: letting a fake rely on an earlier
    # fake's step to have generated its client couples the two by accident.
    - name: Generate integ Prisma clients
      working-directory: integ
      shell: bash
      run: pnpm run prisma:clients
    - name: Download TypeScript build outputs
      if: ${{ inputs.typescript-build-artifact != '' }}
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        name: ${{ inputs.typescript-build-artifact }}
        path: typescript/packages
    - name: Start moto S3
      if: ${{ inputs.start-services == 'true' }}
      shell: bash
      run: |
        nohup ./python/.venv/bin/moto_server -H 127.0.0.1 -p 5001 > /tmp/moto.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:5001/moto-api/ > /dev/null && break
          sleep 1
        done
        echo "S3_ENDPOINT=http://127.0.0.1:5001" >> "$GITHUB_ENV"
        echo "S3_REGION=us-east-1" >> "$GITHUB_ENV"
        echo "AWS_ACCESS_KEY_ID=testing" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=testing" >> "$GITHUB_ENV"
    - name: Start sftp server
      if: ${{ inputs.start-services == 'true' }}
      shell: bash
      run: |
        nohup ./python/.venv/bin/python integ/server/ssh_server.py --port 2222 > /tmp/sshsrv.log 2>&1 &
        for i in $(seq 1 30); do
          grep -q "SSH_PORT=" /tmp/sshsrv.log && break
          sleep 1
        done
        cat /tmp/sshsrv.log
        echo "SSH_HOST=127.0.0.1" >> "$GITHUB_ENV"
        echo "SSH_PORT=2222" >> "$GITHUB_ENV"
    # Keep in sync with the observability job: 2.21 removed the v1 query
    # endpoints used by the accessor and jaeger_seed.py.
    - name: Start jaeger all-in-one and seed traces over OTLP
      if: ${{ inputs.start-services == 'true' }}
      shell: bash
      run: |
        for i in $(seq 1 5); do
          docker pull jaegertracing/jaeger:2.20.0 && break
          echo "docker pull failed (attempt $i), retrying"; sleep 10
        done
        docker run -d --name mirage-jaeger \
          -p 16686:16686 -p 4317:4317 -p 4318:4318 \
          jaegertracing/jaeger:2.20.0
        ./python/.venv/bin/python integ/server/jaeger_seed.py \
          --host http://localhost:16686 --otlp http://localhost:4318
        echo "JAEGER_URL=http://localhost:16686" >> "$GITHUB_ENV"

    # ONE process hosting every kit fake, each still on its OWN port and on the
    # SAME port number the eleven separate steps used. Only the process count
    # changes; ci/fakes.json says why every port stays pinned rather than
    # becoming ephemeral, which is a trap this suite falls into hard.
    #
    # The trade: a crash in any one fake now takes the whole process down,
    # where eleven processes lost only one. server/launcher has its own
    # selftest for that reason.
    #
    # Each fake keeps its SQLite files under the OS tmpdir in rollback-journal
    # mode, so every write commit fsyncs twice; one box run commits about
    # 18,000 times. The process dies with the job, so tmpfs loses nothing,
    # the same trade the nextcloud service makes for its data dir.
    - name: Start the kit fakes
      if: ${{ inputs.start-services == 'true' }}
      working-directory: integ
      shell: bash
      run: |
        : > /tmp/fakes.log
        TMPDIR=/dev/shm nohup ./node_modules/.bin/tsx server/launcher/main.ts \
          --config ci/fakes.json > /tmp/fakes.log 2>&1 &
        # `grep -c` PRINTS the count and still exits 1 when it is zero, so a
        # `|| echo 0` fallback appends a second line and the test sees "0\n0".
        for i in $(seq 1 60); do
          seen=$(grep -c '_URL=' /tmp/fakes.log || true)
          [ "${seen:-0}" -ge 14 ] && break
          sleep 1
        done
        cat /tmp/fakes.log
        # Fail HERE, not twenty minutes later as a connection refused inside a
        # battery. 14 lines is 11 fakes plus mail's IMAP and SMTP and hf_hub's
        # MCP arm.
        seen=$(grep -c '_URL=' /tmp/fakes.log || true)
        if [ "${seen:-0}" -lt 14 ]; then
          echo "only ${seen:-0} of 14 endpoints came up"
          exit 1
        fi
        grep -E '^[A-Z0-9_]+_URL=' /tmp/fakes.log >> "$GITHUB_ENV"
    - name: Build mirage-core, mirage-node and mirage-browser
      if: ${{ inputs.build-packages == 'true' && inputs.typescript-build-artifact == '' }}
      shell: bash
      run: integ/scripts/background.sh wait typescript-build
