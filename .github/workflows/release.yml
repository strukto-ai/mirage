name: Release

permissions:
  contents: read

# A pushed `v*` tag, or a run by hand on a branch or a tag, builds and checks
# every artifact. Nothing is published: the wheels and tarballs it uploads go
# to PyPI and npm by hand, once checked.
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag, mirage-ai, the crate and every published npm package carry one
  # version, bumped by hand, so a drift stops here.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      npm-packages: ${{ steps.check.outputs.npm-packages }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/check_release_versions.py "$TAG"

  wheels:
    needs: versions
    uses: ./.github/workflows/build_wheels.yml

  # The core build embeds the mirage-rs wasm, so it needs cargo; the tarballs
  # it packs need nothing but Node.
  npm:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          wasm-cache: "false"
      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build and pack
        working-directory: typescript
        env:
          PACKAGES: ${{ needs.versions.outputs.npm-packages }}
        run: |
          filters=()
          for name in $PACKAGES; do
            filters+=(--filter "@struktoai/mirage-$name")
          done
          pnpm -r "${filters[@]}" build
          for name in $PACKAGES; do
            pnpm --filter "@struktoai/mirage-$name" pack --pack-destination "$RUNNER_TEMP/npm"
          done
      - name: Each tarball carries the license
        run: python3 scripts/check_release_artifacts.py "$RUNNER_TEMP"/npm/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm/*.tgz

  # mirage-fuse runs on the machine, so it builds for Linux alone: one static
  # musl executable per architecture, which runs on glibc and musl alike, so
  # each wheel carries both platform tags.
  fuse:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: rust/fuse
          target: ${{ matrix.target }}
          args: --release --locked --zig --compatibility manylinux2014 musllinux_1_2 --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: mirage-fuse-wheel-${{ matrix.target }}
          path: rust/fuse/dist/*.whl

  # The npm package carries both executables, and its bin script picks the
  # one for `uname -m`. npm pack keeps their mode; pnpm pack would not.
  fuse-npm:
    needs: fuse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: mirage-fuse-wheel-*
          merge-multiple: true
          path: ${{ runner.temp }}/wheels
      - name: Pack
        run: |
          for arch in x86_64 aarch64; do
            unzip -p "$RUNNER_TEMP"/wheels/*_"$arch".whl '*.data/scripts/mirage-fuse' > "rust/fuse/bin/mirage-fuse-$arch"
            chmod +x "rust/fuse/bin/mirage-fuse-$arch"
          done
          mkdir "$RUNNER_TEMP/npm"
          (cd rust/fuse && npm pack --pack-destination "$RUNNER_TEMP/npm")
      - name: Each artifact carries the license
        run: python3 scripts/check_release_artifacts.py "$RUNNER_TEMP"/wheels/*.whl "$RUNNER_TEMP"/npm/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: mirage-fuse-npm
          path: ${{ runner.temp }}/npm/*.tgz
