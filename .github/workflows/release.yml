name: Release

permissions:
  contents: read

# A pushed `v*` tag, or a run by hand on a branch or a tag, builds and checks
# every artifact. Nothing is published: the wheels and tarballs it uploads go
# to PyPI and npm by hand, once checked.
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag, mirage-ai, the crate and every published npm package carry one
  # version, bumped by hand, so a drift stops here.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      npm-packages: ${{ steps.check.outputs.npm-packages }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/check_release_versions.py "$TAG"

  wheels:
    needs: versions
    uses: ./.github/workflows/build_wheels.yml

  # The core build embeds the mirage-rs wasm, so it needs cargo; the tarballs
  # it packs need nothing but Node.
  npm:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build and pack
        working-directory: typescript
        env:
          PACKAGES: ${{ needs.versions.outputs.npm-packages }}
        run: |
          filters=()
          for name in $PACKAGES; do
            filters+=(--filter "@struktoai/mirage-$name")
          done
          pnpm -r "${filters[@]}" build
          for name in $PACKAGES; do
            pnpm --filter "@struktoai/mirage-$name" pack --pack-destination "$RUNNER_TEMP/npm"
          done
      - name: Each tarball carries the license
        run: python3 scripts/check_release_artifacts.py "$RUNNER_TEMP"/npm/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm/*.tgz
