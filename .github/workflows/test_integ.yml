name: Integ

permissions:
  contents: read

"on":
  push:
    branches: [main]
    paths:
      - integ/**
      - data/**
      - python/**
      - typescript/**
      - .github/workflows/test_integ.yml
      - .github/actions/integ-battery-setup/action.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ts: ${{ steps.filter.outputs.ts }}
      database: ${{ steps.filter.outputs.database }}
      data: ${{ steps.filter.outputs.data }}
      fuse: ${{ steps.filter.outputs.fuse }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'integ/**'
              - 'data/**'
              - 'python/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            ts:
              - 'integ/**'
              - 'typescript/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            database:
              - 'integ/resources/mongodb/**'
              - 'integ/resources/postgres/**'
              - 'integ/targets.json'
              - 'integ/runners/**'
              - 'integ/resources/chroma/**'
              - 'python/mirage/accessor/mongodb.py'
              - 'python/mirage/core/mongodb/**'
              - 'python/mirage/commands/builtin/mongodb/**'
              - 'python/mirage/resource/mongodb/**'
              - 'python/mirage/accessor/postgres.py'
              - 'python/mirage/core/postgres/**'
              - 'python/mirage/commands/builtin/postgres/**'
              - 'python/mirage/resource/postgres/**'
              - 'python/mirage/accessor/chroma.py'
              - 'python/mirage/core/chroma/**'
              - 'python/mirage/commands/builtin/chroma/**'
              - 'python/mirage/resource/chroma/**'
              - 'integ/resources/qdrant/**'
              - 'python/mirage/accessor/qdrant.py'
              - 'python/mirage/core/qdrant/**'
              - 'python/mirage/commands/builtin/qdrant/**'
              - 'python/mirage/resource/qdrant/**'
              - 'typescript/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            data:
              - 'integ/**'
              - 'python/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            observability:
              - 'integ/server/langfuse_compose.yml'
              - 'integ/server/langfuse_seed.py'
              - 'integ/server/jaeger_seed.py'
              - 'integ/resources/observability/**'
              - 'integ/targets.json'
              - 'integ/runners/**'
              - 'python/mirage/accessor/langfuse.py'
              - 'python/mirage/accessor/jaeger.py'
              - 'python/mirage/core/langfuse/**'
              - 'python/mirage/core/jaeger/**'
              - 'python/mirage/commands/builtin/langfuse/**'
              - 'python/mirage/commands/builtin/jaeger/**'
              - 'python/mirage/resource/langfuse/**'
              - 'python/mirage/resource/jaeger/**'
              - 'typescript/packages/core/src/core/langfuse/**'
              - 'typescript/packages/core/src/core/jaeger/**'
              - 'typescript/packages/core/src/accessor/langfuse.ts'
              - 'typescript/packages/core/src/accessor/jaeger.ts'
              - 'typescript/packages/node/src/resource/langfuse/**'
              - 'typescript/packages/node/src/resource/jaeger/**'
              - '.github/workflows/test_integ.yml'
            fuse:
              - 'integ/fuse/**'
              - 'integ/check_json.py'
              - 'integ/package.json'
              - 'python/mirage/fuse/**'
              - 'python/mirage/workspace/fuse.py'
              - 'typescript/packages/node/src/fuse/**'
              - 'typescript/packages/node/src/workspace/fuse.ts'
              - 'typescript/packages/node/src/workspace.ts'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'

  typescript-build:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.database == 'true' || needs.changes.outputs.fuse == 'true' || needs.changes.outputs.observability == 'true') }}
    name: TypeScript build bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build TypeScript packages
        working-directory: typescript
        run: pnpm -r build

      - name: Upload TypeScript build outputs
        uses: actions/upload-artifact@v7
        with:
          name: integ-typescript-dist
          path: typescript/packages/*/dist
          if-no-files-found: error
          retention-days: 1

  integ:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      # Snapshot roundtrip and out-of-band-delete GC only: the per-command
      # metadata cases live in integ/unix/meta{,_overlay} now.
      - name: Run metadata snapshot/GC scenarios and check against truth
        run: |
          ./python/.venv/bin/python integ/metadata.py 2>&1 \
            | ./python/.venv/bin/python integ/check_json.py integ/truth_metadata.json

      - name: Run lancedb integ (embedded, JSON harness)
        env:
          LANCEDB_ENABLED: "1"
        run: ./python/.venv/bin/python integ/runners/python/main.py --target lancedb --strict

      - name: Run find arg-error battery (SaaS backends, dummy creds, no server)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet argerr --strict

      - name: Run cross-mount commands (ram -> ram/redis/s3 via moto)
        run: ./python/.venv/bin/python integ/cross_commands.py

      - name: Run virtual-root mount switching (ram/disk/yaml)
        run: ./python/.venv/bin/python integ/root.py

  integ-ts:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nextcloud:
        image: nextcloud:30-apache
        ports:
          - 8080:80
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin123
          NEXTCLOUD_TRUSTED_DOMAINS: localhost
    env:
      REDIS_URL: redis://localhost:6379/0
      S3_BUCKET: mirage-integ
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      NEXTCLOUD_URL: http://localhost:8080/remote.php/dav/files/admin/
      NEXTCLOUD_USERNAME: admin
      NEXTCLOUD_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Download TypeScript build outputs
        uses: actions/download-artifact@v8
        with:
          name: integ-typescript-dist
          path: typescript/packages

      - name: Wait for Nextcloud install
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud is installed"
              exit 0
            fi
            sleep 5
          done
          echo "Nextcloud did not finish installing in time" >&2
          curl -s http://localhost:8080/status.php || true
          exit 1

      - name: Run declarative battery on Nextcloud
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --target nextcloud --strict

      - name: Start MinIO
        run: |
          for i in $(seq 1 5); do
            docker pull minio/minio:latest && break
            echo "docker pull failed (attempt $i), retrying"; sleep 10
          done
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create MinIO bucket
        run: |
          for i in 1 2 3; do
            if curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc \
               && chmod +x /tmp/mc && /tmp/mc --version >/dev/null 2>&1; then
              break
            fi
            echo "mc download attempt $i failed; retrying"; sleep 3
          done
          /tmp/mc --version
          /tmp/mc alias set local http://localhost:9000 minio minio123
          /tmp/mc mb local/mirage-integ || true
          /tmp/mc mb local/mirage-integ-s3 || true
          /tmp/mc mb local/mirage-integ-gcs || true
          /tmp/mc mb local/mirage-integ-minio || true


      # Snapshot roundtrip and out-of-band-delete GC only: the per-command
      # metadata cases live in integ/unix/meta{,_overlay} now.
      # check_json.py is stdlib-only, so the runner's preinstalled python3
      # serves it; this job sets up no venv of its own.
      - name: Run metadata snapshot/GC scenarios and check against truth
        working-directory: integ
        run: pnpm exec tsx metadata.ts 2>&1 | python3 check_json.py truth_metadata.json

      - name: Run cross-mount commands (ram -> ram/s3 via MinIO)
        working-directory: integ
        run: pnpm exec tsx cross_commands.ts

      - name: Generate integ Prisma clients
        working-directory: integ
        run: pnpm run prisma:clients

      - name: Start fake Notion API (Prisma)
        working-directory: integ
        run: |
          nohup ./node_modules/.bin/tsx server/notion/main.ts --port 5091 > /tmp/notionsrv.log 2>&1 &
          for i in $(seq 1 30); do grep -q "NOTION_URL=" /tmp/notionsrv.log && break; sleep 1; done
          cat /tmp/notionsrv.log
          echo "NOTION_URL=http://127.0.0.1:5091" >> "$GITHUB_ENV"

      - name: Run notion integ (TS, mock server, JSON harness)
        working-directory: integ
        env:
          NOTION_ENABLED: "1"
        run: pnpm exec tsx runners/typescript/main.ts --target notion --strict

      - name: Run notion MCP/REST parity check (TS)
        working-directory: integ
        run: pnpm exec tsx notion_mcp_parity.ts

      # Runs every cli-ntn case through the REAL Notion CLI against the same
      # fake, so the goldens the battery asserts are by construction what the
      # official binary prints. Pinned by version; the script refuses any other.
      - name: Run ntn CLI conformance against the real binary
        working-directory: integ
        run: |
          # Installed outside the pnpm workspace so it cannot disturb
          # node_modules the rest of the job depends on.
          mkdir -p /tmp/ntncli
          (cd /tmp/ntncli && npm i --no-audit --no-fund ntn@0.21.9)
          NTN_BIN=/tmp/ntncli/node_modules/.bin/ntn pnpm exec tsx ntn_conformance.ts

      - name: Run lancedb integ (TS, embedded, JSON harness)
        working-directory: integ
        env:
          LANCEDB_ENABLED: "1"
        run: pnpm exec tsx runners/typescript/main.ts --target lancedb --strict

      - name: Run find arg-error battery (SaaS backends, dummy creds, no server)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet argerr --strict

  integ-shared-py:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      # The mail fake serves IMAP and SMTP on the ports GreenMail used, so only
      # the reset URL is new: seeding moved from an IMAP APPEND loop in each
      # adapter to one POST the fake answers.
      EMAIL_HOST: 127.0.0.1
      MAIL_URL: http://127.0.0.1:5085
      MONGODB_URI: mongodb://localhost:27017
      QUICKJS_BUILD: v0.16.2
      MIRAGE_QUICKJS_HOME: /tmp/quickjs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integ-battery-setup
        with:
          build-packages: "false"

      # The ram-scripted target's js profile script runs on quickjs,
      # which on the python host is the quickjs-ng WASI build.
      - name: Cache the quickjs WASI build
        id: quickjs-cache
        uses: actions/cache@v6
        with:
          path: /tmp/quickjs
          key: quickjs-wasi-${{ env.QUICKJS_BUILD }}

      - name: Download the quickjs WASI build
        if: steps.quickjs-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/quickjs
          gh release download "$QUICKJS_BUILD" -R quickjs-ng/quickjs \
            -p qjs-wasi.wasm -O /tmp/quickjs/qjs-wasi.wasm

      - name: Run declarative battery (python hosts)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet core --strict --allow-skip chroma,lancedb,nextcloud,notion,postgres,qdrant

      # Moved here from the `integ` job when the HTTP fixture server became a
      # TypeScript kit fake: the adapter still starts it, but the interpreter is
      # tsx now, and this is the python-host job that already has node for
      # exactly that reason.
      - name: Run curl/wget battery (HTTP fixture started by the adapter)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet http --strict

  integ-shared-ts:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      # The mail fake serves IMAP and SMTP on the ports GreenMail used, so only
      # the reset URL is new: seeding moved from an IMAP APPEND loop in each
      # adapter to one POST the fake answers.
      EMAIL_HOST: 127.0.0.1
      MAIL_URL: http://127.0.0.1:5085
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integ-battery-setup
        with:
          build-packages: "false"
          typescript-build-artifact: integ-typescript-dist

      # Every "verified by integ" claim rests on the runner failing when it
      # tests nothing, so assert the gates themselves before the battery.
      # This job hosts them because it is the only one with both halves: the
      # setup action always installs the python venv, and this job also has
      # the prebuilt mirage TypeScript dist the runner imports. --require-ts
      # turns an absent tsx into a failure rather than a silent half-run.
      - name: Assert the integ runner gates (strict exit, services, case ids)
        run: ./python/.venv/bin/python integ/runners/tools/gate_selftest.py --require-ts

      # The same argument one level down. gate_selftest asserts the runner
      # fails when it tests nothing; this asserts the kit the fakes are built
      # on still keeps its promises, none of which the battery can reach: no
      # corpus case sends a run or tenant header, and the runner awaits one
      # case at a time, so run isolation, tenant isolation and the write queue
      # are unreachable there by construction rather than by omission.
      - name: Assert the mock-server kit (run/tenant isolation, seeder, queue)
        working-directory: integ
        run: pnpm run selftest

      # Same reason one fake down. Listing and search are HTTP surface with no
      # client inside mirage: the `hf` CLI has no `models ls` verb and a mount
      # never calls /api/models, so no corpus case can send the request and the
      # whole endpoint would otherwise ship untested. The MCP arm is here for a
      # sharper version of the same reason: nothing in mirage is an MCP client
      # of the Hub at all, and the arm exists to be compared against, so a
      # tool document that stopped being the captured one, or a tool that
      # stopped answering the shape its output schema declares, would only be
      # noticed by whoever was running the measurement.
      - name: Assert the hf_hub fake (card metadata, facets, search, MCP arm)
        working-directory: integ
        run: pnpm run hf-hub:selftest

      # And one fake further. Nothing inside mirage speaks to Cloud Storage at
      # all, so this fake has no corpus case of any kind: its three consumers
      # are a CLI, a python seeder and the BigQuery emulator's Go client, and
      # each of the three uses a DIFFERENT upload protocol (media, resumable,
      # multipart). Untested here, the two the CLI does not use ship unproven.
      - name: Assert the gcs fake (three upload protocols, checksums, runs)
        working-directory: integ
        run: pnpm run gcs:selftest

      # And the mail fake, which the battery reaches even less than the others:
      # it speaks IMAP and SMTP rather than HTTP, so nothing in the declarative
      # corpus can send it a line at all. The two things asserted here are the
      # ones it exists for -- run separation at ONE address (the password is the
      # run, so two runs log in as the same account and see different mail) and
      # the SEARCH operators himalaya's query language compiles to, which a
      # key-at-a-time matcher answers wrongly by ignoring them.
      - name: Assert the mail fake (IMAP verbs, SEARCH operators, SMTP, runs)
        working-directory: integ
        run: pnpm run mail:selftest

      # gws is the opposite case: the battery drives its seven surfaces harder
      # than anything else here, and sees none of what this asserts. Everything
      # below the surfaces changed when gws moved onto the kit's store -- state
      # between requests, a /reset scoped to the tenants it names, a fresh run
      # served by copying a seeded template -- and the corpus, which resets once
      # and then talks to one run as one tenant, cannot tell any of it apart.
      - name: Assert the gws fake (store round trip, scoped reset, template copy)
        working-directory: integ
        run: pnpm run gws:selftest

      # github's corpus coverage is the `gh` porcelain, which never builds
      # history: a client that does calls POST /git/trees then /git/commits, and
      # that is the only path on which a commit can state its own author and
      # date. A fixture pins those, so a commit that quietly dropped them would
      # read as a repository where every commit happened at once.
      - name: Assert the github fake (git plumbing, commit author and date)
        working-directory: integ
        run: pnpm run github:selftest

      # The launcher hosts several fakes in ONE process, each still on its own
      # port. What it can quietly break is exactly what this asserts: two
      # instances of one fake holding one world instead of two, a non-HTTP arm
      # never coming up, and a bad config leaving half the fakes listening with
      # nobody holding a handle to close them.
      - name: Assert the multi-fake launcher (isolation, arms, refusals)
        working-directory: integ
        run: pnpm run launcher:selftest

      - name: Run declarative battery (typescript hosts)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet core --strict --allow-skip chroma,lancedb,nextcloud,notion,postgres,qdrant

      # The fixture server is python (started by the adapter through
      # startPythonServer), so this runs here rather than in integ-ts, which
      # has no python toolchain.
      - name: Run curl/wget battery (typescript host)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet http --strict

  # The two jobs above prove each language passes its own battery. This one
  # runs both emitters and diffs them case by case, so a change that breaks
  # the same way in both languages still fails. Shared targets only (ram,
  # disk, redis) — the credentialed targets stay in their own jobs.
  integ-shared-parity:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integ-battery-setup
        with:
          build-packages: "false"
          typescript-build-artifact: integ-typescript-dist
      # Targets are pinned: with no arguments parity.py adds the Graph and
      # Mem0 groups unconditionally, and the setup action exports
      # S3_ENDPOINT/SSH_HOST/GWS_URL, which would pull in the S3, SSH and
      # Drive groups too. That would gate every core/TypeScript PR on the
      # whole credentialed battery, which has its own jobs already.
      - name: Diff python and typescript battery output
        run: >-
          ./python/.venv/bin/python integ/runners/parity.py
          ram disk redis ram-history

  # One job per backend family with both hosts inside it. The postgres, chroma,
  # qdrant and mongodb fleet is the expensive part and was being started twice,
  # once for the python battery and once for the typescript one. This mirrors
  # integ-observability and integ-facets, which already drive both hosts against
  # a single fleet. The typescript step runs even when the python one fails so a
  # single-language regression still reports both languages.
  integ-database:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.database == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mirage
          POSTGRES_PASSWORD: mirage
          POSTGRES_DB: mirage_integ
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      POSTGRES_DSN: postgres://mirage:mirage@localhost:5432/mirage_integ
      CHROMA_HOST: localhost
      CHROMA_PORT: "8000"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Download TypeScript build outputs
        uses: actions/download-artifact@v8
        with:
          name: integ-typescript-dist
          path: typescript/packages

      - name: Wait for ChromaDB OSS
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v2/heartbeat && exit 0
            sleep 1
          done
          echo "ChromaDB did not become healthy" >&2
          exit 1

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 1
          done
          echo "Qdrant did not become healthy" >&2
          exit 1

      # mongodb needs a replica set for change streams, which a flat services:
      # block cannot express, so it is started and initiated by hand.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 \
            mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null)" = "true" ] && break
            sleep 1
          done

      - name: Run database battery (python host)
        run: >-
          ./python/.venv/bin/python integ/runners/python/main.py
          --target mongodb --target postgres --target chroma --target qdrant
          --strict

      - name: Run database battery (typescript host)
        if: ${{ !cancelled() }}
        working-directory: integ
        run: >-
          pnpm exec tsx runners/typescript/main.ts
          --target mongodb --target postgres --target chroma --target qdrant
          --strict

  integ-data:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.data == 'true') }}
    runs-on: ubuntu-latest
    services:
      nextcloud:
        image: nextcloud:30-apache
        ports:
          - 8080:80
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin123
          NEXTCLOUD_TRUSTED_DOMAINS: localhost
    env:
      NEXTCLOUD_URL: http://localhost:8080/remote.php/dav/files/admin/
      NEXTCLOUD_USERNAME: admin
      NEXTCLOUD_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      # The notion fake is a Node server shared by both hosts, so this
      # otherwise python-only job needs node to start it. No package build is
      # required: the notion fake imports only node, prisma and the MCP sdk.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      # integ/generated/ is gitignored, so every kit fake this job starts
      # (dropbox, box, onedrive) fails to import its client until this runs.
      # The battery jobs get it from the integ-battery-setup action; this job
      # does not use that action and has to ask for it itself.
      - name: Generate integ Prisma clients
        working-directory: integ
        run: pnpm run prisma:clients

      - name: Start fake Notion API (Prisma)
        working-directory: integ
        run: |
          nohup ./node_modules/.bin/tsx server/notion/main.ts --port 5091 > /tmp/notionsrv.log 2>&1 &
          for i in $(seq 1 30); do grep -q "NOTION_URL=" /tmp/notionsrv.log && break; sleep 1; done
          cat /tmp/notionsrv.log
          echo "NOTION_URL=http://127.0.0.1:5091" >> "$GITHUB_ENV"

      - name: Run notion integ (mock server, JSON harness)
        env:
          NOTION_ENABLED: "1"
        run: ./python/.venv/bin/python integ/runners/python/main.py --target notion --strict

      - name: Wait for Nextcloud install
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud is installed"
              exit 0
            fi
            sleep 5
          done
          echo "Nextcloud did not finish installing in time" >&2
          curl -s http://localhost:8080/status.php || true
          exit 1

      - name: Run declarative battery on nextcloud
        run: ./python/.venv/bin/python integ/runners/python/main.py --target nextcloud --strict

      # disk and ssh need nothing (tempdir, in-process SFTP server);
      # dropbox is an out-of-process fake started below; s3 and gridfs need a
      # real service each, and skip when the env is absent rather than
      # failing.
      - name: Start MinIO for the watch battery
        run: |
          docker run -d --name minio-watch -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://localhost:9000 minio minio123
          /tmp/mc mb local/mirage-watch

      - name: Start MongoDB for the watch battery
        run: |
          docker run -d --name mongo-watch -p 27017:27017 mongo:8
          for i in $(seq 1 30); do
            docker exec mongo-watch mongosh --quiet \
              --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            sleep 1
          done

      # gdrive, dropbox, box, onedrive, hf and github are the watch targets
      # whose fakes are TypeScript and out-of-process; the one in-process fake
      # (ssh) needs nothing. Every one of these backends SKIPS ITSELF when its
      # URL is unset, so a server that is not started here costs coverage in
      # silence rather than failing the job.
      - name: Start the fake Google Workspace server
        run: |
          cd integ && nohup pnpm exec tsx server/gws/main.ts --port 19999 \
            > /tmp/gws.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "GWS_URL=" /tmp/gws.log && break
            sleep 1
          done
          cat /tmp/gws.log

      - name: Start the fake Dropbox server
        working-directory: integ
        run: |
          nohup pnpm exec tsx server/dropbox/main.ts --port 5088 \
            > /tmp/dropbox-watch.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "DROPBOX_URL=" /tmp/dropbox-watch.log && break
            sleep 1
          done
          cat /tmp/dropbox-watch.log
          # Fail HERE, not 20 minutes later as a connection refused inside the
          # battery: a server that died on startup still leaves this step green
          # if the only thing it does is cat the log.
          grep -q "DROPBOX_URL=" /tmp/dropbox-watch.log

      - name: Start the fake Box server
        working-directory: integ
        run: |
          nohup pnpm exec tsx server/box/main.ts --port 5096 \
            > /tmp/box-watch.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "BOX_URL=" /tmp/box-watch.log && break
            sleep 1
          done
          cat /tmp/box-watch.log
          # Fail HERE, not 20 minutes later as a connection refused inside the
          # battery: a server that died on startup still leaves this step green
          # if the only thing it does is cat the log.
          grep -q "BOX_URL=" /tmp/box-watch.log

      - name: Start the fake Microsoft Graph server
        working-directory: integ
        run: |
          nohup pnpm exec tsx server/onedrive/main.ts --port 5089 \
            > /tmp/onedrive-watch.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "ONEDRIVE_URL=" /tmp/onedrive-watch.log && break
            sleep 1
          done
          cat /tmp/onedrive-watch.log
          # Fail HERE, not 20 minutes later as a connection refused inside the
          # battery: a server that died on startup still leaves this step green
          # if the only thing it does is cat the log.
          grep -q "ONEDRIVE_URL=" /tmp/onedrive-watch.log

      - name: Start the fake Hugging Face hub
        working-directory: integ
        run: |
          nohup pnpm exec tsx server/hf/main.ts --port 5099 \
            > /tmp/hf-watch.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "HF_URL=" /tmp/hf-watch.log && break
            sleep 1
          done
          cat /tmp/hf-watch.log
          # Fail HERE, not 20 minutes later as a connection refused inside the
          # battery: a server that died on startup still leaves this step green
          # if the only thing it does is cat the log.
          grep -q "HF_URL=" /tmp/hf-watch.log

      # Its own process on its own port, and seeded EMPTY: the watch battery
      # creates the one repository it watches, where the corpus batteries read
      # a seeded tree.
      - name: Start the fake GitHub server
        working-directory: integ
        run: |
          nohup pnpm exec tsx server/github/main.ts --port 5087 --fixture empty \
            > /tmp/github-watch.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "GITHUB_URL=" /tmp/github-watch.log && break
            sleep 1
          done
          cat /tmp/github-watch.log
          grep -q "GITHUB_URL=" /tmp/github-watch.log

      - name: Run watch battery
        env:
          NEXTCLOUD_URL: http://localhost:8080/remote.php/dav/files/admin/
          NEXTCLOUD_USERNAME: admin
          NEXTCLOUD_PASSWORD: admin123
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: mirage-watch
          S3_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio123
          MONGODB_URI: mongodb://localhost:27017
          GWS_URL: http://127.0.0.1:19999
          DROPBOX_URL: http://127.0.0.1:5088
          BOX_URL: http://127.0.0.1:5096
          ONEDRIVE_URL: http://127.0.0.1:5089
          HF_URL: http://127.0.0.1:5099
          GITHUB_URL: http://127.0.0.1:5087
        run: ./python/.venv/bin/python integ/watch/run.py

  integ-fuse:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.fuse == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libfuse (fusermount3 + libfuse2 for mfusepy, libfuse3 headers for fuse-native)
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev libfuse2t64 || \
            sudo apt-get install -y fuse3 libfuse3-dev libfuse2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Run Python FUSE mount and check (real libfuse)
        run: |
          ./python/.venv/bin/python integ/fuse/fuse.py 2>&1 \
            | ./python/.venv/bin/python integ/check_json.py integ/fuse/truth_fuse.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies (builds @zkochan/fuse-native against libfuse3)
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Download TypeScript build outputs
        uses: actions/download-artifact@v8
        with:
          name: integ-typescript-dist
          path: typescript/packages

      - name: Run TypeScript FUSE mount and check (real libfuse)
        working-directory: integ
        run: |
          pnpm exec tsx fuse/fuse.ts 2>&1 \
            | ../python/.venv/bin/python check_json.py fuse/truth_fuse.json

  integ-fuse-windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.fuse == 'true') }}
    runs-on: windows-latest
    # Advisory only: WinFsp support is experimental, this job is not in the
    # gate and never blocks a merge. It exists to surface what actually
    # breaks on Windows. Python only: mfusepy is ctypes and ships a WinFsp
    # registry loader, so this is a real experiment; the TS binding's
    # Windows path targets Dokany via an unmaintained 2019 dependency (the
    # @zkochan/fuse-native fork claims macOS/Linux only), so a TS leg would
    # die at build time and measure nothing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Retry choco (its community feed 503s), then fall back to the
      # official GitHub release MSI, and verify the driver landed either
      # way so a bad install fails here, not as "Unable to find libfuse".
      # Success is the DLL on disk, never choco's exit code: on a feed
      # 504 choco reports "installed 0/0 packages" and exits 0, which
      # skipped the fallback and failed the run at the final check.
      - name: Install WinFsp
        shell: pwsh
        run: |
          $dll = "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll"
          foreach ($i in 1..3) {
            choco install winfsp -y
            if (Test-Path $dll) { break }
            Write-Host "choco attempt $i left no WinFsp; retrying"
            Start-Sleep -Seconds 10
          }
          if (-not (Test-Path $dll)) {
            Write-Host "choco unavailable; installing from the GitHub release MSI"
            Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile winfsp.msi
            Start-Process msiexec.exe -ArgumentList '/i','winfsp.msi','/qn' -Wait
          }
          if (-not (Test-Path $dll)) {
            throw "WinFsp install failed: winfsp-x64.dll not found"
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies (base + fuse only)
        working-directory: python
        run: uv sync --extra fuse

      - name: Run Python FUSE mount and check (WinFsp)
        shell: bash
        # Dump the raw output before checking: on failure the traceback is
        # the whole point of this advisory job.
        run: |
          ./python/.venv/Scripts/python integ/fuse/fuse.py > /tmp/fuse-win.out 2>&1 || true
          cat /tmp/fuse-win.out
          ./python/.venv/Scripts/python integ/check_json.py integ/fuse/truth_fuse.json < /tmp/fuse-win.out

  integ-fskit-macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.fuse == 'true') }}
    runs-on: macos-15
    # Not in the gate. Everything installs and enables headlessly, but the
    # mount request never reaches macFUSE's FSKit module on a hosted runner
    # (engaging the module appears to need the GUI approval in System
    # Settings), so the known mount timeout is reported as a skip below.
    # Green = environment-limited or verified; red = something new broke
    # (a guard regression, a crash, or the runner starts mounting and the
    # results diverge from integ/fuse/truth_fskit.json). Real verification
    # runs on a Mac with macFUSE 5.x: integ/fuse/fskit.py | integ/check_json.py.
    # Python only for now: TypeScript reaches fskit too (fuse.node links
    # the installed libfuse), but one leg is enough to probe the runner.
    steps:
      - uses: actions/checkout@v7

      - name: Show macOS version (FSKit needs 15.4+)
        run: sw_vers

      - name: Install macFUSE 5.x
        run: brew install --cask macfuse

      - name: Enable the macFUSE FSKit modules
        # The installer auto-registers only the -local module; the non-local
        # one ships in the same bundle but never appears in pluginkit on a
        # runner (both are registered on a developer Mac). Add every appex
        # explicitly, then enable it.
        run: |
          exts=/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/Extensions
          ls -la "$exts" || true
          for appex in "$exts"/*.appex; do
            echo "registering $appex"
            pluginkit -a "$appex" || true
          done
          pluginkit -e use -i io.macfuse.app.fsmodule.macfuse || true
          pluginkit -e use -i io.macfuse.app.fsmodule.macfuse-local || true
          echo "--- registered FSKit modules (+ means enabled) ---"
          pluginkit -m -v -p com.apple.fskit.fsmodule || true

      - name: Confirm no kext is loaded
        run: |
          kextstat | grep -i fuse || echo "no macFUSE kext (expected)"
          echo "--- /dev/macfuse* (kext devices, absent without the kext) ---"
          ls -la /dev/macfuse* 2>&1 || true
          echo "--- systemextensionsctl ---"
          systemextensionsctl list 2>&1 || true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies (base + fuse only)
        working-directory: python
        run: uv sync --extra fuse

      - name: Run the fskit mount and check
        # The known hosted-runner limit surfaces as exactly one signature:
        # the readiness TimeoutError (the module never engages, libfuse
        # emits nothing). That case is a skip; any other failure is real.
        run: |
          ./python/.venv/bin/python integ/fuse/fskit.py > /tmp/fskit.out 2>&1 || true
          cat /tmp/fskit.out
          if grep -q "did not become ready" /tmp/fskit.out; then
            echo "SKIP: this runner cannot engage the macFUSE FSKit module" \
                 "(known hosted-runner limit; verified locally instead)"
            exit 0
          fi
          ./python/.venv/bin/python integ/check_json.py \
            integ/fuse/truth_fskit.json < /tmp/fskit.out

      - name: Run the CLI fskit battery (workspace YAML with an fskit mount)
        # Same classification as above: the script itself reports SKIP with
        # exit 0 when the daemon's mount never engages the FSKit module.
        run: bash integ/fuse/cli_fskit.sh "python/.venv/bin/mirage"

      - name: Host state after the probe
        if: always()
        run: |
          echo "--- mount ---"
          mount
          echo "--- /Volumes ---"
          ls -la /Volumes
          echo "--- FSKit modules ---"
          pluginkit -m -v -p com.apple.fskit.fsmodule || true
          echo "--- macFUSE bundle ---"
          ls -la /Library/Filesystems/ || true
          echo "--- macfuse-only log (what the mount attempt did) ---"
          log show --last 3m --style compact \
            --predicate 'eventMessage CONTAINS[c] "macfuse" OR senderImagePath CONTAINS[c] "macfuse"' \
            2>/dev/null | tail -80 || true
          echo "--- fskitd/fskit_agent errors ---"
          log show --last 3m --style compact \
            --predicate '(process == "fskitd" OR process == "fskit_agent") AND messageType == error' \
            2>/dev/null | tail -40 || true

  integ-runtime:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URI: mongodb://localhost:27017
      S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      QUICKJS_BUILD: v0.16.2
      WASI_BUILD: python-3.14.7-wasi_sdk-24
      MIRAGE_QUICKJS_HOME: /tmp/quickjs
      MIRAGE_WASI_HOME: /tmp/cpython-wasi
      MIRAGE_INTEG_DOCKER_CONTAINER: mirage-integ-runtime-box
      # The ssh suite's sshd container publishes port 2222 (the suite
      # json pins the port; env placeholders expand as strings only).
      MIRAGE_INTEG_SSH_HOST: 127.0.0.1
      MIRAGE_INTEG_SSH_USERNAME: root
      MIRAGE_INTEG_SSH_KEY: /tmp/mirage-integ-ssh-key
      # Suites with unmet requirements fail instead of skipping, so a
      # broken build download cannot silently drop wasi/quickjs/docker
      # coverage.
      INTEG_RUNTIME_STRICT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Download TypeScript build outputs
        uses: actions/download-artifact@v8
        with:
          name: integ-typescript-dist
          path: typescript/packages

      - name: Cache the quickjs WASI build
        id: quickjs-cache
        uses: actions/cache@v6
        with:
          path: /tmp/quickjs
          key: quickjs-wasi-${{ env.QUICKJS_BUILD }}

      - name: Download the quickjs WASI build
        if: steps.quickjs-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/quickjs
          gh release download "$QUICKJS_BUILD" -R quickjs-ng/quickjs \
            -p qjs-wasi.wasm -O /tmp/quickjs/qjs-wasi.wasm

      - name: Cache the CPython WASI build
        id: wasi-cache
        uses: actions/cache@v6
        with:
          path: /tmp/cpython-wasi
          key: cpython-wasi-${{ env.WASI_BUILD }}

      - name: Download the CPython WASI build
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cpython-wasi
          gh release download v3.14.7 -R brettcannon/cpython-wasi-build \
            -p "$WASI_BUILD.zip" -O /tmp/wasi-build.zip
          unzip -q /tmp/wasi-build.zip -d /tmp/cpython-wasi

      - name: Start MinIO
        run: |
          for i in $(seq 1 5); do
            docker pull minio/minio:latest && break
            echo "docker pull failed (attempt $i), retrying"; sleep 10
          done
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Start the docker sandbox container (user-provisioned)
        run: docker run -d --name "$MIRAGE_INTEG_DOCKER_CONTAINER" debian:stable-slim sleep infinity

      - name: Start the ssh sandbox host (user-provisioned)
        run: |
          ssh-keygen -t ed25519 -N '' -f "$MIRAGE_INTEG_SSH_KEY"
          docker run -d --name mirage-integ-ssh-box -p 2222:22 debian:stable-slim sleep infinity
          docker exec mirage-integ-ssh-box sh -c \
            'apt-get update -qq && apt-get install -y -qq openssh-server >/dev/null && mkdir -p /run/sshd /root/.ssh'
          # docker cp keeps the host uid on the file; sshd's StrictModes
          # refuses an authorized_keys the login user does not own.
          docker cp "$MIRAGE_INTEG_SSH_KEY.pub" mirage-integ-ssh-box:/root/.ssh/authorized_keys
          docker exec mirage-integ-ssh-box sh -c \
            'chown -R root:root /root/.ssh && chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys'
          docker exec -d mirage-integ-ssh-box /usr/sbin/sshd -D -e
          for i in $(seq 1 30); do
            ssh -p 2222 -i "$MIRAGE_INTEG_SSH_KEY" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null root@127.0.0.1 true && break
            sleep 1
          done

      - name: Run every runtime through the JSON suites (python)
        run: ./python/.venv/bin/python integ/runtime/run.py

      - name: Run every runtime through the JSON suites (typescript)
        working-directory: integ
        run: pnpm exec tsx runtime/run.ts

      - name: Run every runtime through the CLI and both daemons
        run: |
          bash integ/runtime/cli.sh \
            "python/.venv/bin/mirage" \
            "node typescript/packages/cli/dist/bin/mirage.js"

  integ-observability:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.observability == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Download TypeScript build outputs
        uses: actions/download-artifact@v8
        with:
          name: integ-typescript-dist
          path: typescript/packages

      # Self-hosted Langfuse needs six containers with real startup ordering
      # (web runs migrations against postgres and clickhouse), so this uses
      # compose health gates rather than a flat `services:` block.
      - name: Start Langfuse stack
        working-directory: integ/server
        run: docker compose -f langfuse_compose.yml up -d --wait --wait-timeout 600

      - name: Seed Langfuse
        run: ./python/.venv/bin/python integ/server/langfuse_seed.py --host http://localhost:3000

      # Jaeger is a single container with a built-in OTLP receiver, so it is
      # seeded by pushing spans rather than through a fake server.
      - name: Start jaeger and seed traces over OTLP
        run: |
          docker run -d --name mirage-jaeger \
            -p 16686:16686 -p 4317:4317 -p 4318:4318 \
            jaegertracing/jaeger:latest
          ./python/.venv/bin/python integ/server/jaeger_seed.py \
            --host http://localhost:16686 --otlp http://localhost:4318

      - name: Run observability battery (python host)
        env:
          LANGFUSE_URL: http://localhost:3000
          JAEGER_URL: http://localhost:16686
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet observability --strict

      - name: Run observability battery (typescript host)
        working-directory: integ
        env:
          LANGFUSE_URL: http://localhost:3000
          JAEGER_URL: http://localhost:16686
        run: pnpm exec tsx runners/typescript/main.ts --facet observability --strict

      - name: Jaeger logs on failure
        if: failure()
        run: docker logs mirage-jaeger --tail 100 || true

      - name: Langfuse container logs on failure
        if: failure()
        working-directory: integ/server
        run: docker compose -f langfuse_compose.yml logs --tail 200

      - name: Stop jaeger
        if: always()
        run: docker rm -f mirage-jaeger || true

      - name: Stop Langfuse stack
        if: always()
        working-directory: integ/server
        run: docker compose -f langfuse_compose.yml down -v

  # One job per backend family. A failure names the family, and each variant
  # starts only the fake servers that family needs rather than the whole fleet.
  integ-facets:
    needs: [changes, typescript-build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        facet: [project, email, chat, dify, mem0, cli]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Download TypeScript build outputs
        uses: actions/download-artifact@v8
        with:
          name: integ-typescript-dist
          path: typescript/packages

      # Every kit fake imports a generated Prisma client out of integ/generated/,
      # which is gitignored, so all of them have to exist before any fake in
      # this job starts. One step rather than one per fake: letting a fake rely
      # on an earlier fake's step to have generated its client couples the two
      # through an `if:` guard that nothing states.
      - name: Generate integ Prisma clients
        working-directory: integ
        run: pnpm run prisma:clients

      - name: Start fake Trello and Linear APIs
        if: matrix.facet == 'project'
        working-directory: integ
        run: |
          nohup ./node_modules/.bin/tsx server/trello/main.ts --port 5095 > /tmp/trello.log 2>&1 &
          nohup ./node_modules/.bin/tsx server/linear/main.ts --port 5094 > /tmp/linear.log 2>&1 &
          for f in trello linear; do
            for i in $(seq 1 30); do grep -q "_URL=" /tmp/$f.log && break; sleep 1; done
            cat /tmp/$f.log
          done
          echo "TRELLO_URL=http://127.0.0.1:5095" >> "$GITHUB_ENV"
          echo "LINEAR_URL=http://127.0.0.1:5094" >> "$GITHUB_ENV"

      # The cli facet drives the builtin CLIs (himalaya, gws, slack, discord,
      # ntn, linear) end to end against the same mocks the email, chat and
      # project facets use.
      - name: Start the fake mail and Google Workspace servers
        if: matrix.facet == 'email' || matrix.facet == 'cli'
        run: |
          cd integ
          nohup pnpm exec tsx server/mail/main.ts --port 5085 \
            --imap-port 3143 --smtp-port 3025 > /tmp/mail.log 2>&1 &
          nohup pnpm exec tsx server/gws/main.ts --port 19999 > /tmp/gws.log 2>&1 &
          for i in $(seq 1 30); do grep -q "GWS_URL=" /tmp/gws.log && break; sleep 1; done
          for i in $(seq 1 30); do grep -q "MAIL_SMTP_URL=" /tmp/mail.log && break; sleep 1; done
          cat /tmp/gws.log /tmp/mail.log
          # Fail HERE, not 20 minutes later as a connection refused inside the
          # battery. The mail fake announces THREE lines and the last one is the
          # SMTP socket, so waiting on it waits for every listener.
          grep -q "GWS_URL=" /tmp/gws.log
          grep -q "MAIL_SMTP_URL=" /tmp/mail.log
          echo "EMAIL_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "MAIL_URL=http://127.0.0.1:5085" >> "$GITHUB_ENV"
          echo "GWS_URL=http://127.0.0.1:19999" >> "$GITHUB_ENV"

      - name: Start fake Slack Web API
        if: matrix.facet == 'chat' || matrix.facet == 'cli'
        working-directory: integ
        run: |
          nohup ./node_modules/.bin/tsx server/slack/main.ts --port 5097 > /tmp/slack.log 2>&1 &
          for i in $(seq 1 30); do grep -q "SLACK_URL=" /tmp/slack.log && break; sleep 1; done
          cat /tmp/slack.log
          echo "SLACK_URL=http://127.0.0.1:5097" >> "$GITHUB_ENV"

      - name: Start fake Discord API
        if: matrix.facet == 'chat' || matrix.facet == 'cli'
        working-directory: integ
        run: |
          nohup ./node_modules/.bin/tsx server/discord/main.ts --port 5090 > /tmp/discord.log 2>&1 &
          for i in $(seq 1 30); do grep -q "DISCORD_URL=" /tmp/discord.log && break; sleep 1; done
          cat /tmp/discord.log
          echo "DISCORD_URL=http://127.0.0.1:5090" >> "$GITHUB_ENV"

      # A different Hugging Face product from the hf/ Xet store: hf_hub/ is
      # the git-backed Hub the `hf` CLI acts on.
      - name: Start fake Hugging Face Hub
        if: matrix.facet == 'cli'
        working-directory: integ
        run: |
          nohup ./node_modules/.bin/tsx server/hf_hub/main.ts --port 5086 > /tmp/hfhub.log 2>&1 &
          for i in $(seq 1 30); do grep -q "HF_HUB_URL=" /tmp/hfhub.log && break; sleep 1; done
          cat /tmp/hfhub.log
          echo "HF_HUB_URL=http://127.0.0.1:5086" >> "$GITHUB_ENV"

      # The `cli` fixture is the second github scenario: one repository and
      # no repository creation, where the shared setup seeds three and allows
      # it. Same server binary, named at startup and replayed by every later
      # bare /reset.
      - name: Start fake GitHub API
        if: matrix.facet == 'cli'
        run: |
          cd integ
          nohup ./node_modules/.bin/tsx server/github/main.ts \
            --port 5098 --fixture cli > /tmp/github.log 2>&1 &
          for i in $(seq 1 30); do grep -q "GITHUB_URL=" /tmp/github.log && break; sleep 1; done
          cat /tmp/github.log
          echo "GITHUB_URL=http://127.0.0.1:5098" >> "$GITHUB_ENV"

      # The ntn and linear CLIs ride the notion mock (self-started by each
      # runner under NOTION_ENABLED) and the fake Linear GraphQL server.
      - name: Start fake Linear API and the Notion mock
        if: matrix.facet == 'cli'
        run: |
          cd integ
          nohup ./node_modules/.bin/tsx server/linear/main.ts --port 5094 > /tmp/linear.log 2>&1 &
          for i in $(seq 1 30); do grep -q "LINEAR_URL=" /tmp/linear.log && break; sleep 1; done
          cat /tmp/linear.log
          echo "LINEAR_URL=http://127.0.0.1:5094" >> "$GITHUB_ENV"
          nohup ./node_modules/.bin/tsx server/notion/main.ts --port 5091 > /tmp/notion.log 2>&1 &
          for i in $(seq 1 30); do grep -q "NOTION_URL=" /tmp/notion.log && break; sleep 1; done
          cat /tmp/notion.log
          echo "NOTION_URL=http://127.0.0.1:5091" >> "$GITHUB_ENV"
          echo "NOTION_ENABLED=1" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.facet }} battery (python host)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet ${{ matrix.facet }} --strict

      - name: Run ${{ matrix.facet }} battery (typescript host)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet ${{ matrix.facet }} --strict

      # A 404 is an answer to a real client -- "no such repository", "no such
      # file" -- so an endpoint the fake does not implement is indistinguishable
      # from a negative result, and what comes out is a confident wrong
      # conclusion rather than an error. The fake names every unrouted request
      # on stderr; this is what makes that a failure rather than a log line.
      - name: Fail on any unrouted GitHub request
        if: matrix.facet == 'cli'
        run: |
          if grep -q "no route for" /tmp/github.log; then
            echo "The gh battery reached endpoints the fake does not implement:"
            grep "no route for" /tmp/github.log | sort -u
            exit 1
          fi
          echo "no unrouted GitHub requests"

  gate:
    name: integ-gate
    runs-on: ubuntu-latest
    needs: [changes, typescript-build, integ, integ-ts, integ-shared-py, integ-shared-ts, integ-shared-parity, integ-database, integ-data, integ-fuse, integ-observability, integ-facets, integ-runtime]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
