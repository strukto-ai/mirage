name: Integ

permissions:
  contents: read

"on":
  push:
    branches: [main]
    paths:
      - integ/**
      - data/**
      - python/**
      - typescript/**
      - .github/workflows/test_integ.yml
      - .github/actions/integ-battery-setup/action.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ts: ${{ steps.filter.outputs.ts }}
      database: ${{ steps.filter.outputs.database }}
      data: ${{ steps.filter.outputs.data }}
      fuse: ${{ steps.filter.outputs.fuse }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'integ/**'
              - 'data/**'
              - 'python/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            ts:
              - 'integ/**'
              - 'typescript/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            database:
              - 'integ/resources/mongodb/**'
              - 'integ/resources/postgres/**'
              - 'integ/targets.json'
              - 'integ/runners/**'
              - 'integ/resources/chroma/**'
              - 'integ/check_lines.sh'
              - 'python/mirage/accessor/mongodb.py'
              - 'python/mirage/core/mongodb/**'
              - 'python/mirage/commands/builtin/mongodb/**'
              - 'python/mirage/resource/mongodb/**'
              - 'python/mirage/accessor/postgres.py'
              - 'python/mirage/core/postgres/**'
              - 'python/mirage/commands/builtin/postgres/**'
              - 'python/mirage/resource/postgres/**'
              - 'python/mirage/accessor/chroma.py'
              - 'python/mirage/core/chroma/**'
              - 'python/mirage/commands/builtin/chroma/**'
              - 'python/mirage/resource/chroma/**'
              - 'integ/resources/qdrant/**'
              - 'python/mirage/accessor/qdrant.py'
              - 'python/mirage/core/qdrant/**'
              - 'python/mirage/commands/builtin/qdrant/**'
              - 'python/mirage/resource/qdrant/**'
              - 'typescript/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            data:
              - 'integ/**'
              - 'python/**'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'
            observability:
              - 'integ/server/langfuse_compose.yml'
              - 'integ/server/langfuse_seed.py'
              - 'integ/server/jaeger_seed.py'
              - 'integ/resources/observability/**'
              - 'integ/targets.json'
              - 'integ/runners/**'
              - 'python/mirage/accessor/langfuse.py'
              - 'python/mirage/accessor/jaeger.py'
              - 'python/mirage/core/langfuse/**'
              - 'python/mirage/core/jaeger/**'
              - 'python/mirage/commands/builtin/langfuse/**'
              - 'python/mirage/commands/builtin/jaeger/**'
              - 'python/mirage/resource/langfuse/**'
              - 'python/mirage/resource/jaeger/**'
              - 'typescript/packages/core/src/core/langfuse/**'
              - 'typescript/packages/core/src/core/jaeger/**'
              - 'typescript/packages/core/src/accessor/langfuse.ts'
              - 'typescript/packages/core/src/accessor/jaeger.ts'
              - 'typescript/packages/node/src/resource/langfuse/**'
              - 'typescript/packages/node/src/resource/jaeger/**'
              - '.github/workflows/test_integ.yml'
            fuse:
              - 'integ/fuse.py'
              - 'integ/fuse.ts'
              - 'integ/truth_fuse.txt'
              - 'integ/check_lines.sh'
              - 'integ/package.json'
              - 'python/mirage/fuse/**'
              - 'python/mirage/workspace/fuse.py'
              - 'typescript/packages/node/src/fuse/**'
              - 'typescript/packages/node/src/workspace/fuse.ts'
              - 'typescript/packages/node/src/workspace.ts'
              - '.github/workflows/test_integ.yml'
              - '.github/actions/integ-battery-setup/action.yml'

  integ:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Run Safeguard scenarios and diff against truth
        run: |
          ./python/.venv/bin/python integ/safeguard.py > /tmp/safeguard.out
          diff integ/truth_safeguard.txt /tmp/safeguard.out

      - name: Run lancedb integ (embedded, JSON harness)
        env:
          LANCEDB_ENABLED: "1"
        run: ./python/.venv/bin/python integ/runners/python/main.py --target lancedb

      - name: Run find arg-error battery (SaaS backends, dummy creds, no server)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet argerr

      - name: Run curl/wget battery (HTTP fixture started by the adapter)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet http

      - name: Run cross-mount commands (ram -> ram/redis/s3 via moto)
        run: ./python/.venv/bin/python integ/cross_commands.py

      - name: Run virtual-root mount switching (ram/disk/yaml)
        run: ./python/.venv/bin/python integ/root.py

  integ-ts:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nextcloud:
        image: nextcloud:30-apache
        ports:
          - 8080:80
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin123
          NEXTCLOUD_TRUSTED_DOMAINS: localhost
    env:
      REDIS_URL: redis://localhost:6379/0
      S3_BUCKET: mirage-integ
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      NEXTCLOUD_URL: http://localhost:8080/remote.php/dav/files/admin/
      NEXTCLOUD_USERNAME: admin
      NEXTCLOUD_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build mirage-core
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-core build

      - name: Build mirage-node
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-node build

      - name: Build mirage-browser
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-browser build

      - name: Wait for Nextcloud install
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud is installed"
              exit 0
            fi
            sleep 5
          done
          echo "Nextcloud did not finish installing in time" >&2
          curl -s http://localhost:8080/status.php || true
          exit 1

      - name: Run declarative battery on Nextcloud
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --target nextcloud

      - name: Start MinIO
        run: |
          for i in $(seq 1 5); do
            docker pull minio/minio:latest && break
            echo "docker pull failed (attempt $i), retrying"; sleep 10
          done
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create MinIO bucket
        run: |
          for i in 1 2 3; do
            if curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc \
               && chmod +x /tmp/mc && /tmp/mc --version >/dev/null 2>&1; then
              break
            fi
            echo "mc download attempt $i failed; retrying"; sleep 3
          done
          /tmp/mc --version
          /tmp/mc alias set local http://localhost:9000 minio minio123
          /tmp/mc mb local/mirage-integ || true
          /tmp/mc mb local/mirage-integ-s3 || true
          /tmp/mc mb local/mirage-integ-gcs || true
          /tmp/mc mb local/mirage-integ-minio || true


      - name: Run Safeguard scenarios and diff against truth
        working-directory: integ
        run: |
          pnpm exec tsx safeguard.ts > /tmp/ts-safeguard.out
          diff truth_safeguard.txt /tmp/ts-safeguard.out

      - name: Run cross-mount commands (ram -> ram/s3 via MinIO)
        working-directory: integ
        run: pnpm exec tsx cross_commands.ts

      - name: Run notion integ (TS, mock server, JSON harness)
        working-directory: integ
        env:
          NOTION_ENABLED: "1"
        run: pnpm exec tsx runners/typescript/main.ts --target notion

      - name: Run notion MCP/REST parity check (TS)
        working-directory: integ
        run: pnpm exec tsx notion_mcp_parity.ts

      - name: Run lancedb integ (TS, embedded, JSON harness)
        working-directory: integ
        env:
          LANCEDB_ENABLED: "1"
        run: pnpm exec tsx runners/typescript/main.ts --target lancedb

      - name: Run find arg-error battery (SaaS backends, dummy creds, no server)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet argerr

  integ-shared-py:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      greenmail:
        image: greenmail/standalone:2.1.3
        ports:
          - 3025:3025
          - 3143:3143
          - 8080:8080
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.users=integ:secret@example.com
            -Dgreenmail.users.login=email
            -Dgreenmail.hostname=0.0.0.0
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      EMAIL_HOST: localhost
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integ-battery-setup
        with:
          build-packages: "false"
      - name: Run declarative battery (python hosts)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet core

  integ-shared-ts:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      greenmail:
        image: greenmail/standalone:2.1.3
        ports:
          - 3025:3025
          - 3143:3143
          - 8080:8080
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.users=integ:secret@example.com
            -Dgreenmail.users.login=email
            -Dgreenmail.hostname=0.0.0.0
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      EMAIL_HOST: localhost
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integ-battery-setup
      - name: Run declarative battery (typescript hosts)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet core

      # The fixture server is python (started by the adapter through
      # startPythonServer), so this runs here rather than in integ-ts, which
      # has no python toolchain.
      - name: Run curl/wget battery (typescript host)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet http

  # The two jobs above prove each language passes its own battery. This one
  # runs both emitters and diffs them case by case, so a change that breaks
  # the same way in both languages still fails. Shared targets only (ram,
  # disk, redis) — the credentialed targets stay in their own jobs.
  integ-shared-parity:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integ-battery-setup
      # Targets are pinned: with no arguments parity.py adds the Graph and
      # Mem0 groups unconditionally, and the setup action exports
      # S3_ENDPOINT/SSH_HOST/GWS_URL, which would pull in the S3, SSH and
      # Drive groups too. That would gate every core/TypeScript PR on the
      # whole credentialed battery, which has its own jobs already.
      - name: Diff python and typescript battery output
        run: >-
          ./python/.venv/bin/python integ/runners/parity.py
          ram disk redis ram-history

  integ-database:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.database == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mirage
          POSTGRES_PASSWORD: mirage
          POSTGRES_DB: mirage_integ
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      POSTGRES_DSN: postgres://mirage:mirage@localhost:5432/mirage_integ
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Wait for ChromaDB OSS
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v2/heartbeat && exit 0
            sleep 1
          done
          echo "ChromaDB did not become healthy" >&2
          exit 1

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 1
          done
          echo "Qdrant did not become healthy" >&2
          exit 1

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 \
            mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null)" = "true" ] && break
            sleep 1
          done

      - name: Run MongoDB backend (JSON harness)
        run: ./python/.venv/bin/python integ/runners/python/main.py --target mongodb

      - name: Run Postgres backend (JSON harness)
        run: ./python/.venv/bin/python integ/runners/python/main.py --target postgres

      - name: Run chroma integ (ChromaDB OSS, JSON harness)
        env:
          CHROMA_HOST: localhost
          CHROMA_PORT: "8000"
        run: ./python/.venv/bin/python integ/runners/python/main.py --target chroma

      - name: Run qdrant integ (JSON harness)
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: ./python/.venv/bin/python integ/runners/python/main.py --target qdrant

  integ-database-ts:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.database == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mirage
          POSTGRES_PASSWORD: mirage
          POSTGRES_DB: mirage_integ
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      POSTGRES_DSN: postgres://mirage:mirage@localhost:5432/mirage_integ
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build mirage-core
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-core build

      - name: Build mirage-node
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-node build

      - name: Build mirage-browser
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-browser build

      - name: Wait for ChromaDB OSS
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v2/heartbeat && exit 0
            sleep 1
          done
          echo "ChromaDB did not become healthy" >&2
          exit 1

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 \
            mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null)" = "true" ] && break
            sleep 1
          done

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 1
          done
          echo "Qdrant did not become healthy" >&2
          exit 1

      - name: Run MongoDB backend (TS, JSON harness)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --target mongodb

      - name: Run Postgres backend (TS, JSON harness)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --target postgres

      - name: Run TS chroma integ (ChromaDB OSS, JSON harness)
        working-directory: integ
        env:
          CHROMA_HOST: localhost
          CHROMA_PORT: "8000"
        run: pnpm exec tsx runners/typescript/main.ts --target chroma

      - name: Run TS qdrant integ (JSON harness)
        working-directory: integ
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
        run: pnpm exec tsx runners/typescript/main.ts --target qdrant

  integ-data:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.data == 'true') }}
    runs-on: ubuntu-latest
    services:
      nextcloud:
        image: nextcloud:30-apache
        ports:
          - 8080:80
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          NEXTCLOUD_ADMIN_PASSWORD: admin123
          NEXTCLOUD_TRUSTED_DOMAINS: localhost
    env:
      NEXTCLOUD_URL: http://localhost:8080/remote.php/dav/files/admin/
      NEXTCLOUD_USERNAME: admin
      NEXTCLOUD_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Run notion integ (mock server, JSON harness)
        env:
          NOTION_ENABLED: "1"
        run: ./python/.venv/bin/python integ/runners/python/main.py --target notion

      - name: Wait for Nextcloud install
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud is installed"
              exit 0
            fi
            sleep 5
          done
          echo "Nextcloud did not finish installing in time" >&2
          curl -s http://localhost:8080/status.php || true
          exit 1

      - name: Run declarative battery on nextcloud
        run: ./python/.venv/bin/python integ/runners/python/main.py --target nextcloud

      - name: Run watch battery on nextcloud
        env:
          NEXTCLOUD_URL: http://localhost:8080/remote.php/dav/files/admin/
          NEXTCLOUD_USERNAME: admin
          NEXTCLOUD_PASSWORD: admin123
        run: ./python/.venv/bin/python integ/watch/run.py

  integ-fuse:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.fuse == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libfuse (fusermount3 + libfuse2 for mfusepy, libfuse3 headers for fuse-native)
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev libfuse2t64 || \
            sudo apt-get install -y fuse3 libfuse3-dev libfuse2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Run Python FUSE mount and check (real libfuse)
        run: |
          ./python/.venv/bin/python integ/fuse.py 2>&1 \
            | bash integ/check_lines.sh integ/truth_fuse.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies (builds @zkochan/fuse-native against libfuse3)
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build mirage-core
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-core build

      - name: Build mirage-node
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-node build

      - name: Run TypeScript FUSE mount and check (real libfuse)
        working-directory: integ
        run: |
          pnpm exec tsx fuse.ts 2>&1 \
            | bash check_lines.sh truth_fuse.txt

  integ-fuse-windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.fuse == 'true') }}
    runs-on: windows-latest
    # Advisory only: WinFsp support is experimental, this job is not in the
    # gate and never blocks a merge. It exists to surface what actually
    # breaks on Windows. Python only: mfusepy is ctypes and ships a WinFsp
    # registry loader, so this is a real experiment; the TS binding's
    # Windows path targets Dokany via an unmaintained 2019 dependency (the
    # @zkochan/fuse-native fork claims macOS/Linux only), so a TS leg would
    # die at build time and measure nothing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install WinFsp
        run: choco install winfsp -y

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies (base + fuse only)
        working-directory: python
        run: uv sync --extra fuse

      - name: Run Python FUSE mount and check (WinFsp)
        shell: bash
        # Dump the raw output before checking: on failure the traceback is
        # the whole point of this advisory job.
        run: |
          ./python/.venv/Scripts/python integ/fuse.py > /tmp/fuse-win.out 2>&1 || true
          cat /tmp/fuse-win.out
          bash integ/check_lines.sh integ/truth_fuse.txt < /tmp/fuse-win.out

  runtime-py:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Run python3 across ram/redis/s3/mongodb mounts and diff against truth
        run: |
          ./python/.venv/bin/python integ/runtime.py > /tmp/runtime_py.out
          diff integ/truth_runtime_py.txt /tmp/runtime_py.out

  runtime-ts:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URI: mongodb://localhost:27017
      S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build mirage-core
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-core build

      - name: Build mirage-node
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-node build

      - name: Start MinIO
        run: |
          for i in $(seq 1 5); do
            docker pull minio/minio:latest && break
            echo "docker pull failed (attempt $i), retrying"; sleep 10
          done
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Run python3 across ram/redis/s3/mongodb mounts and check against truth
        shell: bash
        working-directory: integ
        run: |
          set -o pipefail
          pnpm exec tsx runtime.ts 2>&1 \
            | bash check_lines.sh truth_runtime.txt

  integ-observability:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.observability == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build mirage-core
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-core build

      - name: Build mirage-node
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-node build

      # The typescript runner imports mirage-browser statically for the opfs
      # target, so its dist must exist even when no browser target runs.
      - name: Build mirage-browser
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-browser build

      # Self-hosted Langfuse needs six containers with real startup ordering
      # (web runs migrations against postgres and clickhouse), so this uses
      # compose health gates rather than a flat `services:` block.
      - name: Start Langfuse stack
        working-directory: integ/server
        run: docker compose -f langfuse_compose.yml up -d --wait --wait-timeout 600

      - name: Seed Langfuse
        run: ./python/.venv/bin/python integ/server/langfuse_seed.py --host http://localhost:3000

      # Jaeger is a single container with a built-in OTLP receiver, so it is
      # seeded by pushing spans rather than through a fake server.
      - name: Start jaeger and seed traces over OTLP
        run: |
          docker run -d --name mirage-jaeger \
            -p 16686:16686 -p 4317:4317 -p 4318:4318 \
            jaegertracing/jaeger:latest
          ./python/.venv/bin/python integ/server/jaeger_seed.py \
            --host http://localhost:16686 --otlp http://localhost:4318

      - name: Run observability battery (python host)
        env:
          LANGFUSE_URL: http://localhost:3000
          JAEGER_URL: http://localhost:16686
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet observability

      - name: Run observability battery (typescript host)
        working-directory: integ
        env:
          LANGFUSE_URL: http://localhost:3000
          JAEGER_URL: http://localhost:16686
        run: pnpm exec tsx runners/typescript/main.ts --facet observability

      - name: Jaeger logs on failure
        if: failure()
        run: docker logs mirage-jaeger --tail 100 || true

      - name: Langfuse container logs on failure
        if: failure()
        working-directory: integ/server
        run: docker compose -f langfuse_compose.yml logs --tail 200

      - name: Stop jaeger
        if: always()
        run: docker rm -f mirage-jaeger || true

      - name: Stop Langfuse stack
        if: always()
        working-directory: integ/server
        run: docker compose -f langfuse_compose.yml down -v

  # One job per backend family. A failure names the family, and each variant
  # starts only the fake servers that family needs rather than the whole fleet.
  integ-facets:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        facet: [project, email, chat, dify, mem0]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile=false

      - name: Build mirage-core
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-core build

      - name: Build mirage-node
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-node build

      # The typescript runner imports mirage-browser statically for the opfs
      # target, so its dist must exist even when no browser target runs.
      - name: Build mirage-browser
        working-directory: typescript
        run: pnpm --filter @struktoai/mirage-browser build

      - name: Start fake Trello and Linear APIs
        if: matrix.facet == 'project'
        run: |
          nohup ./python/.venv/bin/python integ/server/trello_server.py --port 5095 > /tmp/trello.log 2>&1 &
          nohup ./python/.venv/bin/python integ/server/linear_server.py --port 5094 > /tmp/linear.log 2>&1 &
          for f in trello linear; do
            for i in $(seq 1 30); do grep -q "ENDPOINT=" /tmp/$f.log && break; sleep 1; done
            cat /tmp/$f.log
          done
          echo "TRELLO_ENDPOINT=http://127.0.0.1:5095" >> "$GITHUB_ENV"
          echo "LINEAR_ENDPOINT=http://127.0.0.1:5094/graphql" >> "$GITHUB_ENV"

      - name: Start GreenMail and the fake Google Workspace server
        if: matrix.facet == 'email'
        run: |
          docker run -d --name mirage-greenmail \
            -p 3025:3025 -p 3143:3143 -p 8080:8080 \
            -e GREENMAIL_OPTS="-Dgreenmail.setup.test.all -Dgreenmail.users=integ:secret@example.com -Dgreenmail.users.login=email -Dgreenmail.hostname=0.0.0.0" \
            greenmail/standalone:2.1.3
          cd integ && nohup pnpm exec tsx server/gws_server.ts --port 19999 > /tmp/gws.log 2>&1 &
          for i in $(seq 1 30); do grep -q "GWS_URL=" /tmp/gws.log && break; sleep 1; done
          cat /tmp/gws.log
          for i in $(seq 1 30); do
            curl -sf -X POST http://localhost:8080/api/service/reset && break
            sleep 2
          done
          echo "EMAIL_HOST=localhost" >> "$GITHUB_ENV"
          echo "GWS_URL=http://127.0.0.1:19999" >> "$GITHUB_ENV"

      - name: Start fake Slack Web API
        if: matrix.facet == 'chat'
        working-directory: integ
        env:
          SLACK_DB_URL: file:/tmp/mirage-slack-ci.db
        run: |
          ./node_modules/.bin/prisma generate --schema prisma/schema.prisma
          nohup ./node_modules/.bin/tsx server/slack.ts --port 5097 > /tmp/slack.log 2>&1 &
          for i in $(seq 1 30); do grep -q "SLACK_URL=" /tmp/slack.log && break; sleep 1; done
          cat /tmp/slack.log
          echo "SLACK_URL=http://127.0.0.1:5097" >> "$GITHUB_ENV"

      - name: Start fake Dify API
        if: matrix.facet == 'dify'
        run: |
          nohup ./python/.venv/bin/python integ/server/dify_server.py --port 5093 > /tmp/dify.log 2>&1 &
          for i in $(seq 1 30); do grep -q "DIFY_ENDPOINT=" /tmp/dify.log && break; sleep 1; done
          cat /tmp/dify.log
          echo "DIFY_ENDPOINT=http://127.0.0.1:5093" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.facet }} battery (python host)
        run: ./python/.venv/bin/python integ/runners/python/main.py --facet ${{ matrix.facet }}

      - name: Run ${{ matrix.facet }} battery (typescript host)
        working-directory: integ
        run: pnpm exec tsx runners/typescript/main.ts --facet ${{ matrix.facet }}

      - name: Stop GreenMail
        if: always() && matrix.facet == 'email'
        run: docker rm -f mirage-greenmail || true

  gate:
    name: integ-gate
    runs-on: ubuntu-latest
    needs: [changes, integ, integ-ts, integ-shared-py, integ-shared-ts, integ-shared-parity, integ-database, integ-database-ts, integ-data, integ-fuse, integ-observability, integ-facets, runtime-py, runtime-ts]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
