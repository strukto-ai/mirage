name: Test (TypeScript)

permissions:
  contents: read

"on":
  push:
    branches: [main]
    paths:
      # Keep in lockstep with the `changes` filter below. .gitignore is
      # here for knip, which builds its file set through it (root `dist/`
      # is why knip does not see built output).
      - typescript/**
      - examples/typescript/**
      - integ/**
      - conformance/**
      # Pre-commit skips knip and integ-typecheck, so a hook definition
      # changing there has to reach this workflow to be checked at all.
      - .pre-commit-config.yaml
      - .gitignore
      - .github/workflows/test_typescript.yml
      - .github/actions/setup-node-pnpm/action.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      hit: ${{ steps.filter.outputs.hit }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Keep in lockstep with `push.paths` above.
            hit:
              - 'typescript/**'
              - 'examples/typescript/**'
              - 'integ/**'
              - 'conformance/**'
              - '.pre-commit-config.yaml'
              - '.gitignore'
              - '.github/workflows/test_typescript.yml'
              - '.github/actions/setup-node-pnpm/action.yml'

  test:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.hit == 'true') }}
    name: TypeScript ${{ matrix.leg }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Load-bearing now, where it was decorative on a single-value matrix:
      # it is the only thing stopping one failing leg from cancelling the
      # other two, and the gate's *cancelled* arm would red the run while
      # destroying both survivors' output.
      fail-fast: false
      matrix:
        node-version: ["24"]
        # Three legs balanced against measured per-package vitest time. The
        # one hard constraint is pnpm's topological sort, which applies to
        # whatever subset --filter selects, so a leg costs its longest
        # dependency chain rather than its sum: cli depends on agents, core,
        # node and server and therefore shares a leg with none of them, while
        # node -> server -> opencode is free because its tail is cheap.
        # The selections themselves live in typescript/package.json as
        # `test:leg:*`, so one command reproduces a leg locally; this list and
        # those scripts are held in step by scripts/ci_test_legs/check.py.
        leg: [core, cli, rest]
        include:
          - leg: cli
            typecheck: true
          - leg: rest
            examples: true
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Job level, not step level: 27 test files across core and node skip
    # themselves when REDIS_URL is unset -- mostly `describe.skipIf(...)`, but
    # node/src/conformance.test.ts spells it `? it.skip : it`, so grepping for
    # skipIf alone undercounts. A leg that does not carry this variable skips
    # those files and still reports green, which is how a split silently drops
    # coverage. One declaration cannot drift between legs the way three could.
    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        id: build
        working-directory: typescript
        run: pnpm -r build

      # integ is a workspace member, so `pnpm -r typecheck` reaches it, and its
      # fakes import Prisma clients generated into the gitignored
      # integ/generated/. Without this every one of those imports is TS2307 and
      # the types they carry degrade to implicit any, which reads as dozens of
      # unrelated errors in files nobody touched. That makes this the
      # typechecking leg's step and nobody else's: no example consumes the
      # generated clients, since all 25 truth files spell their command
      # `pnpm -C examples/typescript exec tsx ...`.
      - name: Generate integ Prisma clients
        if: matrix.typecheck
        working-directory: integ
        run: pnpm run prisma:clients

      # --no-bail: this is now the only place integ's own
      # `tsc -p tsconfig.check.json` runs, and a bailing recursive run
      # aborts in packages/core before ever reaching ../integ.
      - name: Typecheck
        if: matrix.typecheck
        working-directory: typescript
        run: pnpm -r --no-bail typecheck

      - name: Run TypeScript tests
        working-directory: typescript
        run: pnpm run test:leg:${{ matrix.leg }}

      # Each truth file owns the command it was captured against, so this
      # list is paths only and cannot drift from what is asserted. The
      # runner keeps going after a failure and fails the step at the end,
      # so one stale truth file reports every other one in the same run
      # instead of hiding the examples listed below it.
      - name: Examples (output checked against integ/ truth files)
        if: matrix.examples
        run: |
          bad=0
          run() {
            python3 integ/check_example.py "$1" --variant typescript || bad=1
          }
          run integ/truth/typescript/ram.json
          run integ/truth/typescript/ram_vfs.json
          run integ/truth/typescript/disk.json
          run integ/truth/typescript/disk_vfs.json
          run integ/truth/watch_delta.json
          run integ/truth/permissions.json
          run integ/truth/policy.json
          run integ/truth/policy_yaml.json
          run integ/truth/ask.json
          run integ/truth/ask_pending.json
          run integ/truth/typescript/custom_command.json
          run integ/truth/custom_vfs.json
          run integ/truth/custom_cli.json
          run integ/truth/session.json
          run integ/truth/typescript/filetype.json
          run integ/truth/typescript/pyodide_basic.json
          run integ/truth/typescript/pyodide_env.json
          run integ/truth/typescript/pyodide_heredoc.json
          run integ/truth/typescript/pyodide_script.json
          run integ/truth/typescript/pyodide_ram.json
          run integ/truth/typescript/redis.json
          run integ/truth/typescript/redis_index.json
          run integ/truth/typescript/redis_cache.json
          run integ/truth/typescript/redis_vfs.json
          run integ/truth/typescript/redis_browser.json
          run integ/truth/version_branching.json
          exit $bad

      # Moved from Pre-commit, which went diff-scoped: knip reads the
      # whole graph, so a changed-files list cannot make it cheaper.
      # Last and `!cancelled()` so it and the tests cannot hide each
      # other, but gated on the build -- without node_modules knip fails
      # on unresolved entries, which points at the wrong step.
      - name: Dead code (knip)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: typescript
        run: pnpm exec knip

  python-fs:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        working-directory: typescript
        run: pnpm -r --filter './packages/*' build

      # The truth file carries this one's cwd and `node --import tsx/esm`
      # spelling, so it runs from the repo root like every other example.
      - name: Python filesystem example (output checked against integ/ truth file)
        run: python3 integ/check_example.py integ/truth/typescript/pyodide_vfs.json

  audit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.32.1

      # No `cache: pnpm` here on purpose: the audit step below
      # resolves straight from the lockfile and never installs, so the pnpm
      # store does not exist and the post-run save fails path validation on
      # every cache miss.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Advisories read against the resolved lockfile, which is what the 27
      # hand-written pnpm.overrides in typescript/package.json pin. Those
      # pins were the only thing between a published advisory and this
      # tree, and nothing re-checked them. Informational like the Python
      # audit: a fresh CVE reports without blocking a merge.
      # The registry's quick-audit endpoint stalls for minutes at a time,
      # and pnpm's defaults (a 60s socket timeout, two retries) reported
      # that stall as a failed audit three runs out of four. A longer
      # timeout and more retries ride it out; a real advisory still fails.
      - name: Audit dependencies for known vulnerabilities (informational)
        working-directory: typescript
        env:
          npm_config_fetch_timeout: "300000"
          npm_config_fetch_retries: "5"
        run: pnpm audit --no-color

  gate:
    name: test-typescript-gate
    runs-on: ubuntu-latest
    needs: [changes, test, python-fs]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
