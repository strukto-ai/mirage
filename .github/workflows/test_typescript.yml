name: Test (TypeScript)

"on":
  push:
    branches: [main]
    paths:
      - typescript/**
      - examples/typescript/**
      - integ/**
      - .github/workflows/test_typescript.yml
  pull_request:
    branches: [main]
    paths:
      - typescript/**
      - examples/typescript/**
      - integ/**
      - .github/workflows/test_typescript.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        working-directory: typescript
        run: pnpm -r build

      - name: Run TypeScript tests
        working-directory: typescript
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pnpm test

      - name: Redis examples (output checked against integ/ truth files)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          run() { pnpm -C examples/typescript exec tsx "$1" 2>&1 | bash integ/check_lines.sh "$2"; }
          run redis/redis.ts integ/truth_ts_redis.txt
          run redis/redis_index.ts integ/truth_ts_redis_index.txt
          run redis/redis_cache.ts integ/truth_ts_redis_cache.txt
