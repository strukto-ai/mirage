name: API docs

permissions:
  contents: read

"on":
  pull_request:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'docs/**/*.mdx'
      - 'docs/openapi.yaml'
      - 'docs/api-display.overlay.json'
      - 'docs/docs.json'
      - 'docs/snippets/api-explorer.jsx'
      - 'scripts/gen_api_reference.py'
      - 'scripts/check_api_docs.py'
      - '.github/workflows/api_docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'docs/**/*.mdx'
      - 'docs/openapi.yaml'
      - 'docs/api-display.overlay.json'
      - 'docs/docs.json'
      - 'docs/snippets/api-explorer.jsx'
      - 'scripts/gen_api_reference.py'
      - 'scripts/check_api_docs.py'
      - '.github/workflows/api_docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install docs check dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Check endpoint catalog and presentation
        run: python scripts/gen_api_reference.py --selftest --check
      - name: Check examples, navigation, and guide links
        run: python scripts/check_api_docs.py
