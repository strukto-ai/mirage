name: Test (Python)

permissions:
  contents: read

"on":
  push:
    branches: [main]
    paths:
      - python/**
      - examples/python/**
      - integ/**
      - conformance/**
      - .github/workflows/test_python.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# uv times a request out after 30s by default, which a hosted runner has
# hit on one stalled wheel download (numpy, pulled in by the lancedb
# extra) before any test ran.
env:
  UV_HTTP_TIMEOUT: 120

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      hit: ${{ steps.filter.outputs.hit }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            hit:
              - 'python/**'
              - 'examples/python/**'
              - 'integ/**'
              - 'conformance/**'
              - '.github/workflows/test_python.yml'

  test:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install Python dependencies
        working-directory: python
        run: uv sync --all-extras --no-extra camel

      - name: Install package
        working-directory: python
        run: uv pip install .

      - name: Cache the mypy incremental store
        uses: actions/cache@v6
        with:
          path: python/.mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('python/uv.lock') }}-${{ hashFiles('python/mirage/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-${{ hashFiles('python/uv.lock') }}-
            mypy-${{ runner.os }}-py3.12-

      - name: Type check (mypy)
        working-directory: python
        run: uv run mypy mirage

      - name: Run pytest (main suite, camel excluded)
        working-directory: python
        env:
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URI: mongodb://localhost:27017
        run: |
          redis_serial=(
            tests/cache/file/test_redis_cache.py
            tests/cache/index/test_redis.py
            tests/cache/index/test_redis_order.py
            tests/commands/builtin/redis
            tests/core/redis
            tests/observe/test_redis_store.py
            tests/ops/redis
            tests/resource/redis
            tests/shell/console/redis/test_store.py
          )
          ignore_args=(--ignore=tests/agents/camel)
          for path in "${redis_serial[@]}"; do
            ignore_args+=("--ignore=$path")
          done
          # worksteal, not loadscope. Measured as sibling jobs at one commit,
          # n=4 each: worksteal 398s median with a 13s spread, loadscope 420s
          # with a 91s spread. loadscope pins a module to one worker, so a
          # heavy module leaves the others idle and the run time depends on
          # which worker drew it; worksteal rebalances, which is why its tail
          # is 58s better even though the medians are close.
          uv run pytest -n 4 --dist worksteal "${ignore_args[@]}"
          uv run pytest "${redis_serial[@]}"

      # Each truth file owns the command it was captured against, so this
      # list is paths only and cannot drift from what is asserted. The
      # runner keeps going after a failure and fails the step at the end,
      # so one stale truth file reports every other one in the same run
      # instead of hiding the examples listed below it.
      - name: Examples (output checked against integ/ truth files)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          bad=0
          run() {
            python3 integ/check_example.py "$1" --variant python || bad=1
          }
          # One truth file, a second interpreter mode: with UTF-8 mode
          # off, pathlib passes io.open's "locale" sentinel, which is
          # not a codec name and is what every read_text() sends on a
          # host whose LC_CTYPE is already a UTF-8 locale.
          variant() {
            python3 integ/check_example.py "$1" --variant "$2" || bad=1
          }
          # Each check is its own process against its own workspace, so the
          # ram/disk-backed ones are independent and run concurrently. xargs
          # exits 123 when any invocation failed, which is what marks the step
          # bad; -I{} keeps one check per invocation so all of them still run.
          independent=(
            integ/truth/python/ram.json
            integ/truth/python/ram_vfs.json
            integ/truth/python/disk.json
            integ/truth/python/disk_vfs.json
            integ/truth/watch_delta.json
            integ/truth/permissions.json
            integ/truth/ask.json
            integ/truth/ask_pending.json
            integ/truth/python/custom_command.json
            integ/truth/custom_resource.json
            integ/truth/custom_cli.json
            integ/truth/python/filetype.json
            integ/truth/version_branching.json
          )
          printf '%s\n' "${independent[@]}" \
            | xargs -P 4 -I{} python3 integ/check_example.py {} --variant python \
            || bad=1
          variant integ/truth/python/ram_vfs.json python_utf8_off

          # ram_python boots the monty language runtime. Four of those loading
          # at once on a 4 vCPU runner crashed it with SIGABRT (exit -6) in
          # https://github.com/strukto-ai/mirage/actions/runs/33043622744 while
          # every other example passed, so it runs on its own.
          run integ/truth/python/ram_python.json
          # The policy examples boot monty too, one engine per judged line,
          # so they stay out of the parallel batch for the same reason.
          run integ/truth/policy.json
          run integ/truth/policy_yaml.json

          # These four share one redis server, so they stay serial: running
          # them together would have them racing on the same keyspace.
          run integ/truth/python/redis.json
          run integ/truth/python/redis_index.json
          run integ/truth/python/redis_cache.json
          run integ/truth/python/redis_vfs.json
          exit $bad

      - name: Sync Python dependencies for camel
        working-directory: python
        run: uv sync --extra camel

      - name: Run pytest (camel toolkit tests)
        working-directory: python
        run: uv run pytest tests/agents/camel

  import-isolation:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: pydantic-ai
            module: mirage.agents.pydantic_ai
            blocked: deepagents
          - extra: openai
            module: mirage.agents.openai_agents
            blocked: deepagents
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Create venv and install only the target extra
        working-directory: python
        run: |
          uv venv .venv-iso
          uv pip install --python .venv-iso/bin/python ".[${{ matrix.extra }}]"

      - name: Verify blocked package is not installed
        working-directory: python
        run: |
          if .venv-iso/bin/python -c "import ${{ matrix.blocked }}" 2>/dev/null; then
            echo "FAIL: ${{ matrix.blocked }} should not be installed for extra=${{ matrix.extra }}"
            exit 1
          fi
          echo "OK: ${{ matrix.blocked }} is absent"

      - name: Import agent package and prompt without blocked dep
        working-directory: python
        run: |
          .venv-iso/bin/python - <<'PY'
          import importlib, sys
          mod = importlib.import_module("${{ matrix.module }}")
          prompt = importlib.import_module("${{ matrix.module }}.prompt")
          assert isinstance(prompt.MIRAGE_SYSTEM_PROMPT, str)
          assert callable(prompt.build_system_prompt)
          assert "${{ matrix.blocked }}" not in sys.modules, \
              f"${{ matrix.blocked }} got imported transitively"
          print(f"OK: imported ${{ matrix.module }} cleanly without ${{ matrix.blocked }}")
          PY

  runtime:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    env:
      WASI_BUILD: python-3.14.7-wasi_sdk-24
      QUICKJS_BUILD: v0.16.2
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Cache the CPython WASI build
        id: wasi-cache
        uses: actions/cache@v6
        with:
          path: /tmp/cpython-wasi
          key: cpython-wasi-${{ env.WASI_BUILD }}

      - name: Download the CPython WASI build
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cpython-wasi
          gh release download v3.14.7 -R brettcannon/cpython-wasi-build \
            -p "$WASI_BUILD.zip" -O /tmp/wasi-build.zip
          unzip -q /tmp/wasi-build.zip -d /tmp/cpython-wasi

      - name: Cache the quickjs WASI build
        id: quickjs-cache
        uses: actions/cache@v6
        with:
          path: /tmp/quickjs
          key: quickjs-wasi-${{ env.QUICKJS_BUILD }}

      - name: Download the quickjs WASI build
        if: steps.quickjs-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/quickjs
          gh release download "$QUICKJS_BUILD" -R quickjs-ng/quickjs \
            -p qjs-wasi.wasm -O /tmp/quickjs/qjs-wasi.wasm

      - name: Install dependencies (wasi + quickjs + monty)
        working-directory: python
        run: uv sync --extra wasi --extra quickjs --extra monty

      - name: Run wasi runtime tests
        working-directory: python
        env:
          MIRAGE_WASI_HOME: /tmp/cpython-wasi
        run: uv run pytest tests/runtime/python/test_wasi.py -v --no-cov

      - name: Run quickjs runtime tests
        working-directory: python
        env:
          MIRAGE_QUICKJS_HOME: /tmp/quickjs
        run: uv run pytest tests/runtime/js/ -v --no-cov

      - name: Run the runtime conformance suite
        working-directory: python
        env:
          MIRAGE_WASI_HOME: /tmp/cpython-wasi
          MIRAGE_QUICKJS_HOME: /tmp/quickjs
        run: uv run pytest tests/runtime/test_conformance.py -v --no-cov

      - name: Install base package without the monty extra
        working-directory: python
        run: |
          uv venv .venv-nomonty
          uv pip install --python .venv-nomonty/bin/python .

      - name: Verify pydantic-monty is absent
        working-directory: python
        run: |
          if .venv-nomonty/bin/python -c "import pydantic_monty" 2>/dev/null; then
            echo "FAIL: pydantic_monty should not be installed"
            exit 1
          fi
          echo "OK: pydantic_monty is absent"

      - name: python3 degrades with an install hint; local runtime still works
        working-directory: python
        run: |
          .venv-nomonty/bin/python - <<'PY'
          import asyncio

          from mirage.resource.ram import RAMResource
          from mirage.types import MountMode
          from mirage.workspace import Workspace


          async def main():
              ws = Workspace({"/data": RAMResource()}, mode=MountMode.EXEC)
              io = await ws.execute("python3 -c 'print(1)'")
              assert io.exit_code == 127, io.exit_code
              assert b"monty' extra" in io.stderr, io.stderr
              ws2 = Workspace({"/data": RAMResource()},
                              mode=MountMode.EXEC,
                              runtimes=["local"])
              io2 = await ws2.execute("python3 -c 'print(41 + 1)'")
              assert io2.exit_code == 0, io2.stderr
              assert io2.stdout.strip() == b"42", io2.stdout
              try:
                  Workspace({"/d": RAMResource()}, runtimes=["monty"])
              except ImportError:
                  pass
              else:
                  raise AssertionError("explicit monty must fail loud")
              await ws.close()
              await ws2.close()


          asyncio.run(main())
          print("OK: no-monty degradation verified")
          PY

  audit:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.hit == 'true') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Audit dependencies for known vulnerabilities (informational)
        working-directory: python
        run: uv audit --preview-features audit --no-extra camel

  gate:
    name: test-python-gate
    runs-on: ubuntu-latest
    needs: [changes, test, import-isolation, runtime]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
