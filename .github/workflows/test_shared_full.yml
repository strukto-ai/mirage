name: Shared backends full

permissions:
  contents: read

"on":
  # Integ calls this on a pull request whose changes match its
  # shared_full filter, so integ-gate requires it there.
  workflow_call:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch:

concurrency:
  group: shared-backends-full-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_TIMEOUT: 120
  MEM0_TELEMETRY: "False"
  TSX_V8_FLAGS: --wasm-wrapper-tiering-budget=1000000000

jobs:
  # One job per target runs both hosts at once against its one fake fleet, as
  # integ-database does: each battery is a single process, so the runner has
  # cores for both, and a target no longer pays the same setup in two jobs.
  # The TypeScript battery runs even when the Python one fails, so a
  # single-language regression still reports both languages.
  shared-full:
    name: Shared full (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [sharepoint, sharepoint-prefix, onedrive, box, gdrive, gdrive-folder]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/integ-battery-setup
      - name: Create output directories
        run: mkdir -p emit/python emit/typescript
      - name: Full backend battery (python, background)
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          integ/scripts/background.sh start full-python
          './python/.venv/bin/python integ/runners/python/main.py
          --target "$TARGET" --strict --emit "$GITHUB_WORKSPACE/emit/python/$TARGET.json"'
      - name: Full backend battery (typescript)
        working-directory: integ
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          pnpm exec tsx $TSX_V8_FLAGS runners/typescript/main.ts
          --target "$TARGET" --strict --emit "$GITHUB_WORKSPACE/emit/typescript/$TARGET.json"
      - name: Full backend battery (python)
        if: ${{ !cancelled() }}
        run: integ/scripts/background.sh wait full-python
      - name: Keep the python battery outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-full-python-${{ matrix.target }}
          path: emit/python
          if-no-files-found: error
          retention-days: 1
      - name: Keep the typescript battery outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-full-typescript-${{ matrix.target }}
          path: emit/typescript
          if-no-files-found: error
          retention-days: 1

  shared-full-parity:
    needs: shared-full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: shared-full-python-*
          path: emit/python
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: shared-full-typescript-*
          path: emit/typescript
          merge-multiple: true
      - name: Diff full backend outputs
        run: >-
          python3 integ/runners/parity.py --from emit
          sharepoint sharepoint-prefix onedrive box gdrive gdrive-folder

  shared-full-gate:
    if: ${{ always() }}
    needs: [shared-full, shared-full-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require full golden and parity checks
        env:
          BATTERY_RESULT: ${{ needs.shared-full.result }}
          PARITY_RESULT: ${{ needs.shared-full-parity.result }}
        run: |
          test "$BATTERY_RESULT" = success
          test "$PARITY_RESULT" = success
