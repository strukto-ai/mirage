name = "mirage-cloudflare-test"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

# ssh2, which serves the workspace's files into a machine, tries this native
# addon inside a try; the bundle takes the package's stub, which throws, in its
# place. `wrangler dev` resolves it from the package, `deploy --config` from
# here, which bundle.test.ts gives an absolute path.
[alias]
"cpu-features" = "./src/cpu_features.ts"

[limits]
cpu_ms = 60000

[vars]
MIRAGE_AUTH_MODE = "token"
MIRAGE_AUTH_TOKEN = "edge-test-token"
MIRAGE_RELAY_TOKEN = "relay-test-token"

# The sql mount's two Cloudflare drivers: a local D1 database, and a
# SQLite-backed Durable Object's own storage.
[[d1_databases]]
binding = "DB"
database_name = "mirage-test"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "SQL_OBJECTS"
class_name = "SqlObject"

# A container relay over a container that echoes, standing in for a real one.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "EchoRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SqlObject"]

[[migrations]]
tag = "v2"
new_classes = ["EchoRelay"]
