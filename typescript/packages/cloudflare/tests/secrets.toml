name = "mirage-cloudflare-secrets-test"
main = "secrets_worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 1Password's SDK core, as the quickstart aliases it: the package's own
# build of it, which imports its WebAssembly as a module.
[alias]
"@1password/sdk-core" = "./src/generated/onepassword_core.js"
