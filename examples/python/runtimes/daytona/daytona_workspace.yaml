# S3-centered workspace with a Daytona whole-line runtime.
#
# Mirage never creates or deletes sandboxes: create one yourself from
# the mirage-fuse snapshot (prebake_snapshot.py builds it once), then
# point the runtime at its id.
#
#   set -a; source .env.development; set +a
#   export DAYTONA_SANDBOX_ID=$(./python/.venv/bin/python \
#     examples/python/runtimes/daytona/create_sandbox.py)
#   mirage workspace create daytona_workspace.yaml --id daytona-demo
#   printf 'print("hello from the sandbox")\n' \
#     | mirage execute -w daytona-demo -c 'cat > /data/hello.py'
#   mirage execute -w daytona-demo -c 'cd /data && python3 hello.py'
#   mirage workspace delete daytona-demo   # the sandbox stays yours
#
# Captured lines (python3, pip) run whole inside the Daytona sandbox;
# every other command stays on the local vfs. On the first captured
# line mirage connects to the sandbox and creates one in-sandbox
# workspace mirroring these mounts, FUSE-mounted live under
# workspace_root, so a remote write shows up in /data immediately with
# no sync step. The session cwd is rebased under workspace_root, so
# paths relative to the cwd just work; mirage does not rewrite
# absolute paths in the command.
#
# Sizing, GPUs, and lifecycle (idle-stop, auto-delete) are Daytona
# settings you pick when you create the sandbox; mirage never touches
# them.

mode: EXEC

mounts:
  /data:
    resource: s3
    config:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_DEFAULT_REGION}
      aws_access_key_id: ${AWS_ACCESS_KEY_ID}
      aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      key_prefix: mirage-daytona-cli-demo

runtimes:
  - name: daytona
    captures: ["python3", "pip"]
    config:
      sandbox_id: ${DAYTONA_SANDBOX_ID} # a sandbox you created
      api_key: ${DAYTONA_API_KEY}
    workspace_root: /home/daytona/workspace # writable by the sandbox user
  - vfs
