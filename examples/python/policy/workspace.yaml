# The reviewer's profile as a document: the block policy.py passes in
# code, with its program beside this file. One file, read by both
# implementations:
#
#   ./python/.venv/bin/python examples/python/policy/policy_yaml.py
#   pnpm -C examples/typescript exec tsx policy/policy_yaml.ts

mode: WRITE

mounts:
  /repo:
    vfs: ram
  /scratch:
    vfs: ram

profiles:
  reviewer:
    vars:
      protect: [AWS_*]
    policy:
      pre_command:
        - {script: ./guard.py, runtime: monty}
