# The secrets plane is two blocks, and this file is both of them.
#
# `secrets:` declares the sources: one entry per account, each naming
# the source it speaks to and that source's own config. A config value
# can itself be read from `env` or `dotenv` -- the two sources that
# need no config of their own -- so the deployment's credentials never
# have to sit in this file.
#
# `env:` then declares the variables. Each names an instance in `from`,
# the secret's address in `ref`, and the field to read in `key`. The
# agent sees an ordinary variable: `$SLACK_BOT_TOKEN` and nothing else,
# with the value fetched for the line that reads it and never written
# to a snapshot.
#
# One file, either CLI:
#   mirage      workspace create examples/python/secrets/workspace.yaml --id secrets
#   ./mirage-ts workspace create examples/python/secrets/workspace.yaml --id secrets
#
# `secrets_app.py` is the same thing built in application code, where
# the process env is loaded by dotenv rather than read from a file
# here.

mode: WRITE

mounts:
  /data:
    resource: ram

secrets:
  # A 1Password service account. Its token is the one credential the
  # deployment still holds itself, so it is read from a dotenv file
  # instead of being pasted here. Left out entirely, the source falls
  # back to OP_SERVICE_ACCOUNT_TOKEN in the host process env.
  op:
    source: 1password
    config:
      token:
        from: dotenv
        ref: .env.development
        key: OP_SERVICE_ACCOUNT_TOKEN

env:
  # An item reference plus the field to read. 1Password fixes the
  # built-in field labels per category, so an API Credential item's
  # secret is `credential` however the item itself is named.
  SLACK_BOT_TOKEN:
    from: op
    ref: op://mirage/SLACK_BOT_TOKEN
    key: credential

  # The other reference shape 1Password writes, field and all: what
  # the app's "Copy Secret Reference" button hands you.
  SLACK_USER_TOKEN:
    from: op
    ref: op://mirage/SLACK_USER_TOKEN/credential
    key: credential

  # A literal, for contrast: no source, no fetch, no expiry.
  MIRAGE_ENV:
    value: demo
