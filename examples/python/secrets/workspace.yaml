# mirage      workspace create examples/python/secrets/workspace.yaml --id secrets
# ./mirage-ts workspace create examples/python/secrets/workspace.yaml --id secrets

mode: WRITE

mounts:
  /data:
    resource: ram

  /slack:
    resource: slack
    mode: READ
    config:
      token:
        from: op
        ref: op://mirage/SLACK_BOT_TOKEN
        key: credential
      search_token:
        from: op
        ref: op://mirage/SLACK_USER_TOKEN
        key: credential

secrets:
  op:
    source: 1password
    config:
      token:
        from: dotenv
        ref: .env.development
        key: OP_SERVICE_ACCOUNT_TOKEN

env:
  SLACK_BOT_TOKEN:
    from: op
    ref: op://mirage/SLACK_BOT_TOKEN
    key: credential

  SLACK_USER_TOKEN:
    from: op
    ref: op://mirage/SLACK_USER_TOKEN/credential
    key: credential
    readonly: true

  MIRAGE_ENV:
    value: demo
