mode: WRITE

mounts:
  /slack:
    vfs: slack
    mode: WRITE
    config:
      token: xoxb-default
      search_token: xoxp-default
      base_url: ${SLACK_URL}/api
  /logs:
    vfs: ram
    mode: WRITE
  /workspace:
    vfs: ram
    mode: WRITE
  /tests:
    vfs: ram
    mode: WRITE

clis:
  slack:
    cli: slack
    machine: in_process
    config:
      token: xoxb-default
      search_token: xoxp-default
      base_url: ${SLACK_URL}/api

profiles:
  default:
    cwd: /workspace
    mounts:
      /slack: write
      /logs: read
      /workspace: write
    paths:
      hide:
        - /tests
        - /logs/verifier
