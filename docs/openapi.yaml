          in: query
          description: Return the policy decision for the command without running it. Only
            `command` is evaluated; `record` is ignored and `open_stdin` may be `false`. A
            multipart body, or a body with `cwd`, `runtime`, `machine` or `open_stdin` set to
            `true`, is rejected with `400`. Cannot be combined with `stream`.
