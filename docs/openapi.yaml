            - additionalProperties: true
              type: object
            - type: 'null'
          title: Override
      additionalProperties: false
      type: object
      title: CloneWorkspaceRequest
    CommandRule:
      properties:
        reason:
          type: string
          title: Reason
        commands:
          items:
            type: string
          type: array
          title: Commands
          default: []
        paths:
          items:
            type: string
          type: array
          title: Paths
          default: []
        mount:
          type: string
          title: Mount
          default: ''
      additionalProperties: false
      type: object
      required:
        - reason
      title: CommandRule
      description: "One admission rule of the permissions document: refuse (or ask\nabout)\
        \ matching commands, on matching paths when it names any.\n\nIt is the compiled element\
        \ of ``commands.deny`` and ``commands.ask``\nwherever the profile writes one, and\
        \ reaches the workspace only inside\nthat document; ``PermissionsPolicy`` is what\
        \ evaluates it. The\ndocument writes a rule in one of three shapes, and each compiles\
        \ to\nrules of this class: a list of command patterns (a whole-line rule\non each,\
        \ no paths), a mapping of command pattern to its paths (one\ncommand to many paths,\
        \ one rule per command, so a path is never\nstated beside a command it was not meant\
        \ for), or paths alone (a\nrule on every command, at the dispatcher too). A command\
        \ entry is a\ntoken-prefix pattern over the line as the entry point normalizes it\
        \ (``rm``\nis every rm line, ``git push`` every ``git push ...``, a ``*`` token\n\
        any one token). Path entries use the document's one grammar: an\nentry with ``*``,\
        \ ``?`` or ``[`` is a pattern (repo fnmatch dialect,\n``*`` crossing ``/``, a slashless\
        \ pattern matching any name\ncomponent), anything else is an exact path and its subtree.\
        \ Every\nentry is absolute or a name pattern, holds a token (a blank one\nwould be\
        \ the root), and inside a mount section must name something\nunder that mount root.\n\
        \nArgs:\n    reason (str): why the command is refused, carried on the\n        result's\
        \ refusal record.\n    commands (tuple[str, ...]): command patterns the rule applies\n\
        \        to; empty means every command. A path-scoped rule carries\n        exactly\
        \ one.\n    paths (tuple[str, ...]): path entries; empty refuses the\n        command\
        \ regardless of its operands.\n    mount (str): set by the compiler for a rule written\
        \ under a\n        ``mounts.<prefix>`` section, the mount root it is scoped to:\n\
        \        it applies only to a line whose cwd or paths lie under it.\n        Empty\
        \ for a rule written at the top level; never typed in\n        the document."
    CommandsBlock:
      properties:
        allow:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
          title: Allow
        ask:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Ask
          default: []
        deny:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Deny
          default: []
      additionalProperties: false
      type: object
      title: CommandsBlock
      description: "``commands:`` at the top level of a profile.\n\n``allow`` lists the command\
        \ patterns the profile allows; a line no\npattern covers is refused, ``<cmd>: Permission\
        \ denied`` at 126, like\nany other rule's Deny. Shell builtins are subjects like everything\n\
        else: a list stating only ``cat`` refuses ``echo`` and ``cd``. The agent's\nown functions\
        \ are the one exemption, safe because every line of a\nbody passes the gate itself.\
        \ ``ask`` rules are admitted only with a\nhost approval; ``deny`` rules refuse with\
        \ a reason. A bare string in\neither is one command pattern with the default reason.\n\
        \nArgs:\n    allow (tuple[str, ...] | None): the profile's allow patterns;\n     \
        \   None (unstated) allows everything.\n    ask (tuple[CommandRule, ...]): what needs\
        \ sign-off, in order.\n    deny (tuple[CommandRule, ...]): the profile's refusals,\
        \ in order."
    CreateSessionRequest:
      properties:
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
        mounts:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: 'null'
          title: Mounts
