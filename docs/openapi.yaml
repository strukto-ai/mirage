components:
  schemas:
    AnswerAskRequest:
      properties:
        answer:
          type: string
          enum:
            - allow
            - deny
          title: Answer
        scope:
          type: string
          enum:
            - once
            - session
          title: Scope
          default: once
        note:
          type: string
          title: Note
          default: ''
      type: object
      required:
        - answer
      title: AnswerAskRequest
    AskResponse:
      properties:
        id:
          type: string
          title: Id
        session_id:
          type: string
          title: Session Id
        command:
          type: string
          title: Command
        argv:
          items:
            type: string
          type: array
          title: Argv
        cwd:
          type: string
          title: Cwd
        paths:
          items:
            type: string
          type: array
          title: Paths
        reason:
          type: string
          title: Reason
        outcome:
          anyOf:
            - type: string
            - type: 'null'
          title: Outcome
        scope:
          type: string
          title: Scope
        note:
          type: string
          title: Note
      type: object
      required:
        - id
        - session_id
        - command
        - argv
        - cwd
        - paths
        - reason
        - outcome
        - scope
        - note
      title: AskResponse
    CLIBlock:
      properties:
        cli:
          anyOf:
            - type: string
            - type: 'null'
          title: Cli
        script:
          anyOf:
            - type: string
            - type: 'null'
          title: Script
        runtime:
          anyOf:
            - type: string
            - type: 'null'
          title: Runtime
        config:
          additionalProperties: true
          type: object
          title: Config
      additionalProperties: false
      type: object
      title: CLIBlock
      description: 'One ``clis:`` entry: install a named CLI with its own config.


        The section key is the installed head word. Exactly one handler

        source: ``cli`` names a registered spec tree; ``script`` references

        a program file whose content is embedded at load (the docker

        build-context model). ``runtime`` optionally pins the world runtime

        entry that runs the script; unset picks the first entry speaking

        the script''s language. ``config`` validates through the spec''s

        ``config_model`` at install time (fail loud). A CLI never takes a

        mode and never shares a mount''s credentials: a binary has no mode,

        the credential does.'
    CancelLinesResponse:
      properties:
        canceled:
          type: integer
          title: Canceled
      type: object
      required:
        - canceled
      title: CancelLinesResponse
    CloneWorkspaceRequest:
      properties:
        id:
          anyOf:
            - type: string
            - type: 'null'
          title: Id
        override:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Override
      additionalProperties: false
      type: object
      title: CloneWorkspaceRequest
    CommandRule:
      properties:
        reason:
          type: string
          title: Reason
        commands:
          items:
            type: string
          type: array
          title: Commands
          default: []
        paths:
          items:
            type: string
          type: array
          title: Paths
          default: []
        mount:
          type: string
          title: Mount
          default: ''
      additionalProperties: false
      type: object
      required:
        - reason
      title: CommandRule
      description: "One admission rule of the permissions document: refuse (or ask\nabout)\
        \ matching commands, on matching paths when it names any.\n\nIt is the compiled element\
        \ of ``commands.deny`` and ``commands.ask``\nwherever the profile writes one, and\
        \ reaches the workspace only inside\nthat document; ``PermissionsPolicy`` is what\
        \ evaluates it. The\ndocument writes a rule in one of three shapes, and each compiles\
        \ to\nrules of this class: a list of command patterns (a whole-line rule\non each,\
        \ no paths), a mapping of command pattern to its paths (one\ncommand to many paths,\
        \ one rule per command, so a path is never\nstated beside a command it was not meant\
        \ for), or paths alone (a\nrule on every command, at the dispatcher too). A command\
        \ entry is a\ntoken-prefix pattern over the line as the entry point normalizes it\
        \ (``rm``\nis every rm line, ``git push`` every ``git push ...``, a ``*`` token\n\
        any one token). Path entries use the document's one grammar: an\nentry with ``*``,\
        \ ``?`` or ``[`` is a pattern (repo fnmatch dialect,\n``*`` crossing ``/``, a slashless\
        \ pattern matching any name\ncomponent), anything else is an exact path and its subtree.\
        \ Every\nentry is absolute or a name pattern, holds a token (a blank one\nwould be\
        \ the root), and inside a mount section must name something\nunder that mount root.\n\
        \nArgs:\n    reason (str): why the command is refused, carried on the\n        result's\
        \ refusal record.\n    commands (tuple[str, ...]): command patterns the rule applies\n\
        \        to; empty means every command. A path-scoped rule carries\n        exactly\
        \ one.\n    paths (tuple[str, ...]): path entries; empty refuses the\n        command\
        \ regardless of its operands.\n    mount (str): set by the compiler for a rule written\
        \ under a\n        ``mounts.<prefix>`` section, the mount root it is scoped to:\n\
        \        it applies only to a line whose cwd or paths lie under it.\n        Empty\
        \ for a rule written at the top level; never typed in\n        the document."
    CommandsBlock:
      properties:
        allow:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
          title: Allow
        ask:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Ask
          default: []
        deny:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Deny
          default: []
      additionalProperties: false
      type: object
      title: CommandsBlock
      description: "``commands:`` at the top level of a profile.\n\n``allow`` lists the command\
        \ patterns the profile allows; a line no\npattern covers is refused, ``<cmd>: Permission\
        \ denied`` at 126, like\nany other rule's Deny. Shell builtins are subjects like everything\n\
        else: a list stating only ``cat`` refuses ``echo`` and ``cd``. The agent's\nown functions\
        \ are the one exemption, safe because every line of a\nbody passes the gate itself.\
        \ ``ask`` rules are admitted only with a\nhost approval; ``deny`` rules refuse with\
        \ a reason. A bare string in\neither is one command pattern with the default reason.\n\
        \nArgs:\n    allow (tuple[str, ...] | None): the profile's allow patterns;\n     \
        \   None (unstated) allows everything.\n    ask (tuple[CommandRule, ...]): what needs\
        \ sign-off, in order.\n    deny (tuple[CommandRule, ...]): the profile's refusals,\
        \ in order."
    CreateSessionRequest:
      properties:
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
        mounts:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: 'null'
          title: Mounts
        profile:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile
      type: object
      title: CreateSessionRequest
    CreateTemplateRequest:
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        config:
          $ref: '#/components/schemas/WorkspaceConfig'
      additionalProperties: false
      type: object
      required:
        - name
        - config
      title: CreateTemplateRequest
    CreateWorkspaceRequest:
      properties:
        config:
          anyOf:
            - $ref: '#/components/schemas/WorkspaceConfig'
            - type: 'null'
        template:
          anyOf:
            - type: string
            - type: 'null'
          title: Template
        id:
          anyOf:
            - type: string
            - type: 'null'
          title: Id
      additionalProperties: false
      type: object
      title: CreateWorkspaceRequest
      description: 'A workspace to create: from ``config``, or from the saved

        ``template`` of that name, never both.'
    DeleteSessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
      type: object
      required:
        - session_id
      title: DeleteSessionResponse
    DeleteWorkspaceResponse:
      properties:
        id:
          type: string
          title: Id
        closed_at:
          type: number
          title: Closed At
      type: object
      required:
        - id
        - closed_at
      title: DeleteWorkspaceResponse
    DiskStoreBlock:
      properties:
        type:
          type: string
          const: disk
          title: Type
        root:
          type: string
          title: Root
          default: ~/.mirage/state
      additionalProperties: false
      type: object
      required:
        - type
      title: DiskStoreBlock
    DocumentPath:
      properties:
        path:
          type: string
          title: Path
      additionalProperties: false
      type: object
      required:
        - path
      title: DocumentPath
    EnvVar:
      properties:
        value:
          anyOf:
            - type: string
            - type: 'null'
          title: Value
        readonly:
          type: boolean
          title: Readonly
          default: false
        export:
          type: boolean
          title: Export
          default: true
        from:
          anyOf:
            - type: string
            - type: 'null'
          title: From
        ref:
          type: string
          title: Ref
          default: ''
        key:
          anyOf:
            - type: string
            - type: 'null'
          title: Key
        fetch:
          type: string
          enum:
            - lazy
            - eager
          title: Fetch
          default: lazy
      additionalProperties: false
      type: object
      title: EnvVar
      description: "One entry of the env map: a literal value or a managed pointer.\n\nThe\
        \ env block is one map, name -> entry. A bare string in the map\nis the literal short\
        \ form and never reaches this model; a dict is\nvalidated through it. `value` and\
        \ `from` are mutually exclusive and\none is required: `export` belongs to a literal\
        \ entry, `ref`/`key`/\n`fetch` to a managed one, and `readonly` to either.\n\nArgs:\n\
        \    value (str | None): the literal text; set = a literal entry.\n    readonly (bool):\
        \ compiles to `VarAttr.READONLY`, so the agent\n        cannot assign to the name\
        \ or unset it. Legal on a managed\n        entry too, and the point of one: the fetch\
        \ writes the\n        record itself rather than going through the shell's\n      \
        \  assignment gate, so mirage still fills a readonly\n        credential while a line\
        \ that tries to overwrite it is\n        refused.\n    export (bool): literal-only\
        \ knob (default on); a managed entry\n        is always exported.\n    provider (str\
        \ | None): registered source name; set = a managed\n        entry. Spelled `from:`\
        \ in YAML (python keyword), via alias.\n    ref (str): the source's address for the\
        \ secret.\n    key (str | None): which secret field to read; default the\n       \
        \ variable's own name.\n    fetch (Literal[\"lazy\", \"eager\"]): eager joins every\
        \ line's\n        fetch set instead of waiting for a reference."
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
        workspaces:
          type: integer
          title: Workspaces
        uptime_s:
          type: number
          title: Uptime S
      type: object
      required:
        - workspaces
        - uptime_s
      title: HealthResponse
    HideReason:
      properties:
        patterns:
          items:
            type: string
          type: array
          title: Patterns
        reason:
          type: string
          title: Reason
      additionalProperties: false
      type: object
      required:
        - patterns
        - reason
      title: HideReason
      description: "Why one group of hide entries exists, for the operator only.\n\nThe document\
        \ may state a hide as ``{patterns: [...], reason: ...}``;\nthe patterns compile into\
        \ the flat hide spec like any other entry,\nand this side table keeps the reason beside\
        \ them for the host's\nentry points (audit, read-back). It is never rendered to the\
        \ agent: a hide\nanswers ENOENT, and a reason on a nonexistent path would confirm\n\
        the path exists.\n\nArgs:\n    patterns (tuple[str, ...]): the group's entries, as\
        \ compiled\n        (a mount section's entries anchored to its root).\n    reason\
        \ (str): why the operator hid them."
    IOConfig:
      properties:
        buffer_bytes:
          type: integer
          maximum: 9007199254740991.0
          minimum: 16384.0
          title: Buffer Bytes
          default: 65536
      additionalProperties: false
      type: object
      title: IOConfig
      description: Workspace limits for each in-flight byte queue.
    KillJobsResponse:
      properties:
        killed:
          type: integer
          title: Killed
      type: object
      required:
        - killed
      title: KillJobsResponse
    Limit:
      properties:
        max_bytes:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Max Bytes
        max_lines:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Max Lines
        timeout_seconds:
          anyOf:
            - type: number
              minimum: 0.0
            - type: 'null'
          title: Timeout Seconds
        walk_limit:
          anyOf:
            - type: integer
              minimum: -1.0
            - type: 'null'
          title: Walk Limit
        on_exceed:
          $ref: '#/components/schemas/OnExceed'
          default: truncate
      additionalProperties: false
      type: object
      title: Limit
      description: 'A bound on a result: the policy layer''s limit arm and the shape

        every cap config parses into.


        Carries its fields inline (the Deny precedent: an action is its

        payload). ``kind`` is the wire discriminant; ``aggr`` is the

        composition law (AND to the tightest per bound, ANY on error mode)

        and ``layered`` the resolution law (each field from the most

        specific layer that sets it). ``walk_limit`` caps the entries one

        walk lists on a mount, -1 for no cap.'
    MountBackend:
      type: string
      enum:
        - workspace
        - fuse
        - fskit
        - nfs
      title: MountBackend
      description: 'How a mount is exposed to the outside world.


        WORKSPACE is the default: the mount lives only inside mirage''s own

        filesystem and is reached through the command surface, with nothing

        registered with the kernel. FUSE and FSKIT additionally expose it as a

        real mountpoint.


        FSKIT is macOS 15.4+ only and needs no kernel extension. It has no

        ``direct_io`` equivalent, so it serves correct reads only for mounts

        that set ``sizes_always_known``; ``mirage.fuse.backend`` warns at mount

        time about mounts whose size-unknown files will read as empty. Writes

        are also limited: appends and metadata ops persist, but the macFUSE

        FSKit shim flushes pages a file did not already have (a new file, or

        truncate-then-write) as NUL bytes, a limit pinned in

        ``integ/fuse/truth_fskit.json``.

        There is deliberately no ``auto``: auto-selecting FSKIT would silently

        degrade every API-backed mount.


        NFS mounts through the operating system''s own NFS client, so nothing

        is installed: mirage serves NFSv3 on a local port and runs the system

        ``mount``. Linux and macOS; Linux needs root to mount. It is read-only

        for now, and like FSKIT it reads only as far as the size a file

        reports, so it serves mounts that set ``sizes_always_known``.'
    MountBlock:
      properties:
        vfs:
          type: string
          title: Vfs
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
        config:
          additionalProperties: true
          type: object
          title: Config
        command_limits:
          additionalProperties:
            $ref: '#/components/schemas/Limit'
          type: object
          title: Command Limits
        backend:
          $ref: '#/components/schemas/MountBackend'
          default: workspace
        mountpoint:
          anyOf:
            - type: string
            - type: 'null'
          title: Mountpoint
        read:
          anyOf:
            - $ref: '#/components/schemas/ReadPolicy'
            - type: 'null'
        ttl:
          anyOf:
            - type: integer
            - type: 'null'
          title: Ttl
        write:
          anyOf:
            - $ref: '#/components/schemas/WritePolicy'
            - type: 'null'
        index:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamIndexBlock'
                - $ref: '#/components/schemas/RedisIndexBlock'
              discriminator:
                propertyName: type
                mapping:
                  ram: '#/components/schemas/RamIndexBlock'
                  redis: '#/components/schemas/RedisIndexBlock'
            - type: 'null'
          title: Index
      additionalProperties: false
      type: object
      required:
        - vfs
      title: MountBlock
    MountCommandsBlock:
      properties:
        ask:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Ask
          default: []
        deny:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Deny
          default: []
      additionalProperties: false
      type: object
      title: MountCommandsBlock
      description: "``commands:`` of one mount section: ``ask`` and ``deny`` only.\n\nA mount\
        \ rule applies to a line that works inside the mount (its cwd\nor one of its paths\
        \ lies under the root); its ``paths`` are\nabsolute, like every other path in the\
        \ document, and must name\nsomething under that root. There is no ``allow`` here:\
        \ what a\nsession can see is a property of the session, and an operand cannot\nmake\
        \ a command \"not found\".\n\nArgs:\n    ask (tuple[CommandRule, ...]): what needs\
        \ sign-off here.\n    deny (tuple[CommandRule, ...]): what is refused here."
    MountMode:
      type: string
      enum:
        - read
        - write
        - exec
      title: MountMode
      description: 'What a mount lets commands do, a cumulative ladder.


        READ lists and reads. WRITE also creates, changes and deletes. EXEC

        also lets the interpreter commands (python3, js) run code: a script

        file named as their operand must sit on an EXEC mount, while inline

        code and -m need one somewhere in the workspace (imports are not

        checked by path). Shell scripts need no EXEC, since the shell checks

        each of their commands like a typed one; a ./script whose shebang

        names python3 reaches python3, which does check.'
    MountSummary:
      properties:
        prefix:
          type: string
          title: Prefix
        vfs:
          type: string
          title: Vfs
        mode:
          type: string
          title: Mode
        description:
          type: string
          title: Description
          default: ''
      type: object
      required:
        - prefix
        - vfs
        - mode
      title: MountSummary
    OnExceed:
      type: string
      enum:
        - error
        - truncate
      title: OnExceed
    PathsBlock:
      properties:
        hide:
          items:
            type: string
          type: array
          title: Hide
          default: []
        show:
          items:
            $ref: '#/components/schemas/ShowEntry'
          type: array
          title: Show
          default: []
        reasons:
          items:
            $ref: '#/components/schemas/HideReason'
          type: array
          title: Reasons
          default: []
      additionalProperties: false
      type: object
      title: PathsBlock
      description: "``paths:`` of a profile, or of one of its mount sections.\n\n``hide``\
        \ entries use the document's one grammar: an entry with\n``*``, ``?`` or ``[`` is\
        \ a pattern, anything else an exact path\nand its subtree (``utils/hidden.classify_paths``);\
        \ every entry\nholds a token and is absolute or a name pattern, wherever the block\n\
        is written. A hide entry may also be a group\n``{patterns: [...], reason: ...}``:\
        \ the patterns join the flat list\nlike any other entry and the reason lands in ``reasons``,\
        \ the\noperator-only side table (:class:`HideReason`).\n\n``show`` is the other half\
        \ of the path axis: a mapping of path to\nmode (``{\"/repo/docs\": r}``), or a plain\
        \ list whose entries inherit\nthe mount's mode. Every entry is absolute, a subtree\
        \ or an anchored\npattern, because a show anchors to a place and a name pattern names\n\
        none. An entry re-opens its subtree inside a hidden region when its\nanchor is deeper\
        \ than the hide's, and states the mode in force\nbelow its anchor when it carries\
        \ one; both on the one anchor-depth\nrule.\n\nArgs:\n    hide (tuple[str, ...]): what\
        \ the profile makes nonexistent.\n    show (tuple[ShowEntry, ...]): the profile's\
        \ show entries, in\n        document order.\n    reasons (tuple[HideReason, ...]):\
        \ why grouped hide entries\n        exist, for the operator's entry points only."
    ProcessPermissions:
      properties:
        list:
          type: string
          enum:
            - session
            - workspace
          title: List
          default: session
        kill:
          type: string
          enum:
            - session
            - workspace
          title: Kill
          default: session
        max:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Max
          default: 128
      additionalProperties: false
      type: object
      title: ProcessPermissions
      description: "How far past its own session a profile reaches into processes.\n\nA session\
        \ always sees and stops its own processes. ``list`` widens\nwhat ``ps`` and a handler's\
        \ process view see; ``kill`` widens what\nthey may stop, and never past ``list``.\
        \ ``max`` caps the live\nprocesses the session holds, its running line included, as\n\
        ``ulimit -u`` counts the shell. A bare scope sets both. The workspace\nstates one\
        \ for every session and a profile's overrides it field by\nfield (``layered``).\n\n\
        Args:\n    list (ProcessScope): whose processes the session sees.\n    kill (ProcessScope):\
        \ whose processes the session may stop.\n    max (int | None): most live processes,\
        \ ``MAX_PROCESSES`` unless\n        stated, None for no cap."
    ProfileMount:
      properties:
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
        commands:
          anyOf:
            - $ref: '#/components/schemas/MountCommandsBlock'
            - type: 'null'
        paths:
          anyOf:
            - $ref: '#/components/schemas/PathsBlock'
            - type: 'null'
      additionalProperties: false
      type: object
      title: ProfileMount
      description: "One mount's entry in a profile: what this profile may do there.\n\nEvery\
        \ field is optional, and an omitted mount is not a refusal: the\nmount is reachable\
        \ at the mode it declares in the workspace's\n``mounts:``, which a profile can only\
        \ weaken (``weaker_mode``), never\nraise. A profile that must not touch a mount hides\
        \ it, so the mount\nreads as nonexistent rather than as a permission error naming\n\
        something the profile cannot see.\n\n``commands`` here carries ask and deny only:\
        \ an allow list installs\na command for the whole session, and visibility is answered\
        \ before\nany operand exists, so it cannot be per mount. Rules written here\napply\
        \ to a line that works inside this mount, by cwd or by operand,\nwhich is what a path-scoped\
        \ rule cannot express (``cd /repo && git\ncommit`` names no path).\n\nArgs:\n    mode\
        \ (MountMode | None): this profile's mode for the mount; None\n        keeps the mount's\
        \ own.\n    commands (MountCommandsBlock | None): ask and deny rules for\n       \
        \ lines working inside it.\n    paths (PathsBlock | None): hides under it."
    ProfilePolicy:
      properties:
        script:
          anyOf:
            - $ref: '#/components/schemas/ScriptSource'
            - type: string
          title: Script
        runtime:
          anyOf:
            - type: string
            - additionalProperties: true
              type: object
          title: Runtime
          default: monty
        env:
          additionalProperties:
            anyOf:
              - type: string
              - $ref: '#/components/schemas/SecretRef'
          type: object
          title: Env
          default: {}
      additionalProperties: false
      type: object
      required:
        - script
      title: ProfilePolicy
      description: "One program of a profile's policy, as the document states it: the\nprogram,\
        \ and the runtime that runs it.\n\nArgs:\n    script (ScriptSource | str): the policy\
        \ program. A ``str`` is\n        the path form the config loader accepts and loads;\
        \ code\n        passes the loaded ``ScriptSource``, so a path still spelled\n    \
        \    as a string when the workspace reads it means the config\n        layer never\
        \ saw it, and is refused there.\n    runtime (str | dict[str, Any]): the runtime the\
        \ program runs on:\n        a name, or ``{name, config}`` for one that needs settings,\n\
        \        the shape a ``runtimes`` entry has. Monty when the program\n        names\
        \ none; without the ``monty`` extra installed, such a\n        program fails closed\
        \ with the extra's install hint.\n    env (dict[str, str | SecretRef]): variables\
        \ the program runs\n        with beside ``MIRAGE_POLICY_CTX``, on any runtime: a literal,\n\
        \        or a pointer read from its source when the program first\n        runs. None\
        \ of the session's reach it."
    ProtectedResource:
      properties:
        resource:
          type: string
          title: Resource
        authorization_servers:
          items:
            type: string
          type: array
          title: Authorization Servers
        bearer_methods_supported:
          items:
            type: string
          type: array
          title: Bearer Methods Supported
        client_id:
          type: string
          title: Client Id
      type: object
      required:
        - resource
        - authorization_servers
        - bearer_methods_supported
        - client_id
      title: ProtectedResource
    RamCacheBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
        limit:
          anyOf:
            - type: string
            - type: integer
          title: Limit
          default: 32MB
        max_drain_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Max Drain Bytes
      additionalProperties: false
      type: object
      title: RamCacheBlock
    RamIndexBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
        ttl:
          type: number
          title: Ttl
          default: 600
      additionalProperties: false
      type: object
      title: RamIndexBlock
    RamStoreBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
      additionalProperties: false
      type: object
      title: RamStoreBlock
    ReadPolicy:
      type: string
      enum:
        - fresh
        - bounded
        - pinned
      title: ReadPolicy
      description: 'How a mount decides whether cached bytes may be served.


        FRESH revalidates against the backend''s content token before serving

        a cached copy; BOUNDED serves without revalidating, within the

        staleness bound the mount declares.


        PINNED names the content a commit''s fingerprint records. There is no

        version layer to pin to, so a mount declaring it is refused at mount

        time rather than quietly degraded to head: the vocabulary is

        published, so someone will type it, and an informative refusal costs

        one branch over a generic invalid-value error.'
    RedisCacheBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        limit:
          anyOf:
            - type: string
            - type: integer
          title: Limit
          default: 512MB
        max_drain_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Max Drain Bytes
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisCacheBlock
    RedisIndexBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        ttl:
          type: number
          title: Ttl
          default: 600
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisIndexBlock
    RedisStoreBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          type: string
          title: Key Prefix
          default: 'mirage:'
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisStoreBlock
    S3StoreBlock:
      properties:
        timeout:
          type: number
          exclusiveMinimum: 0.0
          title: Timeout
          default: 30
        region:
          anyOf:
            - type: string
            - type: 'null'
          title: Region
        aws_access_key_id:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Access Key Id
        aws_secret_access_key:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Secret Access Key
        aws_session_token:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Session Token
        aws_profile:
          anyOf:
            - type: string
            - type: 'null'
          title: Aws Profile
        bucket:
          type: string
          title: Bucket
        endpoint_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Endpoint Url
        path_style:
          type: boolean
          title: Path Style
          default: false
        proxy:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Proxy
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
          default: mirage/
        default_content_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Default Content Type
        type:
          type: string
          const: s3
          title: Type
      additionalProperties: false
      type: object
      required:
        - bucket
        - type
      title: S3StoreBlock
      description: 'An ``S3Config`` plus the union discriminator: the block IS the

        backend config, so new S3Config fields flow into the store block

        without re-declaring them here.'
    ScriptSource:
      properties:
        source:
          type: string
          title: Source
        language:
          type: string
          enum:
            - python
            - js
          title: Language
          default: python
        module:
          type: boolean
          title: Module
          default: false
      additionalProperties: false
      type: object
      required:
        - source
      title: ScriptSource
      description: "A program's source: a policy program or a script CLI.\n\nA yaml ``script:``\
        \ value references a ``.py`` or ``.js``/``.mjs``\nfile whose content is embedded here\
        \ at load; code passes the text.\nIt runs as a program on the runtime its config names,\
        \ never edited.\n\nArgs:\n    source (str): the script program.\n    language (Language):\
        \ the script's language (\"python\" or \"js\"),\n        stamped from the file extension\
        \ at config load; the\n        programmatic default is \"python\".\n    module (bool):\
        \ the source is an ES module (a ``.mjs`` file), so\n        a js engine must run it\
        \ in module mode or ``import`` and\n        top-level ``await`` fail. Stamped from\
        \ the extension at\n        load beside ``language``, since the path is gone once\
        \ the\n        source is embedded."
    SecretRef:
      properties:
        from:
          type: string
          title: From
        ref:
          type: string
          title: Ref
          default: ''
        key:
          type: string
          title: Key
      additionalProperties: false
      type: object
      required:
        - from
        - key
      title: SecretRef
      description: "A configured value read from a source instead of written down.\n\nThe\
        \ plane's one declarative pointer, spelled with the same three\nkeys the env plane's\
        \ managed entry uses, so one grammar covers\nevery place a deployment points at a\
        \ secret: a source's own config,\na mount's credential, a CLI's.\n\nWhere it may point\
        \ is the *context's* rule, not this model's.\n`SecretSource` narrows its own config\
        \ to `BOOTSTRAP_SOURCES`,\nbecause that is what stops the source table from needing\
        \ a\ndependency graph; a mount has no such limit, since every source is\nalready built\
        \ by the time one is read.\n\nArgs:\n    provider (str): the bootstrap source, `env`\
        \ or `dotenv`.\n        Spelled `from:` in YAML (python keyword), via alias.\n   \
        \ ref (str): the source's address, a file path for `dotenv`.\n    key (str): which\
        \ of the secret's fields holds the value."
    SecretSource:
      properties:
        source:
          type: string
          title: Source
        config:
          additionalProperties: true
          type: object
          title: Config
      additionalProperties: false
      type: object
      required:
        - source
      title: SecretSource
      description: "One declared source instance: which source, and its config.\n\nThe `secrets:`\
        \ block is one map, name -> source, spelled the way\n`mounts:` and `clis:` are: a\
        \ type beside a config. The\ninstance name is what a managed env entry's `from:` names,\
        \ so two\naccounts of one platform are two instances, and an instance named\nafter\
        \ its source reads as that source configured.\n\nThe config map is untyped here, the\
        \ way `mounts.*.config` is: each\nsource owns its own model, and this block only has\
        \ to tell a\npointer from a literal. It does that the way the env plane does,\nby\
        \ the presence of `from`, so a mapping carrying one is validated\nas a `SecretRef`\
        \ and every other value passes through to the\nsource's model.\n\nArgs:\n    source\
        \ (str): the registered source this instance speaks to.\n    config (dict[str, Any]):\
        \ the source's own config fields; a\n        value may be a literal or a `SecretRef`."
    SessionProfile:
      properties:
        cwd:
          anyOf:
            - type: string
            - type: 'null'
          title: Cwd
        env:
          anyOf:
            - additionalProperties:
                anyOf:
                  - type: string
                  - $ref: '#/components/schemas/EnvVar'
              type: object
            - type: 'null'
          title: Env
        mounts:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/ProfileMount'
              type: object
            - type: 'null'
          title: Mounts
        paths:
          anyOf:
            - $ref: '#/components/schemas/PathsBlock'
            - type: 'null'
        vars:
          anyOf:
            - $ref: '#/components/schemas/VarsBlock'
            - type: 'null'
        commands:
          anyOf:
            - $ref: '#/components/schemas/CommandsBlock'
            - type: 'null'
        policy:
          anyOf:
            - additionalProperties:
                items:
                  $ref: '#/components/schemas/ProfilePolicy'
                type: array
              propertyNames:
                enum:
                  - pre_execute
                  - pre_command
                  - pre_vfs
                  - pre_session
                  - pre_network
                  - post_execute
                  - post_command
                  - post_vfs
                  - post_session
                  - post_network
              type: object
            - type: 'null'
          title: Policy
        command_limits:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/Limit'
              type: object
            - type: 'null'
          title: Command Limits
        processes:
          anyOf:
            - $ref: '#/components/schemas/ProcessPermissions'
            - type: 'null'
        network:
          anyOf:
            - type: boolean
            - additionalProperties:
                anyOf:
                  - items:
                      type: string
                    type: array
                  - additionalProperties:
                      type: string
                    type: object
              type: object
            - type: 'null'
          title: Network
      additionalProperties: false
      type: object
      title: SessionProfile
      description: "One profile: the whole permission document a session runs under.\n\nA\
        \ session is created from exactly one of these, and it is the only\nplace permissions\
        \ are written. There is no workspace-wide block and\nno mount-owned block above it,\
        \ so reading this object is reading\neverything the profile may do; what a profile\
        \ does not say, it does not\nrestrict. Configuration, not enforcement: the resolver\
        \ compiles it\nonto the session's narrowing fields and the entry points keep enforcing.\n\
        Deliberately not named a View, which per the view convention is a\nhandle an agent\
        \ holds on one entry point, while a profile is what the\nembedder uses to *define*\
        \ one. Frozen so two agents with the same\nprofile share one object and neither can\
        \ bend the other's view.\n\nTwo rules decide a line against it, and they are the whole\
        \ law.\nA rule naming no path is read by verb (deny before ask before\nallow), wherever\
        \ it is written. A rule carrying paths, and every\nhide, is read by anchor depth:\
        \ the deeper entry wins, ties break by\nverb.\n\nA profile may also state a ``policy``:\
        \ for each ``pre_`` method it\nanswers at (``pre_execute``, ``pre_command``, ``pre_vfs``,\n\
        ``pre_session``), a list of programs, each with the runtime it runs\non (``ProfilePolicy``,\
        \ the shape a ``clis`` entry has). A program's\nfunction for the method takes its\
        \ context and returns its answer:\nNone for no opinion, a deny, an ask, or at ``pre_execute``\
        \ a route.\nThey are asked in order and the first deny wins, so a policy expresses\n\
        the conditions a declarative rule cannot; like every policy, it can\nonly restrict,\
        \ never grant past a deny. The document is optional\nbeside it: a profile stating\
        \ only a policy hides nothing, and the\npolicy is its whole admission policy.\n\n\
        Args:\n    cwd (str | None): the session's working directory at creation.\n    env\
        \ (dict[str, str | EnvVar] | None): the env entries seeded\n        into the session\
        \ at creation, in the workspace ``env``\n        grammar: a bare string is an exported\
        \ literal, and a\n        ``from:`` entry a managed pointer, so a credential is\n\
        \        named here and fetched, never written as its value.\n    mounts (dict[str,\
        \ ProfileMount] | None): per-mount settings,\n        keyed by prefix: a mode, ask\
        \ and deny rules for lines\n        working inside the mount, and hides under it.\
        \ A mount the\n        mapping omits keeps its own mode and gains no rules.\n    paths\
        \ (PathsBlock | None): the profile's hides, absolute.\n    vars (VarsBlock | None):\
        \ the profile's hidden variables.\n    commands (CommandsBlock | None): the profile's\
        \ allow list and its\n        ask / deny rules, absolute paths.\n    policy (dict[ScriptMethod,\
        \ list[ProfilePolicy]] | None): the\n        profile's policy: each ``pre_`` method's\
        \ programs, asked in\n        order.\n    network (bool | dict[str, list[str]] | None):\
        \ where the\n        session's lines may connect, the workspace's ``network``\n  \
        \      grammar, held besides the workspace's own; None leaves the\n        workspace's\
        \ alone."
    SessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        cwd:
          type: string
          title: Cwd
      type: object
      required:
        - session_id
        - cwd
      title: SessionResponse
    SessionSummary:
      properties:
        session_id:
          type: string
          title: Session Id
        cwd:
          type: string
          title: Cwd
      type: object
      required:
        - session_id
        - cwd
      title: SessionSummary
    ShowEntry:
      properties:
        path:
          type: string
          title: Path
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
      additionalProperties: false
      type: object
      required:
        - path
      title: ShowEntry
      description: "One ``show`` entry of a profile's path axis, compiled.\n\nArgs:\n    path\
        \ (str): the entry as written: an exact subtree or an\n        anchored pattern, always\
        \ absolute. A slashless name pattern\n        is refused at validation, because a\
        \ show anchors to a place\n        and a name pattern names none.\n    mode (MountMode\
        \ | None): the mode the entry states for its\n        subtree; None for a list-form\
        \ entry, which inherits the\n        mount's."
    ShutdownResponse:
      properties:
        status:
