        - type
      title: DiskStoreBlock
    DocumentPath:
      properties:
        path:
          type: string
          title: Path
      additionalProperties: false
      type: object
      required:
        - path
      title: DocumentPath
    EnvVar:
      properties:
        value:
          anyOf:
            - type: string
            - type: 'null'
          title: Value
        readonly:
          type: boolean
          title: Readonly
          default: false
        export:
          type: boolean
          title: Export
          default: true
        from:
          anyOf:
            - type: string
            - type: 'null'
          title: From
        ref:
          type: string
          title: Ref
          default: ''
        key:
          anyOf:
            - type: string
            - type: 'null'
          title: Key
        fetch:
          type: string
          enum:
            - lazy
            - eager
          title: Fetch
          default: lazy
      additionalProperties: false
      type: object
      title: EnvVar
      description: "One entry of the env map: a literal value or a managed pointer.\n\nThe\
        \ env block is one map, name -> entry. A bare string in the map\nis the literal short\
        \ form and never reaches this model; a dict is\nvalidated through it. `value` and\
        \ `from` are mutually exclusive and\none is required: `export` belongs to a literal\
        \ entry, `ref`/`key`/\n`fetch` to a managed one, and `readonly` to either.\n\nArgs:\n\
        \    value (str | None): the literal text; set = a literal entry.\n    readonly (bool):\
        \ compiles to `VarAttr.READONLY`, so the agent\n        cannot assign to the name\
        \ or unset it. Legal on a managed\n        entry too, and the point of one: the fetch\
        \ writes the\n        record itself rather than going through the shell's\n      \
        \  assignment gate, so mirage still fills a readonly\n        credential while a line\
        \ that tries to overwrite it is\n        refused.\n    export (bool): literal-only\
        \ knob (default on); a managed entry\n        is always exported.\n    provider (str\
        \ | None): registered source name; set = a managed\n        entry. Spelled `from:`\
        \ in YAML (python keyword), via alias.\n    ref (str): the source's address for the\
        \ secret.\n    key (str | None): which secret field to read; default the\n       \
        \ variable's own name.\n    fetch (Literal[\"lazy\", \"eager\"]): eager joins every\
        \ line's\n        fetch set instead of waiting for a reference."
    HTTPValidationError:
      example:
        detail:
          - type: string_type
            loc: [body, id]
            msg: Input should be a valid string
            input: 4
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
        workspaces:
          type: integer
          title: Workspaces
        uptime_s:
          type: number
          title: Uptime S
      type: object
      required:
        - workspaces
        - uptime_s
      title: HealthResponse
    HideReason:
      properties:
        patterns:
          items:
            type: string
          type: array
          title: Patterns
        reason:
          type: string
          title: Reason
      additionalProperties: false
      type: object
      required:
        - patterns
        - reason
      title: HideReason
      description: "Why one group of hide entries exists, for the operator only.\n\nThe document\
        \ may state a hide as ``{patterns: [...], reason: ...}``;\nthe patterns compile into\
        \ the flat hide spec like any other entry,\nand this side table keeps the reason beside\
        \ them for the host's\nentry points (audit, read-back). It is never rendered to the\
        \ agent: a hide\nanswers ENOENT, and a reason on a nonexistent path would confirm\n\
        the path exists.\n\nArgs:\n    patterns (tuple[str, ...]): the group's entries, as\
        \ compiled\n        (a mount section's entries anchored to its root).\n    reason\
        \ (str): why the operator hid them."
    IOConfig:
      properties:
        buffer_bytes:
          type: integer
          maximum: 9007199254740991.0
          minimum: 16384.0
          title: Buffer Bytes
          default: 65536
      additionalProperties: false
      type: object
      title: IOConfig
      description: Workspace limits for each in-flight byte queue.
    KillJobsResponse:
      properties:
        killed:
          type: integer
          title: Killed
      type: object
      required:
        - killed
      title: KillJobsResponse
    Limit:
      properties:
        max_bytes:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Max Bytes
        max_lines:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Max Lines
        timeout_seconds:
          anyOf:
            - type: number
              minimum: 0.0
            - type: 'null'
          title: Timeout Seconds
        walk_limit:
          anyOf:
            - type: integer
              minimum: -1.0
            - type: 'null'
          title: Walk Limit
        on_exceed:
          $ref: '#/components/schemas/OnExceed'
          default: truncate
      additionalProperties: false
      type: object
      title: Limit
      description: 'A bound on a result: the policy layer''s limit arm and the shape

        every cap config parses into.


        Carries its fields inline (the Deny precedent: an action is its

        payload). ``kind`` is the wire discriminant; ``aggr`` is the

        composition law (AND to the tightest per bound, ANY on error mode)

        and ``layered`` the resolution law (each field from the most

        specific layer that sets it). ``walk_limit`` caps the entries one

        walk lists on a mount, -1 for no cap.'
    MountBackend:
      type: string
      enum:
        - workspace
        - fuse
        - fskit
        - nfs
      title: MountBackend
      description: 'How a mount is exposed to the outside world.


        WORKSPACE is the default: the mount lives only inside mirage''s own

        filesystem and is reached through the command surface, with nothing

        registered with the kernel. FUSE and FSKIT additionally expose it as a

        real mountpoint.


        FSKIT is macOS 15.4+ only and needs no kernel extension. It has no

        ``direct_io`` equivalent, so it serves correct reads only for mounts

        that set ``sizes_always_known``; ``mirage.fuse.backend`` warns at mount

        time about mounts whose size-unknown files will read as empty. Writes

        are also limited: appends and metadata ops persist, but the macFUSE

        FSKit shim flushes pages a file did not already have (a new file, or

        truncate-then-write) as NUL bytes, a limit pinned in

        ``integ/fuse/truth_fskit.json``.

        There is deliberately no ``auto``: auto-selecting FSKIT would silently

        degrade every API-backed mount.


        NFS mounts through the operating system''s own NFS client, so nothing

        is installed: mirage serves NFSv3 on a local port and runs the system

        ``mount``. Linux and macOS; Linux needs root to mount. It is read-only

        for now, and like FSKIT it reads only as far as the size a file

        reports, so it serves mounts that set ``sizes_always_known``.'
    MountBlock:
      properties:
        vfs:
          type: string
          title: Vfs
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
        config:
          additionalProperties: true
          type: object
          title: Config
        command_limits:
          additionalProperties:
            $ref: '#/components/schemas/Limit'
          type: object
          title: Command Limits
        backend:
          $ref: '#/components/schemas/MountBackend'
          default: workspace
        mountpoint:
          anyOf:
            - type: string
            - type: 'null'
          title: Mountpoint
        read:
          anyOf:
            - $ref: '#/components/schemas/ReadPolicy'
            - type: 'null'
        ttl:
          anyOf:
            - type: integer
            - type: 'null'
          title: Ttl
        write:
          anyOf:
            - $ref: '#/components/schemas/WritePolicy'
            - type: 'null'
        index:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamIndexBlock'
                - $ref: '#/components/schemas/RedisIndexBlock'
              discriminator:
                propertyName: type
                mapping:
                  ram: '#/components/schemas/RamIndexBlock'
                  redis: '#/components/schemas/RedisIndexBlock'
            - type: 'null'
          title: Index
      additionalProperties: false
      type: object
      required:
        - vfs
      title: MountBlock
    MountCommandsBlock:
      properties:
        ask:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Ask
          default: []
        deny:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Deny
          default: []
      additionalProperties: false
      type: object
      title: MountCommandsBlock
      description: "``commands:`` of one mount section: ``ask`` and ``deny`` only.\n\nA mount\
        \ rule applies to a line that works inside the mount (its cwd\nor one of its paths\
        \ lies under the root); its ``paths`` are\nabsolute, like every other path in the\
        \ document, and must name\nsomething under that root. There is no ``allow`` here:\
        \ what a\nsession can see is a property of the session, and an operand cannot\nmake\
        \ a command \"not found\".\n\nArgs:\n    ask (tuple[CommandRule, ...]): what needs\
        \ sign-off here.\n    deny (tuple[CommandRule, ...]): what is refused here."
    MountMode:
      type: string
      enum:
        - read
        - write
        - exec
      title: MountMode
      description: 'What a mount lets commands do, a cumulative ladder.


        READ lists and reads. WRITE also creates, changes and deletes. EXEC

        also lets the interpreter commands (python3, js) run code: a script

        file named as their operand must sit on an EXEC mount, while inline

        code and -m need one somewhere in the workspace (imports are not

        checked by path). Shell scripts need no EXEC, since the shell checks

        each of their commands like a typed one; a ./script whose shebang

        names python3 reaches python3, which does check.'
    MountSummary:
      properties:
        prefix:
          type: string
          title: Prefix
        vfs:
          type: string
          title: Vfs
        mode:
          type: string
          title: Mode
        description:
          type: string
          title: Description
          default: ''
      type: object
      required:
        - prefix
        - vfs
        - mode
      title: MountSummary
    OnExceed:
      type: string
      enum:
        - error
        - truncate
      title: OnExceed
    PathsBlock:
      properties:
        hide:
          items:
            type: string
          type: array
          title: Hide
          default: []
        show:
          items:
            $ref: '#/components/schemas/ShowEntry'
          type: array
          title: Show
          default: []
        reasons:
          items:
            $ref: '#/components/schemas/HideReason'
          type: array
          title: Reasons
          default: []
      additionalProperties: false
      type: object
      title: PathsBlock
      description: "``paths:`` of a profile, or of one of its mount sections.\n\n``hide``\
        \ entries use the document's one grammar: an entry with\n``*``, ``?`` or ``[`` is\
        \ a pattern, anything else an exact path\nand its subtree (``utils/hidden.classify_paths``);\
        \ every entry\nholds a token and is absolute or a name pattern, wherever the block\n\
        is written. A hide entry may also be a group\n``{patterns: [...], reason: ...}``:\
        \ the patterns join the flat list\nlike any other entry and the reason lands in ``reasons``,\
        \ the\noperator-only side table (:class:`HideReason`).\n\n``show`` is the other half\
        \ of the path axis: a mapping of path to\nmode (``{\"/repo/docs\": r}``), or a plain\
        \ list whose entries inherit\nthe mount's mode. Every entry is absolute, a subtree\
        \ or an anchored\npattern, because a show anchors to a place and a name pattern names\n\
        none. An entry re-opens its subtree inside a hidden region when its\nanchor is deeper\
        \ than the hide's, and states the mode in force\nbelow its anchor when it carries\
        \ one; both on the one anchor-depth\nrule.\n\nArgs:\n    hide (tuple[str, ...]): what\
        \ the profile makes nonexistent.\n    show (tuple[ShowEntry, ...]): the profile's\
        \ show entries, in\n        document order.\n    reasons (tuple[HideReason, ...]):\
        \ why grouped hide entries\n        exist, for the operator's entry points only."
    ProcessPermissions:
      properties:
        list:
          type: string
          enum:
            - session
            - workspace
          title: List
          default: session
        kill:
          type: string
          enum:
            - session
            - workspace
          title: Kill
          default: session
        max:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Max
          default: 128
      additionalProperties: false
      type: object
      title: ProcessPermissions
      description: "How far past its own session a profile reaches into processes.\n\nA session\
        \ always sees and stops its own processes. ``list`` widens\nwhat ``ps`` and a handler's\
        \ process view see; ``kill`` widens what\nthey may stop, and never past ``list``.\
        \ ``max`` caps the live\nprocesses the session holds, its running line included, as\n\
        ``ulimit -u`` counts the shell. A bare scope sets both. The workspace\nstates one\
        \ for every session and a profile's overrides it field by\nfield (``layered``).\n\n\
        Args:\n    list (ProcessScope): whose processes the session sees.\n    kill (ProcessScope):\
        \ whose processes the session may stop.\n    max (int | None): most live processes,\
        \ ``MAX_PROCESSES`` unless\n        stated, None for no cap."
    ProfileMount:
      properties:
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
        commands:
          anyOf:
            - $ref: '#/components/schemas/MountCommandsBlock'
            - type: 'null'
        paths:
          anyOf:
            - $ref: '#/components/schemas/PathsBlock'
            - type: 'null'
      additionalProperties: false
      type: object
      title: ProfileMount
      description: "One mount's entry in a profile: what this profile may do there.\n\nEvery\
        \ field is optional, and an omitted mount is not a refusal: the\nmount is reachable\
        \ at the mode it declares in the workspace's\n``mounts:``, which a profile can only\
        \ weaken (``weaker_mode``), never\nraise. A profile that must not touch a mount hides\
        \ it, so the mount\nreads as nonexistent rather than as a permission error naming\n\
        something the profile cannot see.\n\n``commands`` here carries ask and deny only:\
        \ an allow list installs\na command for the whole session, and visibility is answered\
        \ before\nany operand exists, so it cannot be per mount. Rules written here\napply\
        \ to a line that works inside this mount, by cwd or by operand,\nwhich is what a path-scoped\
        \ rule cannot express (``cd /repo && git\ncommit`` names no path).\n\nArgs:\n    mode\
        \ (MountMode | None): this profile's mode for the mount; None\n        keeps the mount's\
        \ own.\n    commands (MountCommandsBlock | None): ask and deny rules for\n       \
        \ lines working inside it.\n    paths (PathsBlock | None): hides under it."
    ProfilePolicy:
      properties:
        script:
          anyOf:
            - $ref: '#/components/schemas/ScriptSource'
            - type: string
          title: Script
        runtime:
          anyOf:
            - type: string
            - additionalProperties: true
              type: object
          title: Runtime
          default: monty
        env:
          additionalProperties:
            anyOf:
              - type: string
              - $ref: '#/components/schemas/SecretRef'
          type: object
          title: Env
          default: {}
      additionalProperties: false
      type: object
      required:
        - script
      title: ProfilePolicy
      description: "One program of a profile's policy, as the document states it: the\nprogram,\
        \ and the runtime that runs it.\n\nArgs:\n    script (ScriptSource | str): the policy\
        \ program. A ``str`` is\n        the path form the config loader accepts and loads;\
        \ code\n        passes the loaded ``ScriptSource``, so a path still spelled\n    \
        \    as a string when the workspace reads it means the config\n        layer never\
        \ saw it, and is refused there.\n    runtime (str | dict[str, Any]): the runtime the\
        \ program runs on:\n        a name, or ``{name, config}`` for one that needs settings,\n\
        \        the shape a ``runtimes`` entry has. Monty when the program\n        names\
        \ none; without the ``monty`` extra installed, such a\n        program fails closed\
        \ with the extra's install hint.\n    env (dict[str, str | SecretRef]): variables\
        \ the program runs\n        with beside ``MIRAGE_POLICY_CTX``, on any runtime: a literal,\n\
        \        or a pointer read from its source when the program first\n        runs. None\
        \ of the session's reach it."
    ProtectedResource:
      properties:
        resource:
          type: string
          title: Resource
        authorization_servers:
          items:
            type: string
          type: array
          title: Authorization Servers
        bearer_methods_supported:
          items:
            type: string
          type: array
          title: Bearer Methods Supported
        client_id:
          type: string
          title: Client Id
      type: object
      required:
        - resource
        - authorization_servers
        - bearer_methods_supported
        - client_id
      title: ProtectedResource
    RamCacheBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
        limit:
          anyOf:
            - type: string
            - type: integer
          title: Limit
          default: 32MB
        max_drain_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Max Drain Bytes
      additionalProperties: false
      type: object
      title: RamCacheBlock
    RamIndexBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
        ttl:
          type: number
          title: Ttl
          default: 600
      additionalProperties: false
      type: object
      title: RamIndexBlock
    RamStoreBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
      additionalProperties: false
      type: object
      title: RamStoreBlock
    ReadPolicy:
      type: string
      enum:
        - fresh
        - bounded
        - pinned
      title: ReadPolicy
      description: 'How a mount decides whether cached bytes may be served.


        FRESH revalidates against the backend''s content token before serving

        a cached copy; BOUNDED serves without revalidating, within the

        staleness bound the mount declares.


        PINNED names the content a commit''s fingerprint records. There is no

        version layer to pin to, so a mount declaring it is refused at mount

        time rather than quietly degraded to head: the vocabulary is

        published, so someone will type it, and an informative refusal costs

        one branch over a generic invalid-value error.'
    RedisCacheBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        limit:
          anyOf:
            - type: string
            - type: integer
          title: Limit
          default: 512MB
        max_drain_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Max Drain Bytes
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisCacheBlock
    RedisIndexBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        ttl:
          type: number
          title: Ttl
          default: 600
