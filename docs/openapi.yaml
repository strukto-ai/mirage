      operationId: set_profile_v1_workspaces__workspace_id__profiles__name__put
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            title: Workspace Id
        - name: name
          in: path
          required: true
          schema:
            type: string
            title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionProfile'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Set Profile V1 Workspaces  Workspace Id  Profiles  Name  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 'Define a named profile on the live workspace, or replace it.


        Only the live table changes: a session moves when it is updated

        onto the name, and the workspace''s config is never rewritten.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/clis/{name}:
