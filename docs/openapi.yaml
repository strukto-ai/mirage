          schema:
            type: boolean
            default: false
        - name: stream
          in: query
          description: Return output as it is produced, as NDJSON records ending with a status
            record. Cannot be combined with `explain`.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The request was accepted. By default the body is one JSON result. With
            `explain=true` it is the policy decision and nothing ran. With `stream=true` it is
            NDJSON. A `200` does not mean the command succeeded; check `exit_code`.
