openapi: 3.1.0
info:
  title: Mirage API
  version: '0.1'
servers:
  - url: http://127.0.0.1:8765
    description: A local daemon on its default port
paths:
  /v1/workspaces:
    post:
      summary: Create a workspace
      operationId: create_workspace_v1_workspaces_post
      parameters:
        - name: explain
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Explain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 'Create a workspace, or answer the live one created from this config.


        Creating is idempotent for one config: an id already held by a

        workspace created from an identical config answers that workspace

        with 200, so a client that names its workspace can run again and

        reach it; an id held by anything else is refused with 409. The

        server''s policies judge the config as written (`pre_workspace`)

        before any of it is built: a refusal is 403 with its reason, and

        `explain` answers what they say without creating anything.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
        - console
    get:
      summary: List workspaces
      operationId: list_workspaces_v1_workspaces_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceBrief'
                title: Response List Workspaces V1 Workspaces Get
      tags:
        - Workspaces
      x-hosts:
        - daemon
        - console
  /v1/workspaces/{workspace_id}:
    get:
      summary: Get a workspace
      operationId: get_workspace_v1_workspaces__workspace_id__get
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            title: Workspace Id
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Verbose
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
        - Workspaces
      x-hosts:
        - daemon
        - console
    delete:
      summary: Delete a workspace
      operationId: delete_workspace_v1_workspaces__workspace_id__delete
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkspaceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
        - Workspaces
      x-hosts:
        - daemon
        - console
  /v1/workspaces/{workspace_id}/history:
    get:
      summary: Read a workspace's history
      operationId: workspace_history_v1_workspaces__workspace_id__history_get
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            title: Workspace Id
        - name: session_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Session Id
        - name: since
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            title: Since
        - name: last
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            title: Last
        - name: vfs
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Vfs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Workspace History V1 Workspaces  Workspace Id  History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 'The workspace''s recorded history, oldest first: a `command`

        entry for every line its sessions ran, and with `vfs` a `vfs`

        entry for every call a line made to a mount. Read on the workspace''s

        own loop.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/close:
    post:
      summary: Close a workspace
      operationId: close_workspace_v1_workspaces__workspace_id__close_post
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkspaceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Close the workspace and keep its state for the owner to reopen.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/cancel:
