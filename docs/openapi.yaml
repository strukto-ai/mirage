        - unconditional
        - conditional
        - staged
      title: WritePolicy
      description: 'Whether a mount''s writes carry the version they were based on.


        UNCONDITIONAL replacements use last-write-wins. Shared rewrites that

        observed a missing file require atomic create-only under either policy.

        CONDITIONAL writes send the version the mount last saw for the path

        (the backend''s native precondition, If-Match on the S3 family), so a

        write based on a stale read is refused instead of overwriting the newer

        bytes. STAGED names a staging layer mirage does not have; a mount declaring it is

        refused at mount time, as ``read: pinned`` is.'
    Error:
      type: object
      properties:
        detail:
          description: What went wrong, as text or a structured record.
        errno:
          type: string
          description: The errno of a failed file call, such as ENOENT.
        refusal:
          type: object
          description: The policy refusal, when a policy refused the call.
      required:
        - detail
    ShellResult:
      type: object
      properties:
        kind:
          type: string
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
        refusal:
          anyOf:
            - type: object
            - type: 'null'
        line_id:
          type: string
          description: The line's id, by which `GET .../lines/{line_id}` finds it.
      required:
        - kind
        - exit_code
        - stdout
        - stderr
        - line_id
      title: Shell result
    ShellRequest:
      type: object
      properties:
        command:
          type: string
          description: The line.
        cwd:
          type: string
          description: A working directory for this line only.
        runtime:
          type: string
          description: Run the line on this runtime, by name, instead of the one routing picks.
        record:
          type: boolean
          default: true
          description: Add the line to the session's history.
      required:
        - command
    LoadRequest:
      type: object
      properties:
        key:
          type: string
          description: The tar's key in the snapshot store; leave it out when uploading.
        id:
          type: string
          description: The new workspace's id.
        override:
          type: object
          description: Configuration overrides for the restored workspace, including credentials
            redacted from the snapshot.
    Explanation:
      type: object
      description: What a call would do, without doing it (explain=true).
      properties:
        type:
          type: string
          description: line, command or vfs.
        outcome:
          type: string
          enum:
            - ALLOW
            - DENY
            - ASK
        reason:
          type: string
          description: Why, in the deciding policy's words.
        source:
          type: string
          description: Where in the profile the deciding rule is written.
        answers:
          type: array
          items:
            type: object
          description: Every policy's answer.
        refusal:
          anyOf:
            - type: object
            - type: 'null'
      required:
        - outcome
    ShellExplanation:
      allOf:
        - $ref: '#/components/schemas/Explanation'
        - type: object
          properties:
            line:
              type: string
            exit_code:
              type: integer
              description: What the line is refused with, 0 when it runs.
            stderr:
              type: string
            node:
              type: object
              description: The parsed line and each command's explanation.
      title: Shell explanation
    VfsExplanation:
      allOf:
        - $ref: '#/components/schemas/Explanation'
        - type: object
          properties:
            call:
              type: string
            paths:
              type: array
              items:
                type: string
            error:
              type: string
              description: The errno name the call would raise, empty when it runs.
      title: VFS explanation
    SecretPointer:
      type: object
      properties:
        from:
          type: string
          description: The saved store holding the secret.
        ref:
          type: string
          description: The secret in that store.
        key:
          type: string
          description: The key inside that secret whose value the field takes.
      required:
        - from
        - ref
        - key
    FieldValue:
      description: A field's value, or a pointer to a saved store's secret for a string field.
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items: {}
        - $ref: '#/components/schemas/SecretPointer'
    TypeField:
      type: object
      properties:
        name:
          type: string
          description: The field's key in `fields`.
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - list
            - object
        secret:
          type: boolean
          description: 'Kept sealed: write-only, never answered.'
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          description: The values the field takes, when it is a choice.
        description:
          type: string
        default:
          anyOf:
            - type: string
            - type: number
            - type: boolean
        group:
          type: string
          description: The section a form shows the field under.
      required:
        - name
        - type
        - secret
        - required
    TypeTable:
      type: object
      description: Each type by name, with the fields its config takes.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/TypeField'
    SavedEntry:
      type: object
      properties:
        id:
          type: string
          description: The entry's id; the daemon uses its name.
        name:
          type: string
        kind:
          type: string
          enum:
            - vfs
            - cli
            - runtime
        type:
          type: string
          description: The VFS, CLI or runtime type, such as s3.
        builtin:
          type: boolean
        config:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldValue'
          description: The plain fields. Sealed fields are never answered.
        captures:
          type: array
          items: {}
          description: A runtime's captures; runtimes only.
        created_by:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
        used_by:
          type: integer
          description: How many templates name the entry; in a list only.
      required:
        - id
        - name
        - kind
        - type
        - builtin
        - config
    SavedEntryDetail:
      allOf:
        - $ref: '#/components/schemas/SavedEntry'
        - type: object
          properties:
            sealed:
              type: array
              items:
                type: string
              description: The sealed fields, by name.
          required:
            - sealed
    SavedEntryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedEntry'
      required:
        - items
    CreateSavedEntryRequest:
      type: object
      properties:
        name:
          type: string
          description: 1 to 63 of a-z 0-9 . _ -, starting with a letter or digit. Not `types`,
            and not shaped like an id.
        type:
          type: string
          description: One of the types its kind's `/types` route lists, such as `GET /v1/vfs/types`.
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldValue'
          description: The type's config. Secret fields are sealed; a string field may point
            at a saved store instead.
      required:
        - name
        - type
        - fields
    UpdateSavedEntryRequest:
      type: object
      properties:
        fields:
          type: object
          additionalProperties:
            anyOf:
              - $ref: '#/components/schemas/FieldValue'
              - type: 'null'
          description: The fields to set. A sealed field left out keeps its value; null removes
            a field.
      required:
        - fields
    CreatePolicyRequest:
      additionalProperties: false
      properties:
        name:
          type: string
          description: Ends in .py, such as guard.py.
        source:
          type: string
          description: The policy's Python program, up to 64 KiB.
      required:
        - name
        - source
      type: object
    UpdatePolicyRequest:
      additionalProperties: false
      properties:
        source:
          type: string
          description: The new program, up to 64 KiB.
      required:
        - source
      type: object
    PolicyResponse:
      properties:
        name:
          type: string
        source:
          type: string
      required:
        - name
        - source
      type: object
    PolicyName:
      properties:
        name:
          type: string
      required:
        - name
      type: object
    PolicyList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PolicyName'
          type: array
      required:
        - items
      type: object
    TemplateList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TemplateResponse'
          type: array
      required:
        - items
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The server's token (MIRAGE_AUTH_TOKEN) or a JWT. A daemon in the default
        local mode with no token accepts requests without one.
  responses:
    '413':
      description: The request body, multipart part, or stdin exceeds its size limit.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/Error'
              - title: TypeScript JSON body limit
                type: object
                properties:
                  statusCode:
                    type: integer
                    const: 413
                  code:
                    type: string
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - statusCode
                  - code
                  - error
                  - message
          examples:
            request_part:
              summary: Python or multipart request limit
              value:
                detail: request body too large
            typescript_json:
              summary: TypeScript JSON body limit
              value:
                statusCode: 413
                code: FST_ERR_CTP_BODY_TOO_LARGE
                error: Payload Too Large
                message: Request body is too large
    '499':
      description: The running shell job was canceled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: job canceled
    '500':
      description: The job or server operation failed internally. Inspect detail and server logs
        before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '507':
      description: The filesystem operation exceeds its storage capacity or quota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '400':
      description: 'Bad request: malformed, a host not allowed, or a browser page from another
        origin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
            description: The daemon refuses a host not allowed, or a browser page from another
              origin, in plain text.
    '401':
      description: The token is missing or wrong
      content:
        application/json:
          example:
            detail: Unauthorized
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          example: Unauthorized
          schema:
            type: string
            description: The Python daemon answers Unauthorized as plain text.
    '403':
      description: A policy or mount mode refused the call
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: The workspace, session, job or file does not exist
      content:
        application/json:
          example:
            detail: workspace not found
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: The id or name is taken, the workspace is busy, or a file changed since
        it was read
      content:
        application/json:
          example:
            detail: "workspace id already exists: 'demo'"
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: Past a rate limit, or a new session past max_sessions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
    '501':
      description: The server requires accounts; saved configs are kept only on a server of
        one account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: The server is at max_workspaces, or shutting down
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VfsDocument:
      description: Generated VFS.md document.
      content:
        text/markdown:
          schema:
            type: string
          example: |+
            ---
            name: workspace-filesystem
            description: The virtual filesystem layout of this workspace.
            ---

            # Virtual Filesystem

            You work in a terminal over a virtual filesystem. Read files with shell commands; access is checked for each operation.

            | Path | Description |
            | --- | --- |
            | `/` | `ram`, write |
            | `/dev` | `ram`, write |

            ## Supported Unix Commands for VFS

            Unix commands work on each path as on a local filesystem, as far as the path supports them:

            | Path | Supported |
            | --- | --- |
            | `/` | Almost all Unix commands. |
            | `/dev` | Almost all Unix commands. |

            ## Limitations of Unix Commands for VFS

            Where a path differs from a local filesystem:

            | Path | Limitations |
            | --- | --- |
            | `/` | `grep -r`, `find` and `du` stop after 10000 files; a glob matching more, `tar -c`, `cp -r` and `rm -r` are refused. |
            | `/dev` | `grep -r`, `find` and `du` stop after 10000 files; a glob matching more, `tar -c`, `cp -r` and `rm -r` are refused. |

            Run `man <cmd>` or `<cmd> --help` for one command's usage.
    SkillDocument:
      description: Generated SKILL.md document.
      content:
        text/markdown:
          schema:
            type: string
          example: |+
            ---
            name: workspace-commands
            description: The CLIs registered in this workspace and how to call them.
            ---

            # Available commands

            No CLIs are registered.
  parameters:
    workspaceId:
      name: workspace_id
      in: path
      required: true
      description: The workspace's id.
      schema:
        type: string
      example: demo
    sessionId:
      name: session_id
      in: query
      required: false
      description: The session the call acts as; the default session when absent.
      schema:
        type: string
      example: analysis
