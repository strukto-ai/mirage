          type: number
          title: Closed At
          description: When the workspace stopped or was deleted, in epoch seconds.
      type: object
      required:
        - id
        - closed_at
      title: DeleteWorkspaceResponse
    DiskStoreBlock:
      properties:
        type:
          type: string
          const: disk
          title: Type
        root:
          type: string
          title: Root
          default: ~/.mirage/state
      additionalProperties: false
      type: object
      required:
        - type
      title: DiskStoreBlock
    DocumentPath:
      properties:
        path:
          type: string
          title: Path
      additionalProperties: false
      type: object
      required:
        - path
      title: DocumentPath
    EnvVar:
      properties:
        value:
          anyOf:
            - type: string
            - type: 'null'
          title: Value
        readonly:
          type: boolean
          title: Readonly
          default: false
        export:
          type: boolean
          title: Export
          default: true
        from:
          anyOf:
            - type: string
            - type: 'null'
          title: From
        ref:
          type: string
          title: Ref
          default: ''
        key:
          anyOf:
            - type: string
            - type: 'null'
          title: Key
        fetch:
          type: string
          enum:
            - lazy
            - eager
          title: Fetch
          default: lazy
      additionalProperties: false
      type: object
      title: EnvVar
      description: An environment variable with a literal `value` or a secret source identified by `from`,
        never both. Use `ref` and `key` to select a secret. `readonly` prevents commands from changing
        the variable. Managed secrets are always exported; literal values use the `export` setting.
    HTTPValidationError:
      example:
        detail:
          - type: string_type
            loc: [body, id]
            msg: Input should be a valid string
            input: 4
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
        workspaces:
          type: integer
          title: Workspaces
        uptime_s:
          type: number
          title: Uptime S
      type: object
      required:
        - workspaces
        - uptime_s
      title: HealthResponse
    HideReason:
      properties:
        patterns:
          items:
            type: string
          type: array
          title: Patterns
        reason:
          type: string
          title: Reason
      additionalProperties: false
      type: object
      required:
        - patterns
        - reason
      title: HideReason
      description: An optional explanation for hidden paths. The explanation is available to operators,
        not to agents accessing the workspace. Hidden paths appear not to exist.
    IOConfig:
      properties:
        buffer_bytes:
          type: integer
          maximum: 9007199254740991.0
          minimum: 16384.0
          title: Buffer Bytes
          default: 65536
      additionalProperties: false
      type: object
      title: IOConfig
      description: Buffer limits for input and output while commands run.
    KillJobsResponse:
      properties:
        killed:
          type: integer
          title: Killed
      type: object
      required:
        - killed
      title: KillJobsResponse
    Limit:
      properties:
        max_bytes:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Max Bytes
        max_lines:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Max Lines
        timeout_seconds:
          anyOf:
            - type: number
              minimum: 0.0
            - type: 'null'
          title: Timeout Seconds
        walk_limit:
          anyOf:
            - type: integer
              minimum: -1.0
            - type: 'null'
          title: Walk Limit
        on_exceed:
          $ref: '#/components/schemas/OnExceed'
          default: truncate
      additionalProperties: false
      type: object
      title: Limit
      description: Limits for command output, execution time, and directory traversal. Use `on_exceed`
        to truncate results or return an error. A `walk_limit` of `-1` allows unlimited entries.
    MountBackend:
      type: string
      enum:
        - workspace
        - fuse
        - fskit
        - nfs
      title: MountBackend
      description: |-
        How the mount is exposed. `workspace` is available only through Mirage. `fuse` and `fskit` expose operating-system mountpoints. `nfs` uses the system NFS client on Linux or macOS; Linux requires root.

        FSKit requires macOS 15.4 or later. FSKit and NFS require known file sizes for correct reads. NFS is read-only. The macFUSE FSKit adapter supports appends and metadata changes, but new-file and truncate-then-write operations can write zero-filled data instead of content. Select the backend explicitly.
    MountBlock:
      properties:
        vfs:
          type: string
          title: Vfs
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
        config:
          additionalProperties: true
          type: object
          title: Config
        command_limits:
          additionalProperties:
            $ref: '#/components/schemas/Limit'
          type: object
          title: Command Limits
        backend:
          $ref: '#/components/schemas/MountBackend'
          default: workspace
        mountpoint:
          anyOf:
            - type: string
            - type: 'null'
          title: Mountpoint
        read:
          anyOf:
            - $ref: '#/components/schemas/ReadPolicy'
            - type: 'null'
        ttl:
          anyOf:
            - type: integer
            - type: 'null'
          title: Ttl
        write:
          anyOf:
            - $ref: '#/components/schemas/WritePolicy'
            - type: 'null'
        index:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamIndexBlock'
                - $ref: '#/components/schemas/RedisIndexBlock'
              discriminator:
                propertyName: type
                mapping:
                  ram: '#/components/schemas/RamIndexBlock'
                  redis: '#/components/schemas/RedisIndexBlock'
            - type: 'null'
          title: Index
      additionalProperties: false
      type: object
      required:
        - vfs
      title: MountBlock
    MountCommandsBlock:
      properties:
        ask:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Ask
          default: []
        deny:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Deny
          default: []
      additionalProperties: false
      type: object
      title: MountCommandsBlock
      description: Approval and deny rules for commands working within this mount. Use session-level command
        rules for an allow list.
    MountMode:
      type: string
      enum:
        - read
        - write
        - exec
      title: MountMode
      description: |-
        Mount access level. `read` allows listing and reading. `write` also allows creating, modifying, and deleting files. `exec` additionally allows interpreter commands such as `python3` and `js`.

        Interpreter script files must be on an `exec` mount. Inline code and module execution require at least one `exec` mount; imports are not checked by path. Shell scripts follow the permissions of each command they run.
    MountSummary:
      properties:
        prefix:
          type: string
          title: Prefix
        vfs:
          type: string
          title: Vfs
        mode:
          type: string
          title: Mode
        description:
          type: string
          title: Description
          default: ''
        backend:
          $ref: '#/components/schemas/MountBackend'
          default: workspace
        mountpoint:
          anyOf:
            - type: string
            - type: 'null'
          title: Mountpoint
          description: Where the server exposes this mount on its own host, the generated
            path when the config named none; null for a workspace mount, and while the
            workspace is stopped.
      type: object
      required:
        - prefix
        - vfs
        - mode
      title: MountSummary
    OnExceed:
      type: string
      enum:
        - error
        - truncate
      title: OnExceed
    PathsBlock:
      properties:
        hide:
          items:
            type: string
          type: array
          title: Hide
          default: []
        show:
          items:
            $ref: '#/components/schemas/ShowEntry'
          type: array
          title: Show
          default: []
        reasons:
          items:
            $ref: '#/components/schemas/HideReason'
          type: array
          title: Reasons
          default: []
      additionalProperties: false
      type: object
      title: PathsBlock
      description: Control which paths a session can access. `hide` makes matching paths appear not to
        exist. `show` exposes more specific paths inside hidden regions, optionally with reduced permissions.
        Exact paths include their descendants; patterns support `*`, `?`, and character classes.
    ProcessPermissions:
      properties:
        list:
          type: string
          enum:
            - session
            - workspace
          title: List
          default: session
        kill:
          type: string
          enum:
            - session
            - workspace
          title: Kill
          default: session
        max:
          anyOf:
            - type: integer
              minimum: 1.0
            - type: 'null'
          title: Max
          default: 128
      additionalProperties: false
      type: object
      title: ProcessPermissions
      description: Control which processes a session can list or stop, and the maximum number it can run.
        Sessions always have access to their own processes. The stop scope cannot exceed the list scope.
        Profile settings override workspace defaults.
    ProfileMount:
      properties:
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
        commands:
          anyOf:
            - $ref: '#/components/schemas/MountCommandsBlock'
            - type: 'null'
        paths:
          anyOf:
            - $ref: '#/components/schemas/PathsBlock'
            - type: 'null'
      additionalProperties: false
      type: object
      title: ProfileMount
      description: Optional permissions for a specific mount. A profile can reduce mount permissions but
        cannot increase them. Omitted mounts retain their configured permissions. Use path hiding to prevent
        access to a mount.
    ProfilePolicy:
      properties:
        script:
          anyOf:
            - $ref: '#/components/schemas/ScriptSource'
            - type: string
          title: Script
        runtime:
          anyOf:
            - type: string
            - additionalProperties: true
              type: object
          title: Runtime
          default: monty
        env:
          additionalProperties:
            anyOf:
              - type: string
              - $ref: '#/components/schemas/SecretRef'
          type: object
          title: Env
          default: {}
      additionalProperties: false
      type: object
      required:
        - script
      title: ProfilePolicy
      description: Custom policy programs, grouped by the method they handle. Provide a script, its runtime,
        and optional environment variables. If no runtime is specified, Monty is used and must be installed.
        Policy programs use their configured environment and can read session variables through `ctx["env"]`.
    ProtectedResource:
      properties:
        resource:
          type: string
          title: Resource
        authorization_servers:
          items:
            type: string
          type: array
          title: Authorization Servers
        bearer_methods_supported:
          items:
            type: string
          type: array
          title: Bearer Methods Supported
        client_id:
          type: string
          title: Client Id
      type: object
      required:
        - resource
        - authorization_servers
        - bearer_methods_supported
        - client_id
      title: ProtectedResource
    RamCacheBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
        limit:
          anyOf:
            - type: string
            - type: integer
          title: Limit
          default: 32MB
        max_drain_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Max Drain Bytes
      additionalProperties: false
      type: object
      title: RamCacheBlock
    RamIndexBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
        ttl:
          type: number
          title: Ttl
          default: 600
      additionalProperties: false
      type: object
      title: RamIndexBlock
    RamStoreBlock:
      properties:
        type:
          type: string
          const: ram
          title: Type
          default: ram
      additionalProperties: false
      type: object
      title: RamStoreBlock
    ReadPolicy:
      type: string
      enum:
        - fresh
        - bounded
        - pinned
      title: ReadPolicy
      description: Cache validation policy. `fresh` checks the backend before returning cached content.
        `bounded` allows cached content within the configured freshness limit. `pinned` is reserved and
        currently rejected.
    RedisCacheBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        limit:
          anyOf:
            - type: string
            - type: integer
          title: Limit
          default: 512MB
        max_drain_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Max Drain Bytes
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisCacheBlock
    RedisIndexBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        ttl:
          type: number
          title: Ttl
          default: 600
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisIndexBlock
    RedisStoreBlock:
      properties:
        type:
          type: string
          const: redis
          title: Type
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          type: string
          title: Key Prefix
          default: 'mirage:'
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisStoreBlock
    S3StoreBlock:
      properties:
        timeout:
          type: number
          exclusiveMinimum: 0.0
          title: Timeout
          default: 30
        region:
          anyOf:
            - type: string
            - type: 'null'
          title: Region
        aws_access_key_id:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Access Key Id
        aws_secret_access_key:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Secret Access Key
        aws_session_token:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Session Token
        aws_profile:
          anyOf:
            - type: string
            - type: 'null'
          title: Aws Profile
        bucket:
          type: string
          title: Bucket
        endpoint_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Endpoint Url
        path_style:
          type: boolean
          title: Path Style
          default: false
        proxy:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Proxy
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
          default: mirage/
        default_content_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Default Content Type
        type:
          type: string
          const: s3
          title: Type
      additionalProperties: false
      type: object
      required:
        - bucket
        - type
      title: S3StoreBlock
      description: S3 storage settings. Uses the same configuration fields as the S3 backend.
    ScriptSource:
      properties:
        source:
          type: string
          title: Source
        language:
          type: string
          enum:
            - python
            - js
          title: Language
          default: python
        module:
          type: boolean
          title: Module
          default: false
      additionalProperties: false
      type: object
      required:
        - source
      title: ScriptSource
      description: Embedded program source with a language and optional JavaScript module mode. Configuration
        files can reference `.py`, `.js`, or `.mjs` files; the loader embeds their contents. `.mjs` files
        use module mode for imports and top-level `await`.
    SecretRef:
      properties:
        from:
          type: string
          title: From
        ref:
          type: string
          title: Ref
          default: ''
        key:
          type: string
          title: Key
      additionalProperties: false
      type: object
      required:
        - from
        - key
      title: SecretRef
      description: Read a configuration value from a secret source using `from`, `ref`, and `key`. The
        available sources depend on where this reference is used. Secret-source configuration allows only
        bootstrap sources such as environment variables or dotenv files.
    SecretSource:
      properties:
        source:
          type: string
          title: Source
        config:
          additionalProperties: true
          type: object
          title: Config
      additionalProperties: false
      type: object
      required:
        - source
      title: SecretSource
      description: A named secret source and its configuration. Managed environment variables refer to
        this source by name. Configuration fields can contain literal values or bootstrap secret references.
    SessionProfile:
      properties:
        cwd:
          anyOf:
            - type: string
            - type: 'null'
          title: Cwd
        env:
          anyOf:
            - additionalProperties:
                anyOf:
                  - type: string
                  - $ref: '#/components/schemas/EnvVar'
              type: object
            - type: 'null'
          title: Env
        mounts:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/ProfileMount'
              type: object
            - type: 'null'
          title: Mounts
        paths:
          anyOf:
            - $ref: '#/components/schemas/PathsBlock'
            - type: 'null'
        vars:
          anyOf:
            - $ref: '#/components/schemas/VarsBlock'
            - type: 'null'
        commands:
          anyOf:
            - $ref: '#/components/schemas/CommandsBlock'
            - type: 'null'
        policy:
          anyOf:
            - additionalProperties:
                items:
                  $ref: '#/components/schemas/ProfilePolicy'
                type: array
              propertyNames:
                enum:
                  - pre_execute
                  - pre_command
                  - pre_vfs
                  - pre_network
                  - post_execute
                  - post_command
                  - post_vfs
                  - post_network
              type: object
            - type: 'null'
          title: Policy
        command_limits:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/Limit'
              type: object
            - type: 'null'
          title: Command Limits
        processes:
          anyOf:
            - $ref: '#/components/schemas/ProcessPermissions'
            - type: 'null'
        network:
          anyOf:
            - type: boolean
            - additionalProperties:
                anyOf:
                  - items:
                      type: string
                    type: array
                  - additionalProperties:
                      type: string
                    type: object
              type: object
            - type: 'null'
          title: Network
      additionalProperties: false
      type: object
      title: SessionProfile
      description: |-
        Permissions and initial settings for a session. Unspecified settings add no restrictions beyond the workspace configuration.

        Use `commands`, `paths`, and `mounts` to control access, and `policy` for custom rules. For command rules without paths, deny takes precedence over approval requests and allow rules. More specific path rules take precedence over broader rules. See [permissions profiles](/home/policy/overview) for rule examples.
    SessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        cwd:
          type: string
          title: Cwd
      type: object
      required:
        - session_id
        - cwd
      title: SessionResponse
    SessionSummary:
      properties:
        session_id:
          type: string
          title: Session Id
        cwd:
          type: string
          title: Cwd
      type: object
      required:
        - session_id
        - cwd
      title: SessionSummary
    ShowEntry:
      properties:
        path:
          type: string
          title: Path
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
      additionalProperties: false
      type: object
      required:
        - path
      title: ShowEntry
      description: An absolute path or anchored path pattern to expose within a hidden region. Optional
        `mode` reduces permissions for that path. If omitted, mount permissions apply.
    ShutdownResponse:
      properties:
        status:
          type: string
          title: Status
        pid:
          type: integer
          title: Pid
      type: object
      required:
        - status
        - pid
      title: ShutdownResponse
    SnapshotWorkspaceRequest:
      properties:
        key:
          type: string
          title: Key
      additionalProperties: false
      type: object
      required:
        - key
      title: SnapshotWorkspaceRequest
    SnapshotWorkspaceResponse:
      properties:
        id:
          type: string
          title: Id
        key:
          type: string
          title: Key
        size:
          type: integer
          title: Size
      type: object
      required:
        - id
        - key
        - size
      title: SnapshotWorkspaceResponse
    StoreBlock:
      properties:
        type:
          type: string
          enum:
            - ram
            - disk
            - redis
          title: Type
          default: ram
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          type: string
          title: Key Prefix
          default: 'mirage:'
        root:
          type: string
          title: Root
          default: ~/.mirage/state
        namespace:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Namespace
        observer:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Observer
        workspace:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Workspace
        execution:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Execution
      additionalProperties: false
      type: object
      title: StoreBlock
      description: |-
        Storage settings for workspace metadata, sessions, filesystem records, logs, and execution records. Top-level settings select the default backend; per-group settings override it.

        S3 is supported only for the `workspace` group. Disk storage uses `root` and keeps jobs in memory. The `execution` group supports RAM or Redis.
    TemplateResponse:
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
        - name
        - description
        - config
      title: TemplateResponse
    ToolResponse:
      properties:
        text:
          type: string
          title: Text
        is_error:
          type: boolean
          title: Is Error
      type: object
      required:
        - text
        - is_error
      title: ToolResponse
    UpdateSessionRequest:
      properties:
        profile:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/SessionProfile'
            - type: 'null'
          title: Profile
      additionalProperties: false
      type: object
      required:
        - profile
      title: UpdateSessionRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    VarsBlock:
      properties:
        hide:
          items:
            type: string
          type: array
          title: Hide
          default: []
      additionalProperties: false
      type: object
      title: VarsBlock
      description: Environment variable names or glob patterns to hide from the session. Hidden variables
        appear unset.
    WorkspaceBrief:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
            - running
            - stopped
          title: Status
          description: running while the server holds the workspace in memory; stopped while
            it keeps only its config and state, until a start.
        created_at:
          type: number
          title: Created At
          description: >-
            Creation time as Unix seconds. For example, 1794009600 is
            2026-11-07T00:00:00Z. Fractional values include sub-second precision.
          example: 1794009600
      type: object
      required:
        - id
        - status
        - created_at
      title: WorkspaceBrief
    WorkspaceConfig:
      properties:
        mounts:
          additionalProperties:
            $ref: '#/components/schemas/MountBlock'
          type: object
          title: Mounts
        io:
          $ref: '#/components/schemas/IOConfig'
        command_limits:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/Limit'
              type: object
            - type: 'null'
          title: Command Limits
        max_memory:
          anyOf:
            - type: string
            - type: integer
            - type: 'null'
          title: Max Memory
        max_body_bytes:
          anyOf:
            - type: string
            - type: integer
            - type: 'null'
          title: Max Body Bytes
        max_env:
          anyOf:
            - type: string
            - type: integer
            - type: 'null'
          title: Max Env
        network:
          anyOf:
            - type: boolean
            - additionalProperties:
                anyOf:
                  - items:
                      type: string
                    type: array
                  - additionalProperties:
                      type: string
                    type: object
              type: object
          title: Network
          default: true
        system_time:
          anyOf:
            - type: string
            - type: 'null'
          title: System Time
        clis:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/CLIBlock'
              type: object
            - type: 'null'
          title: Clis
        machines:
          anyOf:
            - additionalProperties:
                additionalProperties: true
                type: object
              type: object
            - type: 'null'
          title: Machines
          description: The machines the workspace runs programs on, by name, each a
            `provider` and its config.
        runtimes:
          anyOf:
            - items:
                anyOf:
                  - type: string
                  - additionalProperties: true
                    type: object
              type: array
            - type: 'null'
          title: Runtimes
        route_policy:
          anyOf:
            - $ref: '#/components/schemas/ProfilePolicy'
            - type: 'null'
        profiles:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/SessionProfile'
              type: object
            - type: 'null'
          title: Profiles
        profile:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile
        processes:
          anyOf:
            - $ref: '#/components/schemas/ProcessPermissions'
            - type: 'null'
        mode:
          $ref: '#/components/schemas/MountMode'
          default: write
        read:
          anyOf:
            - $ref: '#/components/schemas/ReadPolicy'
            - type: 'null'
        write:
          anyOf:
            - $ref: '#/components/schemas/WritePolicy'
            - type: 'null'
        default_session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Default Session Id
        workspace_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Workspace Id
        cache:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamCacheBlock'
                - $ref: '#/components/schemas/RedisCacheBlock'
              discriminator:
                propertyName: type
                mapping:
                  ram: '#/components/schemas/RamCacheBlock'
                  redis: '#/components/schemas/RedisCacheBlock'
            - type: 'null'
          title: Cache
        index:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamIndexBlock'
                - $ref: '#/components/schemas/RedisIndexBlock'
              discriminator:
                propertyName: type
                mapping:
                  ram: '#/components/schemas/RamIndexBlock'
                  redis: '#/components/schemas/RedisIndexBlock'
            - type: 'null'
          title: Index
        store:
          anyOf:
            - $ref: '#/components/schemas/StoreBlock'
            - type: 'null'
        env:
          anyOf:
            - additionalProperties:
                anyOf:
                  - type: string
                  - $ref: '#/components/schemas/EnvVar'
              type: object
            - type: 'null'
          title: Env
        secrets:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/SecretSource'
              type: object
            - type: 'null'
          title: Secrets
      additionalProperties: false
      type: object
      required:
        - mounts
      title: WorkspaceConfig
    WorkspaceDetail:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
            - running
            - stopped
          title: Status
          description: running while the server holds the workspace in memory; stopped while
            it keeps only its config and state, until a start.
        created_at:
          type: number
          title: Created At
          description: >-
            Creation time as Unix seconds. For example, 1794009600 is
            2026-11-07T00:00:00Z. Fractional values include sub-second precision.
          example: 1794009600
        system_time:
          anyOf:
            - type: string
            - type: 'null'
          title: System Time
        sessions:
          items:
            $ref: '#/components/schemas/SessionSummary'
          type: array
          title: Sessions
        mounts:
          items:
            $ref: '#/components/schemas/MountSummary'
          type: array
          title: Mounts
        internals:
          anyOf:
            - $ref: '#/components/schemas/WorkspaceInternals'
            - type: 'null'
      type: object
      required:
        - id
        - status
        - created_at
      title: WorkspaceDetail
    WorkspaceInternals:
      properties:
        cache_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Cache Bytes
        cache_entries:
          anyOf:
            - type: integer
            - type: 'null'
          title: Cache Entries
        history_length:
          type: integer
          title: History Length
        in_flight_jobs:
          type: integer
          title: In Flight Jobs
      type: object
      required:
        - cache_bytes
        - cache_entries
        - history_length
        - in_flight_jobs
      title: WorkspaceInternals
    WritePolicy:
      type: string
      enum:
        - unconditional
        - conditional
        - staged
      title: WritePolicy
      description: Write conflict policy. `unconditional` replaces content without checking its version.
        `conditional` rejects writes when the backend version has changed since the last read. Creating
        a file previously observed as missing requires an atomic create in either mode. `staged` is reserved
        and currently rejected.
    Error:
      type: object
      properties:
        detail:
          description: What went wrong, as text or a structured record.
        errno:
          type: string
          description: The errno of a failed file call, such as ENOENT.
        refusal:
          type: object
          description: The policy refusal, when a policy refused the call.
      required:
        - detail
    Refusal:
      type: object
      description: Why a policy refused a command or part of it. A refusal can come after the
        command ran and does not undo what it did.
      properties:
        kind:
          type: string
          enum:
            - deny
            - pending
            - failed
          description: '`deny` when a policy refused it, `pending` when it waits for an approval,
            `failed` when a policy raised an error and so refused by default.'
        reason:
          type: string
          description: Reason given by the policy or the approval request.
        policy:
          type: string
          description: Name of the policy that refused. Empty for `pending`.
        ask_id:
          anyOf:
            - type: string
            - type: 'null'
          description: Approval request ID, for `pending`.
      required:
        - kind
        - reason
        - policy
        - ask_id
    ShellResult:
      type: object
      description: Returned by default, when the command has ended.
      properties:
        exit_code:
          type: integer
          description: Exit status of the command. `0` is success and `127` command not found.
            `126` usually means a policy refused the command before it ran, but a refusal can
            leave another code; check `refusal`.
        stdout:
          type: string
          description: Standard output, decoded as UTF-8. Empty in a stream's final record.
        stderr:
          type: string
          description: Standard error, decoded as UTF-8. Empty in a stream's final record.
        refusal:
          anyOf:
            - $ref: '#/components/schemas/Refusal'
            - type: 'null'
          description: Set when a policy refused the command or any part of it, otherwise
            `null`. Part of the command may have run, and the exit code need not be `126`.
        line_id:
          type: string
          description: Command execution ID. Use it with `GET /v1/workspaces/{workspace_id}/lines/{line_id}`.
      required:
        - exit_code
        - stdout
        - stderr
        - refusal
        - line_id
      title: Result
    ShellRequest:
      type: object
      properties:
        command:
          type: string
          description: Shell command or script to execute.
        cwd:
          type: string
          description: Working directory for this command only.
        runtime:
          type: string
          description: Name of an entry under `runtimes` in the workspace config. If omitted, the
            runtime is selected automatically.
        machine:
          type: string
          description: Name of an entry under `machines` in the workspace config. If omitted, the
            machine is selected automatically.
        record:
          type: boolean
          default: true
          description: Include this command in session history. Set `false` to keep it out.
        open_stdin:
          type: boolean
          default: false
          description: Keep stdin open for additional input. Requires `stream=true` and no stdin
            part; the first response record contains `line_id`.
      required:
        - command
      additionalProperties: false
    LoadRequest:
      type: object
      properties:
        key:
          type: string
          description: Archive key in the snapshot store. Omit when uploading an archive.
        id:
          type: string
          description: ID for the restored workspace.
        override:
          type: object
          description: Configuration overrides for the restored workspace, including credentials
            redacted from the snapshot.
    Explanation:
      type: object
      description: Policy evaluation for a request without executing it. Returned when `explain=true`.
      properties:
        type:
          type: string
          description: line, command or vfs.
        outcome:
          type: string
          enum:
            - allow
            - deny
            - ask
        reason:
          type: string
          description: Reason returned by the policy that determined the outcome.
        source:
          type: string
          description: Where in the profile the deciding rule is written.
        answers:
          type: array
          items:
            type: object
          description: Evaluation results from each policy.
        refusal:
          anyOf:
            - $ref: '#/components/schemas/Refusal'
            - type: 'null'
      required:
        - outcome
    ShellExplanation:
      allOf:
        - $ref: '#/components/schemas/Explanation'
        - type: object
          properties:
            line:
              type: string
            exit_code:
              type: integer
              description: What the line is refused with, 0 when it runs.
            stderr:
              type: string
            node:
              type: object
              description: Parsed command structure and policy evaluation for each command.
      title: Explanation (explain=true)
    VfsExplanation:
      allOf:
        - $ref: '#/components/schemas/Explanation'
        - type: object
          properties:
            call:
              type: string
            paths:
              type: array
              items:
                type: string
            error:
              type: string
              description: The errno name the call would raise, empty when it runs.
      title: VFS explanation
    SecretPointer:
      type: object
      properties:
        from:
          type: string
          description: The saved store holding the secret.
        ref:
          type: string
          description: The secret in that store.
        key:
          type: string
          description: The key inside that secret whose value the field takes.
      required:
        - from
        - ref
        - key
    FieldValue:
      description: A configuration value, or a reference to a secret in a saved store for string fields.
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items: {}
        - $ref: '#/components/schemas/SecretPointer'
    TypeField:
      type: object
      properties:
        name:
          type: string
          description: Field name to use in `fields`.
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - list
            - object
        secret:
          type: boolean
          description: Secret value. Accepted in writes and omitted from read responses.
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          description: The values the field takes, when it is a choice.
        description:
          type: string
        default:
          anyOf:
            - type: string
            - type: number
            - type: boolean
        group:
          type: string
          description: The section a form shows the field under.
      required:
        - name
        - type
        - secret
        - required
    TypeTable:
      type: object
      description: Supported configuration types and their fields, indexed by type name.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/TypeField'
    SavedEntry:
      type: object
      properties:
        id:
          type: string
          description: Configuration ID. On the OSS server, this equals the name.
        name:
          type: string
        kind:
          type: string
          enum:
            - vfs
            - cli
            - runtime
        type:
          type: string
          description: The VFS, CLI or runtime type, such as s3.
        builtin:
          type: boolean
        config:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldValue'
          description: Non-secret configuration values. Secret values are omitted.
        captures:
          type: array
          items: {}
          description: Runtime capture settings, when applicable.
        created_by:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
        updated_at:
          type:
            - string
            - 'null'
        used_by:
          type: integer
          description: Number of templates using this configuration. Included in list responses only.
      required:
        - id
        - name
        - kind
        - type
        - builtin
        - config
    SavedEntryDetail:
      allOf:
        - $ref: '#/components/schemas/SavedEntry'
        - type: object
          properties:
            sealed:
              type: array
              items:
                type: string
              description: Names of stored secret fields. Secret values are omitted.
          required:
            - sealed
    SavedEntryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedEntry'
      required:
        - items
    CreateSavedEntryRequest:
      type: object
      properties:
        name:
          type: string
          description: 1 to 63 of a-z 0-9 . _ -, starting with a letter or digit. Not `types`,
            and not shaped like an id.
        type:
          type: string
          description: A supported type from the matching types endpoint, such as `GET /v1/vfs/types`.
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldValue'
          description: Settings for the selected type. Secret values are stored securely; string fields
            can reference a saved secret store.
      required:
        - name
        - type
        - fields
    UpdateSavedEntryRequest:
      type: object
      properties:
        fields:
          type: object
          additionalProperties:
            anyOf:
              - $ref: '#/components/schemas/FieldValue'
              - type: 'null'
          description: Configuration fields to update. Omitted secret fields retain their values; null
            removes a field.
      required:
        - fields
    CreatePolicyRequest:
      additionalProperties: false
      properties:
        name:
          type: string
          description: Ends in .py, such as guard.py.
        source:
          type: string
          description: Python policy source code, up to 64 KiB.
      required:
        - name
        - source
      type: object
    UpdatePolicyRequest:
      additionalProperties: false
      properties:
        source:
          type: string
          description: The new program, up to 64 KiB.
      required:
        - source
      type: object
    PolicyResponse:
      properties:
        name:
          type: string
        source:
          type: string
      required:
        - name
        - source
      type: object
    PolicyName:
      properties:
        name:
          type: string
      required:
        - name
      type: object
    PolicyList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PolicyName'
          type: array
      required:
        - items
      type: object
    TemplateList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TemplateResponse'
          type: array
      required:
        - items
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The server's token (MIRAGE_AUTH_TOKEN) or a JWT. A daemon in the default
        local mode with no token accepts requests without one.
  responses:
    '413':
      description: The request body, multipart part, or stdin exceeds its size limit.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/Error'
              - title: TypeScript JSON body limit
                type: object
                properties:
                  statusCode:
                    type: integer
                    const: 413
                  code:
                    type: string
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - statusCode
                  - code
                  - error
                  - message
          examples:
            request_part:
              summary: Python or multipart request limit
              value:
                detail: request body too large
            typescript_json:
              summary: TypeScript JSON body limit
              value:
                statusCode: 413
                code: FST_ERR_CTP_BODY_TOO_LARGE
                error: Payload Too Large
                message: Request body is too large
    '499':
      description: The running shell job was canceled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: job canceled
    '500':
      description: The job or server operation failed internally. Inspect detail and server logs
        before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '507':
      description: The filesystem operation exceeds its storage capacity or quota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '400':
      description: 'Bad request: malformed, a host not allowed, or a browser page from another
        origin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
            description: The daemon refuses a host not allowed, or a browser page from another
              origin, in plain text.
    '401':
      description: The token is missing or wrong
      content:
        application/json:
          example:
            detail: Unauthorized
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          example: Unauthorized
          schema:
            type: string
            description: The Python daemon answers Unauthorized as plain text.
    '403':
      description: A policy or mount mode refused the call
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: The workspace, session, job or file does not exist
      content:
        application/json:
          example:
            detail: workspace not found
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: The id or name is taken, the workspace is busy, or a file changed since
        it was read
      content:
        application/json:
          example:
            detail: "workspace id already exists: 'demo'"
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: Past a rate limit, or a new session past max_sessions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
    '501':
      description: The server requires accounts; saved configs are kept only on a server of
        one account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: The server is at max_workspaces, or shutting down
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VfsDocument:
      description: Generated VFS.md document.
      content:
        text/markdown:
          schema:
            type: string
          example: |+
            ---
            name: workspace-filesystem
            description: The virtual filesystem layout of this workspace.
            ---

            # Virtual Filesystem

            You work in a terminal over a virtual filesystem. Read files with shell commands; access is checked for each operation.

            | Path | Description |
            | --- | --- |
            | `/` | `ram`, write |
            | `/dev` | `ram`, write |

            ## Supported Unix Commands for VFS

            Unix commands work on each path as on a local filesystem, as far as the path supports them:

            | Path | Supported |
            | --- | --- |
            | `/` | Almost all Unix commands. |
            | `/dev` | Almost all Unix commands. |

            ## Limitations of Unix Commands for VFS

            Where a path differs from a local filesystem:

            | Path | Limitations |
            | --- | --- |
            | `/` | `grep -r`, `find` and `du` stop after 10000 files; a glob matching more, `tar -c`, `cp -r` and `rm -r` are refused. |
            | `/dev` | `grep -r`, `find` and `du` stop after 10000 files; a glob matching more, `tar -c`, `cp -r` and `rm -r` are refused. |

            Run `man <cmd>` or `<cmd> --help` for one command's usage.
    SkillDocument:
      description: Generated SKILL.md document.
      content:
        text/markdown:
          schema:
            type: string
          example: |+
            ---
            name: workspace-commands
            description: The CLIs registered in this workspace and how to call them.
            ---

            # Available commands

            No CLIs are registered.
  parameters:
    workspaceId:
      name: workspace_id
      in: path
      required: true
      description: Workspace ID.
      schema:
        type: string
      example: demo
    sessionId:
      name: session_id
      in: query
      required: false
      description: Session ID to use. If omitted, the default session is used.
      schema:
        type: string
      example: analysis
