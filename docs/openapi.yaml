          type: string
          title: Key Prefix
          default: 'mirage:'
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisStoreBlock
    S3StoreBlock:
      properties:
        timeout:
          type: number
          exclusiveMinimum: 0.0
          title: Timeout
          default: 30
        region:
          anyOf:
            - type: string
            - type: 'null'
          title: Region
        aws_access_key_id:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Access Key Id
        aws_secret_access_key:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Secret Access Key
        aws_session_token:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Aws Session Token
        aws_profile:
          anyOf:
            - type: string
            - type: 'null'
          title: Aws Profile
        bucket:
          type: string
          title: Bucket
        endpoint_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Endpoint Url
        path_style:
          type: boolean
          title: Path Style
          default: false
        proxy:
          anyOf:
            - type: string
              format: password
              writeOnly: true
            - type: 'null'
          title: Proxy
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
          default: mirage/
        default_content_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Default Content Type
        type:
          type: string
          const: s3
          title: Type
      additionalProperties: false
      type: object
      required:
        - bucket
        - type
      title: S3StoreBlock
      description: 'An ``S3Config`` plus the union discriminator: the block IS the

        backend config, so new S3Config fields flow into the store block

        without re-declaring them here.'
    ScriptSource:
      properties:
        source:
          type: string
          title: Source
        language:
          type: string
          enum:
            - python
            - js
          title: Language
          default: python
        module:
          type: boolean
          title: Module
          default: false
      additionalProperties: false
      type: object
      required:
        - source
      title: ScriptSource
      description: "A program's source: a policy program or a script CLI.\n\nA yaml ``script:``\
        \ value references a ``.py`` or ``.js``/``.mjs``\nfile whose content is embedded here\
        \ at load; code passes the text.\nIt runs as a program on the runtime its config names,\
        \ never edited.\n\nArgs:\n    source (str): the script program.\n    language (Language):\
        \ the script's language (\"python\" or \"js\"),\n        stamped from the file extension\
        \ at config load; the\n        programmatic default is \"python\".\n    module (bool):\
        \ the source is an ES module (a ``.mjs`` file), so\n        a js engine must run it\
        \ in module mode or ``import`` and\n        top-level ``await`` fail. Stamped from\
        \ the extension at\n        load beside ``language``, since the path is gone once\
        \ the\n        source is embedded."
    SecretRef:
      properties:
        from:
          type: string
          title: From
        ref:
          type: string
          title: Ref
          default: ''
        key:
          type: string
          title: Key
      additionalProperties: false
      type: object
      required:
        - from
        - key
      title: SecretRef
      description: "A configured value read from a source instead of written down.\n\nThe\
        \ plane's one declarative pointer, spelled with the same three\nkeys the env plane's\
        \ managed entry uses, so one grammar covers\nevery place a deployment points at a\
        \ secret: a source's own config,\na mount's credential, a CLI's.\n\nWhere it may point\
        \ is the *context's* rule, not this model's.\n`SecretSource` narrows its own config\
        \ to `BOOTSTRAP_SOURCES`,\nbecause that is what stops the source table from needing\
        \ a\ndependency graph; a mount has no such limit, since every source is\nalready built\
        \ by the time one is read.\n\nArgs:\n    provider (str): the bootstrap source, `env`\
        \ or `dotenv`.\n        Spelled `from:` in YAML (python keyword), via alias.\n   \
        \ ref (str): the source's address, a file path for `dotenv`.\n    key (str): which\
        \ of the secret's fields holds the value."
    SecretSource:
      properties:
        source:
          type: string
          title: Source
        config:
          additionalProperties: true
          type: object
          title: Config
      additionalProperties: false
      type: object
      required:
        - source
      title: SecretSource
      description: "One declared source instance: which source, and its config.\n\nThe `secrets:`\
        \ block is one map, name -> source, spelled the way\n`mounts:` and `clis:` are: a\
        \ type beside a config. The\ninstance name is what a managed env entry's `from:` names,\
        \ so two\naccounts of one platform are two instances, and an instance named\nafter\
        \ its source reads as that source configured.\n\nThe config map is untyped here, the\
        \ way `mounts.*.config` is: each\nsource owns its own model, and this block only has\
        \ to tell a\npointer from a literal. It does that the way the env plane does,\nby\
        \ the presence of `from`, so a mapping carrying one is validated\nas a `SecretRef`\
        \ and every other value passes through to the\nsource's model.\n\nArgs:\n    source\
        \ (str): the registered source this instance speaks to.\n    config (dict[str, Any]):\
        \ the source's own config fields; a\n        value may be a literal or a `SecretRef`."
    SessionProfile:
      properties:
        cwd:
          anyOf:
            - type: string
            - type: 'null'
          title: Cwd
        env:
          anyOf:
            - additionalProperties:
                anyOf:
                  - type: string
                  - $ref: '#/components/schemas/EnvVar'
              type: object
            - type: 'null'
          title: Env
        mounts:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/ProfileMount'
              type: object
            - type: 'null'
          title: Mounts
        paths:
          anyOf:
            - $ref: '#/components/schemas/PathsBlock'
            - type: 'null'
        vars:
          anyOf:
            - $ref: '#/components/schemas/VarsBlock'
            - type: 'null'
        commands:
          anyOf:
            - $ref: '#/components/schemas/CommandsBlock'
            - type: 'null'
        policy:
          anyOf:
            - additionalProperties:
                items:
                  $ref: '#/components/schemas/ProfilePolicy'
                type: array
              propertyNames:
                enum:
                  - pre_execute
                  - pre_command
                  - pre_vfs
                  - pre_session
                  - pre_network
                  - post_execute
                  - post_command
                  - post_vfs
                  - post_session
                  - post_network
              type: object
            - type: 'null'
          title: Policy
        command_limits:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/Limit'
              type: object
            - type: 'null'
          title: Command Limits
        processes:
          anyOf:
            - $ref: '#/components/schemas/ProcessPermissions'
            - type: 'null'
        network:
          anyOf:
            - type: boolean
            - additionalProperties:
                anyOf:
                  - items:
                      type: string
                    type: array
                  - additionalProperties:
                      type: string
                    type: object
              type: object
            - type: 'null'
          title: Network
      additionalProperties: false
      type: object
      title: SessionProfile
      description: "One profile: the whole permission document a session runs under.\n\nA\
        \ session is created from exactly one of these, and it is the only\nplace permissions\
        \ are written. There is no workspace-wide block and\nno mount-owned block above it,\
        \ so reading this object is reading\neverything the profile may do; what a profile\
        \ does not say, it does not\nrestrict. Configuration, not enforcement: the resolver\
        \ compiles it\nonto the session's narrowing fields and the entry points keep enforcing.\n\
        Deliberately not named a View, which per the view convention is a\nhandle an agent\
        \ holds on one entry point, while a profile is what the\nembedder uses to *define*\
        \ one. Frozen so two agents with the same\nprofile share one object and neither can\
        \ bend the other's view.\n\nTwo rules decide a line against it, and they are the whole\
        \ law.\nA rule naming no path is read by verb (deny before ask before\nallow), wherever\
        \ it is written. A rule carrying paths, and every\nhide, is read by anchor depth:\
        \ the deeper entry wins, ties break by\nverb.\n\nA profile may also state a ``policy``:\
        \ for each ``pre_`` method it\nanswers at (``pre_execute``, ``pre_command``, ``pre_vfs``,\n\
        ``pre_session``), a list of programs, each with the runtime it runs\non (``ProfilePolicy``,\
        \ the shape a ``clis`` entry has). A program's\nfunction for the method takes its\
        \ context and returns its answer:\nNone for no opinion, a deny, an ask, or at ``pre_execute``\
        \ a route.\nThey are asked in order and the first deny wins, so a policy expresses\n\
        the conditions a declarative rule cannot; like every policy, it can\nonly restrict,\
        \ never grant past a deny. The document is optional\nbeside it: a profile stating\
        \ only a policy hides nothing, and the\npolicy is its whole admission policy.\n\n\
        Args:\n    cwd (str | None): the session's working directory at creation.\n    env\
        \ (dict[str, str | EnvVar] | None): the env entries seeded\n        into the session\
        \ at creation, in the workspace ``env``\n        grammar: a bare string is an exported\
        \ literal, and a\n        ``from:`` entry a managed pointer, so a credential is\n\
        \        named here and fetched, never written as its value.\n    mounts (dict[str,\
        \ ProfileMount] | None): per-mount settings,\n        keyed by prefix: a mode, ask\
        \ and deny rules for lines\n        working inside the mount, and hides under it.\
        \ A mount the\n        mapping omits keeps its own mode and gains no rules.\n    paths\
        \ (PathsBlock | None): the profile's hides, absolute.\n    vars (VarsBlock | None):\
        \ the profile's hidden variables.\n    commands (CommandsBlock | None): the profile's\
        \ allow list and its\n        ask / deny rules, absolute paths.\n    policy (dict[ScriptMethod,\
        \ list[ProfilePolicy]] | None): the\n        profile's policy: each ``pre_`` method's\
        \ programs, asked in\n        order.\n    network (bool | dict[str, list[str]] | None):\
        \ where the\n        session's lines may connect, the workspace's ``network``\n  \
        \      grammar, held besides the workspace's own; None leaves the\n        workspace's\
        \ alone."
    SessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        cwd:
          type: string
          title: Cwd
      type: object
      required:
        - session_id
        - cwd
      title: SessionResponse
    SessionSummary:
      properties:
        session_id:
          type: string
          title: Session Id
        cwd:
          type: string
          title: Cwd
      type: object
      required:
        - session_id
        - cwd
      title: SessionSummary
    ShowEntry:
      properties:
        path:
          type: string
          title: Path
        mode:
          anyOf:
            - $ref: '#/components/schemas/MountMode'
            - type: 'null'
      additionalProperties: false
      type: object
      required:
        - path
      title: ShowEntry
      description: "One ``show`` entry of a profile's path axis, compiled.\n\nArgs:\n    path\
        \ (str): the entry as written: an exact subtree or an\n        anchored pattern, always\
        \ absolute. A slashless name pattern\n        is refused at validation, because a\
        \ show anchors to a place\n        and a name pattern names none.\n    mode (MountMode\
        \ | None): the mode the entry states for its\n        subtree; None for a list-form\
        \ entry, which inherits the\n        mount's."
    ShutdownResponse:
      properties:
        status:
          type: string
          title: Status
        pid:
          type: integer
          title: Pid
      type: object
      required:
        - status
        - pid
      title: ShutdownResponse
    SnapshotWorkspaceRequest:
      properties:
        key:
          type: string
          title: Key
      additionalProperties: false
      type: object
      required:
        - key
      title: SnapshotWorkspaceRequest
    SnapshotWorkspaceResponse:
      properties:
        id:
          type: string
          title: Id
        key:
          type: string
          title: Key
        size:
          type: integer
          title: Size
      type: object
      required:
        - id
        - key
        - size
      title: SnapshotWorkspaceResponse
    StoreBlock:
      properties:
        type:
          type: string
          enum:
            - ram
            - disk
            - redis
          title: Type
          default: ram
        url:
          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          type: string
          title: Key Prefix
          default: 'mirage:'
        root:
          type: string
          title: Root
          default: ~/.mirage/state
        namespace:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Namespace
        observer:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Observer
        workspace:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Workspace
        execution:
          anyOf:
            - oneOf:
                - $ref: '#/components/schemas/RamStoreBlock'
                - $ref: '#/components/schemas/DiskStoreBlock'
                - $ref: '#/components/schemas/RedisStoreBlock'
                - $ref: '#/components/schemas/S3StoreBlock'
              discriminator:
                propertyName: type
                mapping:
                  disk: '#/components/schemas/DiskStoreBlock'
                  ram: '#/components/schemas/RamStoreBlock'
                  redis: '#/components/schemas/RedisStoreBlock'
                  s3: '#/components/schemas/S3StoreBlock'
            - type: 'null'
          title: Execution
      additionalProperties: false
      type: object
      title: StoreBlock
      description: 'The workspace state store: one block, five planes.


        The top-level type/url/key_prefix pick the default backend for

        every control-plane group (namespace nodes, observer events,

        sessions + workspace metadata, execution). The optional per-group

        overrides redirect one group to a different backend, e.g. large

        observer logs to a separate server. Sessions and workspace metadata

        move together by design (the default-session pointer must live

        beside the session table it points into), so there is one

        `workspace` override, not two. An ``s3`` group hosts only the

        sessions+meta group (conditional-PUT CAS), so it is valid as the

        ``workspace`` override, never as the top-level default. A ``disk``

        store hosts the other planes under ``root`` (lockfile CAS,

        machine-local) and keeps jobs in memory, since a job''s console is a

        stream other processes follow; ``root`` is only read when a disk

        store is selected. The ``execution`` group (job lists, consoles, the

        workspace''s lease, process records) is therefore ram or redis.'
    TemplateResponse:
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
        - name
        - description
        - config
      title: TemplateResponse
