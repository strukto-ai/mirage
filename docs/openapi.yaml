openapi: 3.2.0
info:
  title: Mirage API
  version: '0.1'
tags:
  - name: Workspace operations
    x-group: Workspaces
  - name: Workspaces
    x-group: Lifecycle
    parent: Workspace operations
  - name: Sessions
  - name: Shell
    parent: Workspace operations
  - name: VFS
    parent: Workspace operations
  - name: Tools
  - name: Documents
    x-group: Agent Instructions
    parent: Workspace operations
  - name: Snapshots
  - name: Templates
    parent: Configuration
  - name: Saved VFS
    x-group: VFS
    parent: Configuration
  - name: Saved CLIs
    x-group: CLI
    parent: Configuration
  - name: Saved runtimes
    x-group: Runtime
    parent: Configuration
  - name: Saved machines
    x-group: Machine
    parent: Configuration
  - name: Configuration
  - name: Policies
    parent: Configuration
  - name: Asks
    parent: Workspace operations
    x-group: Approval requests
  - name: Lines
    parent: Workspace operations
    x-group: Commands
  - name: Jobs
    parent: Workspace operations
  - name: Processes
    parent: Workspace operations
  - name: Machines
    parent: Workspace operations
  - name: Server
  - name: Service
    parent: Server
  - name: Daemon
    parent: Server
  - name: Auth
servers:
  - url: http://127.0.0.1:8765
    description: A local server on its default port
security:
  - bearerAuth: []
paths:
  /v1/workspaces:
    post:
      summary: Create workspace
      operationId: create_workspace_v1_workspaces_post
      parameters:
        - name: explain
          in: query
          description: Return what the call would do without running it.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
            example:
              id: demo
              config:
                mounts:
                  /:
                    vfs: ram
                    mode: write
      responses:
        '200':
          description: Existing workspace for an identical retry, or policy evaluation when
            `explain=true`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/WorkspaceDetail'
                  - type: object
                    title: Policy explanation
              example:
                id: demo
                status: running
                created_at: 1794009600
                system_time: null
                sessions:
                  - session_id: 01a1b425-ec80-7038-86e0-75b597344043
                    cwd: /
                mounts:
                  - prefix: /
                    vfs: ram
                    mode: write
                    description: ''
                    backend: workspace
                    mountpoint: null
                internals: null
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
              example:
                id: demo
                status: running
                created_at: 1794009600
                system_time: null
                sessions:
                  - session_id: 01a1b425-ec80-7038-86e0-75b597344043
                    cwd: /
                mounts:
                  - prefix: /
                    vfs: ram
                    mode: write
                    description: ''
                    backend: workspace
                    mountpoint: null
                internals: null
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
          description: The identifier already exists with a different workspace configuration.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      description: |-
        Create a workspace from a configuration or saved template.

        Returns `201` when created, `200` for an identical retry with the same ID, or `409` if that ID has a different configuration. Set `explain=true` to check policies without creating anything.
      tags:
        - Workspaces
      x-hosts:
        - daemon
    get:
      summary: List workspaces
      operationId: list_workspaces_v1_workspaces_get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceBrief'
                title: Response List Workspaces V1 Workspaces Get
              example:
                - id: demo
                  status: running
                  created_at: 1794009600
                - id: notes
                  status: stopped
                  created_at: 1793923200
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Workspaces
      x-hosts:
        - daemon
      description: Running workspaces first, then stopped ones, which keep only their config and state until a start.
  /v1/workspaces/{workspace_id}:
    get:
      summary: Get workspace
      operationId: get_workspace_v1_workspaces__workspace_id__get
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Workspaces
      x-hosts:
        - daemon
      description: Get workspace details, including mounts and sessions.
    delete:
      summary: Delete workspace
      operationId: delete_workspace_v1_workspaces__workspace_id__delete
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkspaceResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
        - Workspaces
      x-hosts:
        - daemon
      description: Stop the workspace and delete its saved state. Files in external storage are not deleted.
  /v1/workspaces/{workspace_id}/logs:
    get:
      summary: List workspace logs
      operationId: workspace_logs_v1_workspaces__workspace_id__logs_get
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: session
          in: query
          description: Filter by session ID. Omit or leave empty to include all sessions.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum commands per JSON page. Ignored for JSONL export.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: after
          in: query
          description: The `next` cursor from the previous JSON page. Reuse it on the same server with
            the same filters. Results can change between pages. Ignored for JSONL export.
          schema:
            type: string
        - name: format
          in: query
          description: Use `json` for paginated results, newest first, or `jsonl` to export all retained
            matches oldest first. JSONL ignores `limit` and `after` and contains `command`, `vfs`, and
            `result` records linked by `parent`. Each record has a `timestamp` in Unix milliseconds.
            Values other than `jsonl` select JSON.
          schema:
            type: string
            default: json
      responses:
        '200':
          description: 'Completed command logs. Empty JSON returns `{"items": [], "next": null}`; an empty
            JSONL export has no body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
              example:
                items:
                  - id: c1
                    command: echo hi
                    cwd: /
                    started_at: 1700000000000
                    duration_ms: 8
                    exit_code: 0
                    stdout: 'hi

                      '
                    stderr: ''
                    user_id: null
                    api_key_id: null
                    mounts: []
                next: null
            application/x-ndjson:
              schema:
                type: string
              example: '{"type":"command","session":"s1","timestamp":1700000000000,"id":"c1","command":"echo
                hi"}

                {"type":"result","session":"s1","timestamp":1700000000008,"parent":"c1","duration_ms":8,"exit_code":0,"stdout":"hi\n","stderr":""}

                '
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '403':
          $ref: '#/components/responses/403'
      description: |-
        List completed commands with captured output and related file operations, newest first.

        Use `limit` and `after` for pagination, or `format=jsonl` to export all matching commands. Log retention depends on the server.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/stop:
    post:
      summary: Stop workspace
      operationId: stop_workspace_v1_workspaces__workspace_id__stop_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkspaceResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: |-
        Stop the workspace while keeping its saved state and configuration. Calling this again on a stopped workspace has no effect.

        RAM-backed files do not survive a stop/start cycle. Save them to persistent storage first.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/start:
    post:
      summary: Start workspace
      operationId: start_workspace_v1_workspaces__workspace_id__start_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      description: |-
        Start the workspace using its saved configuration and retained state. The server checks policies and reloads credentials. If already running, return the existing workspace.

        RAM-backed files do not survive a stop/start cycle.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/cancel:
    post:
      summary: Cancel all commands
      operationId: cancel_workspace_lines_v1_workspaces__workspace_id__cancel_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelLinesResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: Cancel all running and queued commands across every session. The workspace and sessions
        remain open.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/kill:
    post:
      summary: Stop all background jobs
      operationId: kill_workspace_jobs_v1_workspaces__workspace_id__kill_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillJobsResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: Stop background jobs and runtime processes across every session. The workspace and
        sessions remain open.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/profiles/{name}:
    put:
      summary: Set profile
      operationId: set_profile_v1_workspaces__workspace_id__profiles__name__put
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionProfile'
            example:
              cwd: /
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                name: analyst
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Set Profile V1 Workspaces  Workspace Id  Profiles  Name  Put
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: Create or replace a named permissions profile in the running workspace. Existing sessions
        keep their current permissions until explicitly updated. This does not change the saved workspace
        configuration.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/clone:
    post:
      summary: Clone a workspace
      operationId: clone_workspace_v1_workspaces__workspace_id__clone_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneWorkspaceRequest'
            example:
              id: demo-copy
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      x-excluded: true
  /v1/workspaces/{workspace_id}/snapshot:
    get:
      summary: Download a snapshot
      operationId: download_snapshot_v1_workspaces__workspace_id__snapshot_get
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: The tar archive, with secrets redacted
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      x-excluded: true
    post:
      summary: Snapshot a workspace
      operationId: snapshot_workspace_v1_workspaces__workspace_id__snapshot_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotWorkspaceRequest'
            example:
              key: demo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotWorkspaceResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      x-excluded: true
  /v1/workspaces/load:
    post:
      summary: Load a snapshot
      operationId: load_workspace_v1_workspaces_load_post
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '413':
          $ref: '#/components/responses/413'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadRequest'
            example:
              key: demo
              id: restored
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: '#/components/schemas/LoadRequest'
                snapshot:
                  type: string
                  format: binary
                  description: The tar archive, up to 1 GiB.
              required:
                - snapshot
      x-excluded: true
  /v1/templates:
    get:
      summary: List templates
      operationId: list_templates_v1_templates_get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      description: List saved workspace templates by name.
      tags:
        - Templates
      x-hosts:
        - daemon
    post:
      summary: Create template
      operationId: create_template_v1_templates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            example:
              name: demo
              config:
                mounts:
                  /:
                    vfs: ram
                    mode: write
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          $ref: '#/components/responses/401'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      description: Save a reusable workspace configuration. The server validates it when saved and preserves
        environment placeholders as written. Returns `409` if the name already exists.
      tags:
        - Templates
      x-hosts:
        - daemon
  /v1/templates/{ref}:
    get:
      summary: Get template
      operationId: get_template_v1_templates__ref__get
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      tags:
        - Templates
      x-hosts:
        - daemon
      description: Get a saved workspace template.
    delete:
      summary: Delete template
      operationId: delete_template_v1_templates__ref__delete
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      description: Delete a saved template. Use the restore endpoint to recover it.
      tags:
        - Templates
      x-hosts:
        - daemon
  /v1/templates/{ref}/restore:
    post:
      summary: Restore template
      operationId: restore_template_v1_templates__ref__restore_post
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      tags:
        - Templates
      x-hosts:
        - daemon
      description: Restore a deleted template.
  /v1/workspaces/{workspace_id}/vfs-md:
    get:
      summary: Read VFS.md
      operationId: get_v1_workspaces__workspace_id__vfs_md_get
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/sessionId'
        - name: profile
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
      responses:
        '200':
          $ref: '#/components/responses/VfsDocument'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Documents
      x-hosts:
        - daemon
      description: Read VFS.md as Markdown for the selected session.
    put:
      summary: Write VFS.md
      operationId: put_v1_workspaces__workspace_id__vfs_md_put
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/sessionId'
        - name: profile
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPath'
            example:
              path: /VFS.md
      responses:
        '200':
          $ref: '#/components/responses/VfsDocument'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Documents
