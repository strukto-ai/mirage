        override:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Override
      additionalProperties: false
      type: object
      title: CloneWorkspaceRequest
    CommandRule:
      properties:
        reason:
          type: string
          title: Reason
        commands:
          items:
            type: string
          type: array
          title: Commands
          default: []
        paths:
          items:
            type: string
          type: array
          title: Paths
          default: []
        mount:
          type: string
          title: Mount
          default: ''
      additionalProperties: false
      type: object
      required:
        - reason
      title: CommandRule
      description: Require approval or deny commands matching the specified patterns. A pattern such as
        `git push` matches that command and its arguments. Optional paths restrict the rule to matching
        files or directories. Rules under a mount apply only within that mount.
    CommandsBlock:
      properties:
        allow:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
          title: Allow
        ask:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Ask
          default: []
        deny:
          items:
            $ref: '#/components/schemas/CommandRule'
          type: array
          title: Deny
          default: []
      additionalProperties: false
      type: object
      title: CommandsBlock
      description: Command access rules. `allow` restricts available commands to matching patterns. `ask`
        requires approval, and `deny` blocks matching commands with a reason. If `allow` is omitted, it
        adds no restriction.
    CreateSessionRequest:
      properties:
        session_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Session Id
        mounts:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: 'null'
          title: Mounts
        profile:
          anyOf:
            - type: string
            - type: 'null'
          title: Profile
      type: object
      title: CreateSessionRequest
    CreateTemplateRequest:
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: 'null'
          title: Description
        config:
          $ref: '#/components/schemas/WorkspaceConfig'
      additionalProperties: false
      type: object
      required:
        - name
        - config
      title: CreateTemplateRequest
    CreateWorkspaceRequest:
      properties:
        config:
          anyOf:
            - $ref: '#/components/schemas/WorkspaceConfig'
            - type: 'null'
          description: Workspace configuration. Supply config or template, never both.
        template:
          anyOf:
            - type: string
            - type: 'null'
          title: Template
          description: Name of a saved template. Supply template or config, never both.
        id:
          anyOf:
            - type: string
            - type: 'null'
          title: Id
          description: Workspace identifier. Use the same identifier to retry an identical configuration.
      additionalProperties: false
      type: object
      title: CreateWorkspaceRequest
      description: Workspace configuration or saved template to create from. Supply exactly one of `config`
        and `template`.
    DeleteSessionResponse:
      properties:
