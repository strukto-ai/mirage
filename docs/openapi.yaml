          description: The request is malformed. The body is not valid JSON, has an unknown or
            invalid field, or its multipart parts are missing or out of order. Or the options
            conflict, as `stream` with `explain`, `open_stdin` without `stream=true` or with a
            stdin part, or `explain` with a multipart body, `cwd`, `runtime`, `machine` or
            `open_stdin` set to `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: open_stdin takes stream=true and no stdin part
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: Another server owns command execution for this workspace. The error detail identifies
            that server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: A query parameter has an invalid value, such as `explain=maybe`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '413':
          $ref: '#/components/responses/413'
        '499':
          $ref: '#/components/responses/499'
        '500':
          $ref: '#/components/responses/500'
        '503':
          description: The server is shutting down and accepts no new commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Shell
      x-hosts:
        - daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShellRequest'
            example:
              command: echo hello
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: '#/components/schemas/ShellRequest'
                stdin:
                  type: string
                  format: binary
                  description: Up to 64 MiB, read as it arrives.
              required:
                - request
      description: |-
        Run a shell command or script in the workspace and return its exit code and output.

        One endpoint serves three modes:

        | Mode | Request | Response |
        | --- | --- | --- |
        | Run (default) | no query flags | One JSON result when the command ends. |
        | Stream | `stream=true` | NDJSON output records as they are produced, then a status record. |
        | Explain | `explain=true` | The policy decision. Nothing runs. |

        A `200` means the request was accepted, not that the command succeeded. Check `exit_code`. A policy refusal also returns `200`; check `refusal` to know whether a policy refused anything. See Refused commands below.

        The request stays open until the command ends, and closing it cancels the command. To leave work running, end the command with `&`; it returns at once and the work appears under [jobs](/api/operations/jobs/list-jobs). Every result carries a `line_id` for the [lines](/api/operations/lines/get-command) endpoints.

        To send input, use a `multipart/form-data` body with a `stdin` part, or set `open_stdin=true` with `stream=true` to write while the command runs. See [Streaming and stdin](/api/streaming).

        ## Stream output

        Set `stream=true` to receive output as it is produced. Each line is one JSON record: output records carry base64 `data`, and the last record carries `status` and the final `result`.

        ```bash
        curl --no-buffer --request POST \
          --url 'http://127.0.0.1:8765/v1/workspaces/{workspace_id}/shell?stream=true' \
          --header 'Authorization: Bearer <token>' \
          --header 'Content-Type: application/json' \
          --data '{"command":"echo hello"}'
        ```

        ```json
        {"stream":"stdout","data":"aGVsbG8K"}
        {"status":"done","result":{"exit_code":0,"stdout":"","stderr":"","refusal":null,"line_id":"line_019a5e2c-7b41-7c3e-9f20-4d8e1a6b5c37"},"error":null}
        ```

        ## Explain a command

        Set `explain=true` to get the policy decision without running the command. The response has one `node` per part of the line; the example below is trimmed to one command.

        ```bash
        curl --request POST \
          --url 'http://127.0.0.1:8765/v1/workspaces/{workspace_id}/shell?explain=true' \
          --header 'Authorization: Bearer <token>' \
          --header 'Content-Type: application/json' \
          --data '{"command":"echo hello"}'
        ```

        ```json
        {
          "line": "echo hello",
          "outcome": "allow",
          "reason": "",
          "refusal": null,
          "exit_code": 0,
          "node": {
            "type": "line",
            "text": "echo hello",
            "children": [
              {
                "type": "command",
                "text": "echo hello",
                "command": "echo",
                "outcome": "allow",
                "children": []
              }
            ]
          }
        }
        ```

        ## Refused commands

        A policy refusal returns `200`. `refusal` is set whenever a policy refused something on the line, and is `null` otherwise. The exit code alone does not tell you:

        - A command refused before it runs usually exits `126` with `<command>: Permission denied`.
        - A refusal about a path appears as that path's own error, such as exit `1`.
        - A policy that judges a command after it ran sets exit `126` but does not undo its effects, and output already sent stays sent. A policy that judges the whole line after it ran drops the line's output.
        - A pipeline exits with its last stage's status unless `pipefail` is set, so a refused earlier stage can leave the exit code at `0`.

        A refusal does not always mean nothing ran, so do not retry a refused command blindly.

        A command denied before it ran:

        ```json
        {
          "exit_code": 126,
          "stdout": "",
          "stderr": "rm: Permission denied\n",
          "refusal": {
            "kind": "deny",
            "reason": "rm is not allowed in this workspace",
            "policy": "PermissionsPolicy",
            "ask_id": null
          },
          "line_id": "line_019a5e2c-7b41-7c3e-9f20-4d8e1a6b5c38"
        }
        ```

        ## Keep stdin open

        With `stream=true` and `"open_stdin": true`, the first record carries the `line_id`, and you write input to that line while the command runs. See [Streaming and stdin](/api/streaming) for the full flow.
