openapi: 3.2.0
info:
  title: Mirage API
  version: '0.1'
tags:
  - name: Workspace operations
    x-group: Workspaces
  - name: Workspaces
    x-group: Lifecycle
    parent: Workspace operations
  - name: Sessions
  - name: Shell
    parent: Workspace operations
  - name: VFS
    parent: Workspace operations
  - name: Tools
  - name: Documents
    parent: Workspace operations
  - name: Snapshots
  - name: Templates
  - name: Saved VFS
    x-group: VFS
    parent: Saved configurations
  - name: Saved CLIs
    x-group: CLIs
    parent: Saved configurations
  - name: Saved runtimes
    x-group: Runtimes
    parent: Saved configurations
  - name: Saved configurations
  - name: Policies
  - name: Asks
    parent: Workspace operations
  - name: Lines
    parent: Workspace operations
  - name: Jobs
    parent: Workspace operations
  - name: Processes
    parent: Workspace operations
  - name: Service
  - name: Daemon
  - name: Auth
servers:
  - url: http://127.0.0.1:8765
    description: A local server on its default port
security:
  - bearerAuth: []
paths:
  /v1/workspaces:
    post:
      summary: Create a workspace
      operationId: create_workspace_v1_workspaces_post
      parameters:
        - name: explain
          in: query
          description: Return what the call would do without running it.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
            example:
              id: demo
              config:
                mounts:
                  /:
                    vfs: ram
                    mode: write
      responses:
        '200':
          description: An identical retry answers the existing workspace; with explain=true,
            what the server's policies say about the config
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/WorkspaceDetail'
                  - type: object
                    title: Policy explanation
              example:
                id: demo
                status: running
                mode: write
                created_at: 1794009600
                fuse_mountpoints: {}
                system_time: null
                sessions:
                  - session_id: 01a1b425-ec80-7038-86e0-75b597344043
                    cwd: /
                mounts:
                  - prefix: /
                    vfs: ram
                    mode: write
                    description: ''
                internals: null
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
              example:
                id: demo
                status: running
                mode: write
                created_at: 1794009600
                fuse_mountpoints: {}
                system_time: null
                sessions:
                  - session_id: 01a1b425-ec80-7038-86e0-75b597344043
                    cwd: /
                mounts:
                  - prefix: /
                    vfs: ram
                    mode: write
                    description: ''
                internals: null
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
          description: The identifier already exists with a different workspace configuration.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      description: 'Create a workspace from a configuration or a saved template.


        An identical configuration retried with the same id returns the existing workspace with 200.
        A conflicting id returns 409. Policies check the configuration before creation and return
        403 on refusal. Set explain=true to inspect those decisions without creating a workspace.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
    get:
      summary: List workspaces
      operationId: list_workspaces_v1_workspaces_get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceBrief'
                title: Response List Workspaces V1 Workspaces Get
              example:
                - id: demo
                  status: running
                  mode: write
                  mount_count: 1
                  session_count: 1
                  created_at: 1794009600
                - id: notes
                  status: stopped
                  mode: read
                  mount_count: 1
                  session_count: 0
                  created_at: 1793923200
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}:
    get:
      summary: Get a workspace
      operationId: get_workspace_v1_workspaces__workspace_id__get
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: verbose
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Workspaces
      x-hosts:
        - daemon
    delete:
      summary: Delete a workspace
      operationId: delete_workspace_v1_workspaces__workspace_id__delete
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkspaceResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/logs:
    get:
      summary: List workspace logs
      operationId: workspace_logs_v1_workspaces__workspace_id__logs_get
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: session
          in: query
          description: Only this session; absent or empty selects all sessions.
          schema:
            type: string
        - name: limit
          in: query
          description: Commands per JSON page. Ignored for JSONL export.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: after
          in: query
          description: Opaque next cursor from the previous page with the same filters. Ignored
            for JSONL export.
          schema:
            type: string
        - name: format
          in: query
          description: jsonl downloads all retained matching commands; other values select JSON.
          schema:
            type: string
            default: json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
              example:
                items:
                  - id: c1
                    command: echo hi
                    cwd: /
                    started_at: 1700000000000
                    duration_ms: 8
                    exit_code: 0
                    stdout: 'hi

                      '
                    stderr: ''
                    user_id: null
                    api_key_id: null
                    mounts: []
                next: null
            application/x-ndjson:
              schema:
                type: string
              example: '{"type":"command","session":"s1","timestamp":1700000000000,"id":"c1","command":"echo
                hi"}

                {"type":"result","session":"s1","timestamp":1700000000008,"parent":"c1","duration_ms":8,"exit_code":0,"stdout":"hi\n","stderr":""}

                '
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '403':
          $ref: '#/components/responses/403'
      description: 'Return completed commands newest first by start time and ID, with their mount
        calls. JSON started_at values and durations are milliseconds. JSONL exports all retained
        matching commands oldest first as command, vfs and result records, linked by parent, with
        timestamp in Unix milliseconds. JSONL ignores limit and after. Empty JSON is {items: [],
        next: null}; empty JSONL has an empty body. Retention is server-specific. Cursors are
        opaque and server-specific; pagination is not a snapshot.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/stop:
    post:
      summary: Stop a workspace
      operationId: stop_workspace_v1_workspaces__workspace_id__stop_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkspaceResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: 'Stop the workspace and keep its state and config for start. A stopped workspace
        answers as it is, so a stop can be repeated.


        RAM file contents do not survive stopping and starting. Save files to persistent storage
        before stopping the workspace.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/start:
    post:
      summary: Start a workspace
      operationId: start_workspace_v1_workspaces__workspace_id__start_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      description: 'Start a stopped workspace from the config it was created with, over the state
        it kept; a running one answers as it is.


        The server''s policies judge the config again, and the secrets and saved entries it names
        are read again, so a rotated secret is picked up.


        RAM file contents do not survive stopping and starting. Save files to persistent storage
        before stopping the workspace.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/cancel:
    post:
      summary: Cancel a workspace's lines
      operationId: cancel_workspace_lines_v1_workspaces__workspace_id__cancel_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelLinesResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: Cancel every session's running and queued lines; all stay open.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/kill:
    post:
      summary: Kill a workspace's jobs
      operationId: kill_workspace_jobs_v1_workspaces__workspace_id__kill_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillJobsResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: Kill every session's background jobs and runners.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/profiles/{name}:
    put:
      summary: Set a profile
      operationId: set_profile_v1_workspaces__workspace_id__profiles__name__put
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionProfile'
            example:
              cwd: /
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                name: analyst
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Set Profile V1 Workspaces  Workspace Id  Profiles  Name  Put
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: 'Define a named profile on the live workspace, or replace it.


        Only the live table changes: a session moves when it is updated

        onto the name, and the workspace''s config is never rewritten.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/clis/{name}:
    put:
      summary: Install an MCP CLI
      operationId: set_cli_v1_workspaces__workspace_id__clis__name__put
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CLIBlock'
            example:
              cli: mcp
              config:
                url: https://mcp.example.com/mcp
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                name: remote
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Set Cli V1 Workspaces  Workspace Id  Clis  Name  Put
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: 'Install an MCP server as a CLI on the live workspace.


        The body is one `clis:` entry, `cli: mcp` with its config, as a

        config file states it. Its pointers resolve and its tools are listed

        under the workspace''s network. A name already installed answers 409.'
      tags:
        - Workspaces
      x-hosts:
        - daemon
    delete:
      summary: Remove an MCP CLI
      operationId: delete_cli_v1_workspaces__workspace_id__clis__name__delete
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                name: remote
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Delete Cli V1 Workspaces  Workspace Id  Clis  Name  Delete
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      description: Remove an MCP CLI from the live workspace.
      tags:
        - Workspaces
      x-hosts:
        - daemon
  /v1/workspaces/{workspace_id}/clone:
    post:
      summary: Clone a workspace
      operationId: clone_workspace_v1_workspaces__workspace_id__clone_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneWorkspaceRequest'
            example:
              id: demo-copy
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      x-excluded: true
  /v1/workspaces/{workspace_id}/snapshot:
    get:
      summary: Download a snapshot
      operationId: download_snapshot_v1_workspaces__workspace_id__snapshot_get
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: The tar archive, with secrets redacted
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      x-excluded: true
    post:
      summary: Snapshot a workspace
      operationId: snapshot_workspace_v1_workspaces__workspace_id__snapshot_post
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotWorkspaceRequest'
            example:
              key: demo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotWorkspaceResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      x-excluded: true
  /v1/workspaces/load:
    post:
      summary: Load a snapshot
      operationId: load_workspace_v1_workspaces_load_post
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '413':
          $ref: '#/components/responses/413'
      tags:
        - Snapshots
      x-hidden: true
      x-hosts:
        - daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadRequest'
            example:
              key: demo
              id: restored
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: '#/components/schemas/LoadRequest'
                snapshot:
                  type: string
                  format: binary
                  description: The tar archive, up to 1 GiB.
              required:
                - snapshot
      x-excluded: true
  /v1/templates:
    get:
      summary: List templates
      operationId: list_templates_v1_templates_get
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      description: The saved templates, by name.
      tags:
        - Templates
      x-hosts:
        - daemon
    post:
      summary: Create a template
      operationId: create_template_v1_templates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            example:
              name: demo
              config:
                mounts:
                  /:
                    vfs: ram
                    mode: write
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          $ref: '#/components/responses/401'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      description: 'Save a template: a whole workspace config, checked as a create

        checks one, and kept as written. A name already saved is a 409.'
      tags:
        - Templates
      x-hosts:
        - daemon
  /v1/templates/{ref}:
    get:
      summary: Get a template
      operationId: get_template_v1_templates__ref__get
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      tags:
        - Templates
      x-hosts:
        - daemon
    delete:
      summary: Delete a template
      operationId: delete_template_v1_templates__ref__delete
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
          $ref: '#/components/responses/501'
      description: Delete a template; `restore` brings it back.
      tags:
        - Templates
      x-hosts:
        - daemon
  /v1/templates/{ref}/restore:
    post:
      summary: Restore a template
      operationId: restore_template_v1_templates__ref__restore_post
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/429'
        '501':
