          type: string
          title: Url
          default: redis://localhost:6379/0
        key_prefix:
          anyOf:
            - type: string
            - type: 'null'
          title: Key Prefix
      additionalProperties: false
      type: object
      required:
        - type
      title: RedisIndexBlock
    RedisStoreBlock:
