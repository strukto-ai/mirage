ci:
  # https://pre-commit.ci/#configuration
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: No commits to master
      - id: end-of-file-fixer
        name: End-of-file fixer
        exclude: |
          (?x)^(
              typescript/.*|
              integ/truth\.txt|
              integ/fixtures/.*
          )$
      - name: mixed-line-ending
        id: mixed-line-ending
        args: [--fix, lf]
        exclude: |
          (?x)^(
              typescript/.*|
              integ/truth\.txt|
              integ/fixtures/.*
          )$
      - id: trailing-whitespace
        name: Remove trailing whitespaces
        exclude: |
          (?x)^(
              typescript/.*|
              integ/truth\.txt|
              integ/fixtures/.*
          )$
      - id: check-toml
        name: Check toml
      - id: check-yaml
        name: Check yaml
        exclude: |
          (?x)^(
              conda/pytorch-geometric/meta.yaml|
              conda/pyg/meta.yaml|
              typescript/.*
          )$

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: Lint yaml
        args: [-d, '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {level: error}, braces: {max-spaces-inside: 1}}}']
        exclude: ^typescript/

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.0
    hooks:
      - id: pyupgrade
        name: Upgrade Python syntax
        args: [--py38-plus]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        name: Format code
        # Python only: this hook also takes Markdown, where it would reformat
        # the code blocks in 15 READMEs and docs pages.
        types_or: [python, pyi]
      - id: ruff-check
        name: Lint and fix Python
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: Format Markdown
        additional_dependencies:
          - mdformat-gfm
          - mdformat_frontmatter
          - mdformat_footnote
        exclude: |
          (?x)^(
              test/data/cursor\.md|
              typescript/.*|
              integ/fixtures/.*
          )$

  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.1
    hooks:
      - id: sphinx-lint
        name: Check Sphinx

  - repo: local
    hooks:
      - id: ts-format
        name: Format (typescript)
        entry: typescript/scripts/precommit-run.sh oxfmt --write
        language: system
        files: ^typescript/.*\.(ts|tsx|js|mjs|cjs|json|md|yaml|yml)$
        pass_filenames: true
        # oxfmt already spreads one call over every core.
        require_serial: true
      - id: ts-eslint
        name: ESLint (typescript)
        entry: typescript/scripts/precommit-run.sh eslint --fix --no-warn-ignored
        language: system
        files: ^typescript/.*\.(ts|tsx|js|mjs|cjs)$
        pass_filenames: true
        # One batch at a time: precommit-run.sh splits a large one in two.
        require_serial: true
      - id: ts-knip
        name: Knip (typescript dead code)
        entry: bash -c 'cd typescript && node_modules/.bin/knip'
        language: system
        files: ^typescript/.*\.(ts|tsx|js|mjs|cjs|json)$
        pass_filenames: false
      - id: integ-format
        name: Format (integ)
        entry: integ/scripts/precommit-run.sh oxfmt --write
        language: system
        files: ^integ/.*\.(ts|mts|js|mjs|cjs)$
        pass_filenames: true
        require_serial: true
      - id: integ-eslint
        name: ESLint (integ)
        entry: integ/scripts/precommit-run.sh eslint --fix --no-warn-ignored
        language: system
        files: ^integ/.*\.(ts|mts|js|mjs|cjs)$
        pass_filenames: true
        # One process: 2.4 s and 0.9 GB over every file, against 3.5 s and
        # 6.4 GB split one batch per CPU.
        require_serial: true
      - id: integ-typecheck
        name: Type check (integ mock servers)
        entry: bash -c 'cd integ && node_modules/.bin/tsc -p tsconfig.check.json'
        language: system
        # Every server directory, not a hand-kept list: the list had already
        # fallen five fakes behind tsconfig.check.json, so editing one of those
        # skipped the hook that type checks it.
        files: ^integ/(server/.*\.ts|hosting/.*\.ts|access/.*\.ts|watch/.*\.ts|wandb/.*\.ts|slack_atlas\.ts|airtable_atlas\.ts|scripts/capture_airtable_atlas\.ts|tsconfig(\.check)?\.json)$
        pass_filenames: false
      - id: py-mypy
        name: Type check (mypy)
        entry: bash -c 'cd python && uv run mypy'
        language: system
        # `scripts/` too: mypy's `files` reaches it, and a hook that did
        # not fire on it would be the gate-that-never-runs shape this
        # repo keeps finding. Those files generate the parity manifests, so a type
        # error there lands as a wrong artifact, not a crash.
        files: ^(python/(mirage/.*\.py|tests/.*\.py|pyproject\.toml)|scripts/.*\.py)$
        pass_filenames: false
      - id: py-test-pathspec
        name: PathSpec discipline (tests)
        entry: python3 scripts/check_test_pathspec.py
        language: system
        # The checker itself is listed because the hook is diff-scoped in
        # CI: without it, editing the gate re-runs nothing, which is the
        # one change most likely to break it.
        files: ^(python/(mirage|tests)/.*\.py|scripts/check_test_pathspec\.py)$
        pass_filenames: false
      - id: prompt-parity
        name: VFS prompt parity
        entry: python3 scripts/check_prompt_parity.py --selftest
        language: system
        files: ^(python/mirage/vfs/.*/prompt\.py|typescript/packages/[^/]+/src/vfs/.*/prompt\.ts|scripts/check_prompt_parity\.py|scripts/parity/prompt_exceptions\.json)$
        pass_filenames: false
