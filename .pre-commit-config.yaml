ci:
  # https://pre-commit.ci/#configuration
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: No commits to master
      - id: end-of-file-fixer
        name: End-of-file fixer
        exclude: |
          (?x)^(
              typescript/.*|
              integ/truth\.txt|
              integ/fixtures/.*
          )$
      - name: mixed-line-ending
        id: mixed-line-ending
        args: [--fix, lf]
        exclude: |
          (?x)^(
              typescript/.*|
              integ/truth\.txt|
              integ/fixtures/.*
          )$
      - id: trailing-whitespace
        name: Remove trailing whitespaces
        exclude: |
          (?x)^(
              typescript/.*|
              integ/truth\.txt|
              integ/fixtures/.*
          )$
      - id: check-toml
        name: Check toml
      - id: check-yaml
        name: Check yaml
        exclude: |
          (?x)^(
              conda/pytorch-geometric/meta.yaml|
              conda/pyg/meta.yaml|
              typescript/.*
          )$

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: Lint yaml
        args: [-d, '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {level: error}, braces: {max-spaces-inside: 1}}}']
        exclude: ^typescript/

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.0
    hooks:
      - id: pyupgrade
        name: Upgrade Python syntax
        args: [--py38-plus]

  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        name: Format code
        additional_dependencies: [toml]
        # Generated tables are laid out by their generator, which packs
        # ranges several to a line so 349 of them stay reviewable.
        # Reformatting them here would fight scripts/gen_width_table.py on
        # every run, the same way typescript/.prettierignore already exempts
        # `**/generated/**`.
        exclude: |
          (?x)^(
              python/mirage/utils/generated/.*
          )$

  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: Sort imports
        exclude: |
          (?x)^(
              python/mirage/utils/generated/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
        name: Lint and fix Python
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: Format Markdown
        additional_dependencies:
          - mdformat-gfm
          - mdformat_frontmatter
          - mdformat_footnote
        exclude: |
          (?x)^(
              test/data/cursor\.md|
              typescript/.*|
              integ/fixtures/.*
          )$

  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.1
    hooks:
      - id: sphinx-lint
        name: Check Sphinx

  - repo: local
    hooks:
      - id: ts-prettier
        name: Prettier (typescript)
        entry: typescript/scripts/precommit-run.sh prettier --write
        language: system
        files: ^typescript/.*\.(ts|tsx|js|mjs|cjs|json|md|yaml|yml)$
        pass_filenames: true
      - id: ts-eslint
        name: ESLint (typescript)
        entry: typescript/scripts/precommit-run.sh eslint --fix --no-warn-ignored
        language: system
        files: ^typescript/.*\.(ts|tsx|js|mjs|cjs)$
        pass_filenames: true
      - id: ts-knip
        name: Knip (typescript dead code)
        entry: bash -c 'cd typescript && pnpm exec knip'
        language: system
        files: ^typescript/.*\.(ts|tsx|js|mjs|cjs|json)$
        pass_filenames: false
      - id: integ-prettier
        name: Prettier (integ)
        entry: integ/scripts/precommit-run.sh prettier --write
        language: system
        files: ^integ/.*\.(ts|mts|js|mjs|cjs)$
        pass_filenames: true
      - id: integ-eslint
        name: ESLint (integ)
        entry: integ/scripts/precommit-run.sh eslint --fix --no-warn-ignored
        language: system
        files: ^integ/.*\.(ts|mts|js|mjs|cjs)$
        pass_filenames: true
      - id: integ-typecheck
        name: Type check (integ mock servers)
        entry: bash -c 'cd integ && pnpm exec tsc -p tsconfig.check.json'
        language: system
        # Every server directory, not a hand-kept list: the list had already
        # fallen five fakes behind tsconfig.check.json, so editing one of those
        # skipped the only hook that type checks it.
        files: ^integ/(server/.*\.ts|tsconfig(\.check)?\.json)$
        pass_filenames: false
      - id: py-mypy
        name: Type check (mypy)
        entry: bash -c 'cd python && uv run mypy'
        language: system
        files: ^python/(mirage/.*\.py|tests/.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: py-test-pathspec
        name: PathSpec discipline (tests)
        entry: python3 scripts/check_test_pathspec.py
        language: system
        files: ^python/(mirage/.*\.py|tests/.*\.py)$
        pass_filenames: false
