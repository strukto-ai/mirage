[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mirage-rs"
description = "Byte-level command streams shared by Mirage's Python and TypeScript hosts"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
dynamic = ["version"]

[tool.maturin]
module-name = "mirage_rs"
features = ["pyo3/extension-module"]

# uv rebuilds a path source only when one of these changes; by default that
# is pyproject.toml alone, which would leave a Rust edit unbuilt.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "src/**/*.rs" },
  { file = "../Cargo.toml" },
  { file = "../Cargo.lock" },
  { file = "../mirage-rs/Cargo.toml" },
  { file = "../mirage-rs/src/**/*.rs" },
  { file = "../mirage-rs/src/generated/*.dfa" },
  { file = "../vendor/grep-regex/Cargo.toml" },
  { file = "../vendor/grep-regex/src/**/*.rs" },
]
