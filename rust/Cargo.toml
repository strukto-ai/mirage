[workspace]
resolver = "3"
members = ["fuse", "gh-wasm", "mirage-rs", "pdf-wasm", "python", "shell-wasm", "wasm"]
exclude = ["vendor/grep-regex"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/strukto-ai/mirage"
rust-version = "1.88"

[workspace.dependencies]
mirage-rs = { path = "mirage-rs" }
grep-regex = { path = "vendor/grep-regex", version = "=0.1.13" }
grep-matcher = "=0.1.7"
md5 = { package = "md-5", version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
memchr = { version = "2", default-features = false, features = ["std"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
regex-automata = { version = "=0.4.18", default-features = false, features = [
  "std",
  "syntax",
  "meta",
  "hybrid",
  "nfa-pikevm",
  "dfa-search",
  "perf-literal-substring",
  "perf-literal-multisubstring",
] }
regex-syntax = { version = "=0.8.11", default-features = false, features = [
  "std",
  "unicode-bool",
  "unicode-case",
  "unicode-gencat",
  "unicode-script",
] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
pyo3 = { version = "0.30", features = ["abi3-py312"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# A module that waits on a service, so its whole tree is built for size.
[profile.wasm-size]
inherits = "release"
opt-level = "z"

# What CI's test jobs build mirage._rs with (.github/actions/setup-uv). Each
# job that syncs the venv compiles it, and release's fat LTO over one codegen
# unit was most of that sync. Same opt-level; the wheels keep release.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
