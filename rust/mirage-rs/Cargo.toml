[package]
name = "mirage-rs"
description = "Byte-level command streams shared by Mirage's Python and TypeScript hosts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake2 = { version = "0.11", default-features = false }
byteorder = "1.5"
bzip2 = "0.6.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
grep-regex.workspace = true
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "encoder", "xz"] }
md5.workspace = true
memchr.workspace = true
num-derive = "0.4"
num-bigint.workspace = true
num-traits.workspace = true
regex-automata.workspace = true
regex-syntax.workspace = true
sha1.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = { version = "3.2.0", default-features = false, features = ["std", "text"] }

[dev-dependencies]
grep-matcher.workspace = true
