[package]
name = "mirage-ast-grep"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A freestanding build with C grammars, released as one bounded module
# in both host packages. It has its own reproducible dependency lock.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ast-grep-config = "=0.51.3"
ast-grep-core = { version = "=0.51.3", features = ["tree-sitter"] }
ast-grep-language = { version = "=0.51.3", default-features = false, features = ["tree-sitter-javascript", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-typescript"] }
ast-grep-outline = "=0.51.3"
codespan-reporting = { version = "=0.13.1", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "=3.2.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
