# Dependencies whose license scripts/check_dependency_licenses.py cannot
# pass on its own: what ships, and the tools that only build and test it,
# which run on every contributor's machine and in CI. Each entry holds for
# the license expression it names: when a release changes it, the check
# fails again until the entry is reviewed. `name` may be a glob, for
# packages published per platform.
#
# LicenseRef-Unknown means the package metadata names no license, so the
# license below was read from the locked release's own files. An entry
# whose license has a LicenseRef id rests on such a reading, and names
# the `version` it was read from (a glob, like `name`): another release
# fails the check until it is read again.

# --- metadata names no license; checked by hand ---

[[python]]
name = "daytona-analytics-api-client*"
license = "LicenseRef-Unknown"
version = "0.227.0"
reason = "Apache-2.0: the LICENSE in both 0.227.0 wheels. Reached through the daytona extra."

[[python]]
name = "protobuf-py-ext"
license = "LicenseRef-Unknown"
version = "0.6.0"
reason = "Apache-2.0: bufbuild/protobuf-py's LICENSE at its 0.6.0 release commit 31342760dd7673273200b0f24e290680827fd203; the package metadata names no license. Reached through the e2b extra."

[[python]]
name = "lupa"
license = "LicenseRef-Unknown"
version = "2.8"
reason = "MIT: Lupa's own and the bundled Lua's MIT notices in the 2.8 wheel's LICENSE.txt; the metadata says only 'MIT style'. The dev group, through fakeredis[lua]."

[[python]]
name = "mypy-extensions"
license = "LicenseRef-Unknown"
version = "1.1.0"
reason = "MIT: the LICENSE in the 1.1.0 wheel, whose METADATA says License-Expression: MIT, a field PyPI's JSON leaves out. The dev group, through mypy."

[[npm]]
