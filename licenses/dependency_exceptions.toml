# Shipped dependencies whose license scripts/check_dependency_licenses.py
# cannot pass on its own. Each entry holds for the license expression it
# names: when a release changes it, the check fails again until the entry
# is reviewed. `name` may be a glob, for packages published per platform.
#
# LicenseRef-Unknown means the package metadata names no license, so the
# license below was read from the locked release's own files. An entry
# whose license has a LicenseRef id rests on such a reading, and names
# the `version` it was read from (a glob, like `name`): another release
# fails the check until it is read again.

# --- metadata names no license; checked by hand ---

[[python]]
name = "daytona-analytics-api-client*"
license = "LicenseRef-Unknown"
version = "0.207.0"
reason = "Apache-2.0: the LICENSE in both 0.207.0 wheels. Reached through the daytona extra."

[[python]]
name = "protobuf-py-ext"
license = "LicenseRef-Unknown"
version = "0.1.1"
reason = "Apache-2.0: the LICENSE of bufbuild/protobuf-py, which builds it; the wheel carries none. Reached through the e2b extra."

