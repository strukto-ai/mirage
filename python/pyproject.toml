[project]
name = "mirage-ai"
version = "0.0.8a2"
description = "A unified virtual filesystem for AI agents. Mount S3, Google Drive, Slack, Gmail, GitHub, Linear, Notion, Postgres, MongoDB, SSH, and more behind one filesystem so agents read, write, and pipe across services with familiar shell commands."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
authors = [
    { name = "Zecheng Zhang", email = "zecheng@strukto.ai" },
]
keywords = [
    "ai-agents",
    "filesystem",
    "vfs",
    "fuse",
    "s3",
    "google-drive",
    "slack",
    "agent-tools",
    "shell",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.14.4",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.27",
    "orjson>=3.11",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-bash>=0.25.1",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.41.0",
    "jq>=1.12.0",
    "pyjwt[crypto]>=2.14.0",
    "dulwich>=1.2.9",
    "tenacity>=9.1.4",
    "mcp>=2.3.0,<3",
    "jsonschema>=4.26.0",
    "regex>=2026.4.4",
    "multidict>=6.0",
]

[project.urls]
Homepage = "https://www.strukto.ai/"
Repository = "https://github.com/strukto-ai/mirage"
Documentation = "https://docs.mirage.strukto.ai"
Issues = "https://github.com/strukto-ai/mirage/issues"

[project.scripts]
mirage = "mirage.cli.main:main"
mirage-bash = "mirage.cli.bash:main"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The streams both hosts run are compiled from rust/ into mirage._rs, so a
# wheel is per platform and carries everything under mirage/ beside it.
# That includes py.typed, which is PEP 561 consent: without the marker a
# type checker refuses to read an installed package's annotations and
# every mirage import resolves to Any, so our own gated-at-zero mypy proves
# nothing to anyone downstream. It caught the 0.0.5 build_vfs break in one
# line.
[tool.maturin]
manifest-path = "../rust/python/Cargo.toml"
module-name = "mirage._rs"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**"]

[project.optional-dependencies]
# --- python runtime (sandboxed python3 default) ---
# Pinned exactly: monty's API is still moving fast (0.0.19 replaced the whole
# execution model, 0.0.20 split the distribution into client + runtime
# packages), and upstream pins its own worker binary the same way.
monty    = ["pydantic-monty==1.0.0"]
wasi     = ["wasmtime>=46"]
quickjs  = ["wasmtime>=46"]

# --- storage / object stores ---
s3       = ["aioboto3>=15.5.0", "botocore>=1.40.61"]
r2       = ["aioboto3>=15.5.0", "botocore>=1.40.61"]
gcs      = ["aioboto3>=15.5.0", "botocore>=1.40.61"]
oci      = ["aioboto3>=15.5.0", "botocore>=1.40.61"]

# --- network / remote ---
ssh      = ["asyncssh>=2.23.0"]
nextcloud = ["opendal>=0.47.1"]

# --- huggingface ---
# hf_buckets is HF's Xet object store and reaches it through OpenDAL. The
# three Hub repo VFS (hf_models / hf_datasets / hf_spaces) speak the
# Hub API over aiohttp, which is a core dependency, so they need no extra
# at all and must not be documented as needing this one.
hf-buckets = ["opendal>=0.47.1"]

# --- mount ---
fuse     = ["mfusepy>=1.0.0"]

# --- mongodb ---
mongodb  = ["pymongo>=4.9"]

# --- gridfs ---
gridfs   = ["pymongo>=4.9"]

# --- postgres ---
postgres = ["asyncpg>=0.30.0"]

# --- redis ---
redis    = ["redis[hiredis]>=5.0"]

# --- mail ---
email    = ["aiosmtplib>=5.1.0"]

# --- secrets sources ---
dotenv   = ["python-dotenv>=1.2.2"]
aws-sm   = ["aioboto3>=15.5.0", "botocore>=1.40.61"]
1password = ["onepassword-sdk>=0.4.1"]

# --- data ---

# --- observability ---
langfuse = ["langfuse>=4.2.0"]

# --- chroma ---
# thin HTTP-only client; the accessor uses AsyncHttpClient exclusively
chroma   = ["chromadb-client>=1.0.0"]

# --- qdrant ---
qdrant   = ["qdrant-client>=1.18.0"]

# --- openai ---
openai      = ["openai>=3.37.0", "openai-agents>=0.24.0"]

# --- pydantic-ai ---
pydantic-ai = [
    "pydantic-ai-slim>=2.61.0",
    "pydantic-ai-backend[console]>=0.2.37",
]

# --- deepagents ---
deepagents  = [
    "deepagents>=0.7.32",
]

# --- agno ---
agno        = [
    "agno>=3.1.10",
]

# --- claude-agent-sdk ---
claude-agent-sdk = [
    "claude-agent-sdk>=0.2.174",
]

# --- claude-managed-agents ---
claude-managed-agents = [
    "anthropic>=0.122.0",
]

# --- sandboxes ---
daytona     = [
    "daytona>=0.176.0",
]

# --- meta: install everything ---
all = [
    "mirage-ai[s3]",
    "mirage-ai[r2]",
    "mirage-ai[gcs]",
    "mirage-ai[oci]",
    "mirage-ai[ssh]",
    "mirage-ai[nextcloud]",
    "mirage-ai[hf-buckets]",
    "mirage-ai[fuse]",
    "mirage-ai[mongodb]",
    "mirage-ai[gridfs]",
    "mirage-ai[postgres]",
    "mirage-ai[redis]",
    "mirage-ai[email]",
    "mirage-ai[dotenv]",
    "mirage-ai[aws-sm]",
    "mirage-ai[1password]",
    "mirage-ai[langfuse]",
    "mirage-ai[mem0]",
    "mirage-ai[chroma]",
    "mirage-ai[qdrant]",
    "mirage-ai[openai]",
    "mirage-ai[pydantic-ai]",
    "mirage-ai[deepagents]",
    "mirage-ai[agno]",
    "mirage-ai[claude-agent-sdk]",
    "mirage-ai[claude-managed-agents]",
    "mirage-ai[daytona]",
    "mirage-ai[e2b]",
]
sandbox = [
    "mirage-ai[s3]",
    "mirage-ai[r2]",
    "mirage-ai[gcs]",
    "mirage-ai[oci]",
    "mirage-ai[ssh]",
    "mirage-ai[nextcloud]",
    "mirage-ai[hf-buckets]",
    "mirage-ai[fuse]",
    "mirage-ai[mongodb]",
    "mirage-ai[gridfs]",
    "mirage-ai[postgres]",
    "mirage-ai[redis]",
    "mirage-ai[email]",
    "mirage-ai[langfuse]",
    "mirage-ai[chroma]",
    "mirage-ai[qdrant]",
]
lancedb = [
    "lancedb>=0.33.0",
]
mem0 = [
    "mem0ai>=2.0.6",
]
e2b = [
    "e2b>=2.35.0",
]

[tool.uv]
constraint-dependencies = ["pypdf>=6.19.0"]
# uv rebuilds the project only when one of these changes; by default that
# is pyproject.toml alone, which would leave a Rust edit unbuilt.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../rust/Cargo.toml" },
  { file = "../rust/Cargo.lock" },
  { file = "../rust/python/Cargo.toml" },
  { file = "../rust/python/src/**/*.rs" },
  { file = "../rust/mirage-rs/Cargo.toml" },
  { file = "../rust/mirage-rs/src/**/*.rs" },
  { file = "../rust/mirage-rs/src/generated/*.dfa" },
  { file = "../rust/vendor/grep-regex/Cargo.toml" },
  { file = "../rust/vendor/grep-regex/src/**/*.rs" },
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.6",
    "python-dotenv>=1.2.2",
    "moto[s3,server]>=5.1.22",
    "pre-commit",
    "pytest",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.36.0",
    "pytest-xdist>=3.8.0",
    "mypy>=2.3.0",
    "deadcode>=2.4.1",
    "websockets>=15.0.1",
    "fakeredis[lua]>=2.35.1",
    "google-auth-oauthlib>=1.3.1",
    "tzdata>=2026.5",
]

# Advisory dead-code finder for local use only. NOT a CI gate and not a
# pre-commit hook: the tool still misreports ~200 live symbols here (see
# below), so a red run means "read the diff", never "the build is broken".
#
# Run it as:  uv run deadcode mirage/
#
# `mirage/` and NOT `tests/` is the load-bearing part of that command. A
# symbol referenced only by its own test is dead production code, and
# passing tests/ would count that test as a consumer and hide it. Every
# symbol removed in the dead-code sweep was found exactly this way.
#
# The ignore lists below are false positives, not debt. deadcode resolves
# names statically, so anything invoked by a framework rather than by name
# reads as unused, and its four --ignore-*-decorated-with flags are no-ops
# in 2.4.1, so a decorator cannot be excused as a decorator:
#   *_cmd            typer verbs registered via @app.command(...)
#   _validate_*      pydantic @field_validator / @model_validator methods
#   _normalize_*     (same)
#   __*__            Protocol __call__, __getattr__ lazy-import shims
#   runtime/wasm     WASI ABI constant tables, complete on purpose
#   server/routers   FastAPI handlers registered via @router.get/post
#   agents/*         adapters implementing third-party framework interfaces
#   fuse/*           libfuse callbacks dispatched by signature
[tool.deadcode]
ignore-names = [
    "*_cmd",
    "__*__",
    "_validate_*",
    "_normalize_*",
    "_check_*",
    "_coerce_*",
    "_v_*",
]
ignore-names-in-files = [
    "mirage/runtime/wasm/*",
    "mirage/server/routers/*",
    "mirage/agents/*",
    "mirage/fuse/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "network: tests that require network access",
    "no_host_override: skip the tests/server/conftest autouse MIRAGE_ALLOWED_HOSTS=* override",
    "no_auth_override: skip the tests/server/conftest autouse MIRAGE_AUTH_MODE=local-with-no-token override",
]

[tool.mypy]
python_version = "3.12"
# `files`, not `packages`: the two are mutually exclusive ("May only
# specify one of: module/package, files, or command") and `scripts/` is a
# directory of top-level modules, not a package. It is listed for the
# reason typescript/scripts is a pnpm workspace member -- those 13 files
# generate `spec/` and gate CI (`gen_specs.py` is what the Spec drift
# step runs), and no typechecker read one of them. The first run found
# 27 errors in 5 files, among them six capability slots read off a bare
# `type` in `gen_specs.py`: the same shape `vfs_facts.ts` was fixed
# for on the typescript side.
files = ["mirage", "../scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = true
# Every module, rather than an allowlist of 54 against 1826. The
# allowlist could only ever name what someone remembered to add, so the
# handles CLAUDE.md prescribes types for (`accessor: Accessor`,
# `index: IndexCacheStore | None`) went unannotated everywhere it did
# not reach. TypeScript gets the same guarantee from `strict` in
# tsconfig.base.json, inherited by every package.
disallow_untyped_defs = true
warn_return_any = true
